<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log — Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="health-style.css">
<style>
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
.rec { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s; }
.rec:hover { box-shadow: var(--shadow-lg); }
.rec-thumb { height: 128px; background: var(--cream); display: flex; align-items: center;
  justify-content: center; font-size: 40px; position: relative; overflow: hidden; cursor: pointer; }
.rec-thumb img { width: 100%; height: 100%; object-fit: cover; }
.rec-count { position: absolute; bottom: 7px; right: 7px; background: rgba(10,61,54,.85); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; }
.rec-body { padding: 12px 14px 13px; flex: 1; display: flex; flex-direction: column; }
.rec-cat { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 4px; }
.rec-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 5px; }
.rec-meta { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
.rec-foot { display: flex; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--grid); }
.drop { border: 2px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center;
  color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all .18s; background: #fdfdfc; }
.drop:hover, .drop.over { border-color: var(--teal); background: var(--teal-wash); color: var(--teal); }
.att-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--grid);
  border-radius: 7px; margin-bottom: 6px; font-size: 12.5px; }
.att-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-row .s { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.imp-bar { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 9px; }
.imp-keep { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px;
  background: var(--teal-wash); border-radius: 9px; cursor: pointer; }
.imp-keep input { margin-top: 2px; accent-color: var(--teal); width: 16px; height: 16px; flex-shrink: 0; }
.imp-keep .hint { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
#impTable td { padding: 6px 8px; }
#impTable input[type=date], #impTable select, #impTable input[type=text] {
  padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
  font-size: 12px; outline: none; width: 100%; background: var(--surface); }
#impTable .fname { font-size: 11.5px; color: var(--text-muted); max-width: 210px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#impTable input[type=checkbox] { accent-color: var(--teal); width: 15px; height: 15px; }
</style>
</head>
<body data-i18n-doctitle="dc.title">
<div class="container wide">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="dc.title"></div>
      <div class="page-sub" data-i18n="dc.sub"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-outline" onclick="document.getElementById('folderInput').click()" data-i18n="dc.importFolder"></button>
      <button class="btn btn-gold" onclick="openRecord()" data-i18n="dc.fileDoc"></button>
    </div>
  </div>

  <div class="filters">
    <input class="search-box" id="searchBox" data-i18n-ph="dc.searchPh" oninput="render()">
    <span id="catFilters"></span>
  </div>

  <input type="file" id="folderInput" webkitdirectory multiple style="display:none" onchange="scanFolder(this)">
  <div id="recBox"></div>

</div>

<!-- ── Record modal ────────────────────────────────────────── -->
<div class="modal-overlay" id="recModal">
  <div class="modal wide">
    <h2 id="recTitle">File a document</h2>
    <div class="modal-sub" data-i18n="dc.modalSub"></div>

    <input type="hidden" id="r_id">

    <div class="form-group">
      <label data-i18n="dc.files"></label>
      <div class="drop" id="dropZone">
        <div style="font-size:26px;margin-bottom:6px">📎</div>
        <span data-i18n="dc.dropTitle"></span><br>
        <span style="font-size:11px" data-i18n="dc.dropSub"></span>
      </div>
      <input type="file" id="fileInput" multiple style="display:none">
      <div id="attList" style="margin-top:10px"></div>
    </div>

    <div class="form-row">
      <div class="form-group"><label data-i18n="dc.docDate"></label><input type="date" id="r_date"></div>
      <div class="form-group"><label data-i18n="dc.type"></label><select id="r_category"></select></div>
    </div>

    <div class="form-group">
      <label data-i18n="common.title"></label>
      <input type="text" id="r_title" data-i18n-ph="dc.titlePh">
    </div>

    <div class="form-row">
      <div class="form-group"><label data-i18n="dc.from"></label><input type="text" id="r_source" placeholder="Dr. …"></div>
      <div class="form-group"><label data-i18n="common.linkEvent"></label><select id="r_event"></select></div>
    </div>

    <div class="form-group">
      <label data-i18n="dc.tags"></label>
      <input type="text" id="r_tags" data-i18n-ph="dc.tagsPh">
    </div>

    <div class="form-group">
      <label data-i18n="common.notes"></label>
      <textarea id="r_notes" data-i18n-ph="dc.notesPh"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="rDeleteBtn" onclick="deleteRecord()" style="margin-right:auto;display:none" data-i18n="common.delete"></button>
      <button class="btn btn-outline" onclick="closeModal('recModal')" data-i18n="common.cancel"></button>
      <button class="btn btn-teal" onclick="saveRecord()" data-i18n="common.save"></button>
    </div>
  </div>
</div>

<!-- ── Folder import ─────────────────────────────────────── -->
<div class="modal-overlay" id="importModal">
  <div class="modal wide">
    <h2 data-i18n="dc.importTitle"></h2>
    <div class="modal-sub" data-i18n="dc.importSub"></div>

    <div class="imp-bar">
      <span id="impCount"></span>
      <span style="margin-left:auto;display:flex;gap:7px">
        <button class="btn btn-outline btn-sm" onclick="impSelectAll(true)" data-i18n="dc.selectAll"></button>
        <button class="btn btn-outline btn-sm" onclick="impSelectAll(false)" data-i18n="dc.selectNone"></button>
      </span>
    </div>

    <div class="table-wrap" style="max-height:46vh;overflow-y:auto;border:1px solid var(--grid);border-radius:9px">
      <table class="data" id="impTable"></table>
    </div>

    <label class="imp-keep">
      <input type="checkbox" id="impKeepCopy" checked>
      <span>
        <span style="font-weight:600" data-i18n="dc.importKeepCopy"></span>
        <span class="hint" style="margin-top:2px" data-i18n="dc.importKeepCopyHint"></span>
      </span>
    </label>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('importModal')" data-i18n="common.cancel"></button>
      <button class="btn btn-teal" id="impGo" onclick="runImport()"></button>
    </div>
  </div>
</div>

<script src="health-i18n.js"></script>
<script src="health-base.js"></script>
<script>
let catFilter = 'all';
let pendingAtts = [];      // attachment metadata for the record being edited
let thumbUrls = [];        // object URLs to revoke on the next render

/* ── Filters ───────────────────────────────────────────────── */
function buildCatFilters() {
  const counts = {};
  getRecords().forEach(r => { counts[r.category] = (counts[r.category] || 0) + 1; });
  const btns = [`<button class="chip-btn${catFilter === 'all' ? ' active' : ''}" data-cat="all" onclick="setCat('all', this)">${esc(t('common.all'))}</button>`]
    .concat(Object.entries(RECORD_CATEGORIES)
      .filter(([k]) => counts[k])
      .map(([k, c]) => `<button class="chip-btn${catFilter === k ? ' active' : ''}" data-cat="${k}" onclick="setCat('${k}', this)">${c.icon} ${esc(L(c))} <span style="opacity:.6">${counts[k]}</span></button>`));
  document.getElementById('catFilters').innerHTML = btns.join(' ');
}
function setCat(c, btn) {
  catFilter = c;
  document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

/* ── Modal ─────────────────────────────────────────────────── */
function buildSelects(rec) {
  document.getElementById('r_category').innerHTML = Object.entries(RECORD_CATEGORIES)
    .map(([k, c]) => `<option value="${k}" ${rec && rec.category === k ? 'selected' : ''}>${c.icon} ${esc(L(c))}</option>`).join('');
  document.getElementById('r_event').innerHTML = [`<option value="">${esc(t('common.notLinked'))}</option>`]
    .concat(getEvents().slice().reverse().slice(0, 120).map(e =>
      `<option value="${e.id}" ${rec && rec.eventId === e.id ? 'selected' : ''}>${esc(fmtDate(e.date))} · ${esc(e.title || eventLabel(e.type))}</option>`)).join('');
}

function openRecord(id) {
  const r = id ? Store.find(HK.records, id) : null;
  document.getElementById('recTitle').textContent = t(r ? 'dc.modalEdit' : 'dc.modalAdd');
  document.getElementById('rDeleteBtn').style.display = r ? '' : 'none';
  document.getElementById('r_id').value     = r ? r.id : '';
  document.getElementById('r_date').value   = r ? r.date : todayISO();
  document.getElementById('r_title').value  = r ? (r.title || '') : '';
  document.getElementById('r_source').value = r ? (r.source || '') : '';
  document.getElementById('r_tags').value   = r ? (r.tags || []).join(', ') : '';
  document.getElementById('r_notes').value  = r ? (r.notes || '') : '';
  buildSelects(r);
  pendingAtts = r ? (r.attachments || []).slice() : [];
  renderAtts();
  openModal('recModal');
}

function renderAtts() {
  document.getElementById('attList').innerHTML = pendingAtts.map((a, i) => `
    <div class="att-row">
      <span>${fileIcon(a.type, a.name)}</span>
      <span class="n" title="${esc(a.name)}">${esc(a.name)}</span>
      <span class="s">${fmtBytes(a.size)}</span>
      <button class="btn btn-outline btn-sm" onclick="previewAtt(${i})">${esc(t('dc.view'))}</button>
      <button class="btn btn-sm" style="background:none;color:var(--critical)" onclick="dropAtt(${i})" title="Remove">×</button>
    </div>`).join('');
}
function previewAtt(i) { Files.open_(pendingAtts[i]); }
function dropAtt(i) {
  const a = pendingAtts[i];
  confirmAction(t('dc.removeFileQ'), t('dc.removeFileBody', { name: a.name }), t('common.remove'), async () => {
    await Files.del(a.id);
    pendingAtts.splice(i, 1);
    renderAtts();
    toast(t('dc.fileRemoved'));
  });
}

function fileIcon(type, name) {
  const t = (type || '') + ' ' + (name || '');
  if (/image|jpe?g|png|heic|webp/i.test(t)) return '🖼';
  if (/pdf/i.test(t))  return '📕';
  if (/word|docx?/i.test(t)) return '📘';
  if (/sheet|xlsx?|csv/i.test(t)) return '📗';
  return '📄';
}

/* ── Uploads ───────────────────────────────────────────────── */
const drop = document.getElementById('dropZone');
const input = document.getElementById('fileInput');
drop.onclick = () => input.click();
input.onchange = e => { takeFiles(e.target.files); input.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) takeFiles(e.dataTransfer.files); });

async function takeFiles(files) {
  for (const f of files) {
    if (f.size > 25 * 1024 * 1024) { toast(t('dc.tooBig', { name: f.name }), 'error'); continue; }
    try {
      const id = await Files.put(f);
      pendingAtts.push({ id, name: f.name, type: f.type, size: f.size });
    } catch (e) {
      toast(t('dc.storeFail', { name: f.name }), 'error');
    }
  }
  renderAtts();
  /* Give an untitled record a sensible name from the first file. */
  const t = document.getElementById('r_title');
  if (!t.value && pendingAtts.length) t.value = pendingAtts[0].name.replace(/\.[^.]+$/, '');
}

/* ── Save / delete ─────────────────────────────────────────── */
function saveRecord() {
  const date = document.getElementById('r_date').value;
  const title = document.getElementById('r_title').value.trim();
  if (!date)  { toast(t('dc.needDate'), 'error'); return; }
  if (!title) { toast(t('dc.needTitle'), 'error'); return; }

  const rec = Store.find(HK.records, document.getElementById('r_id').value) || {};
  rec.date        = date;
  rec.category    = document.getElementById('r_category').value;
  rec.title       = title;
  rec.source      = document.getElementById('r_source').value.trim();
  rec.eventId     = document.getElementById('r_event').value;
  rec.tags        = document.getElementById('r_tags').value.split(',').map(s => s.trim()).filter(Boolean);
  rec.notes       = document.getElementById('r_notes').value.trim();
  rec.attachments = pendingAtts;

  Store.upsert(HK.records, rec);
  closeModal('recModal');
  toast(t('dc.filed'));
  render();
}

function deleteRecord() {
  const id = document.getElementById('r_id').value;
  if (!id) return;
  const rec = Store.find(HK.records, id);
  confirmAction(t('dc.deleteQ'), t('dc.deleteBody', { n: (rec.attachments || []).length }), t('common.delete'), async () => {
      for (const a of (rec.attachments || [])) await Files.del(a.id);
      Store.remove(HK.records, id);
      closeModal('recModal');
      toast(t('common.deleted'));
      render();
    });
}

/* ── Render ────────────────────────────────────────────────── */
async function render() {
  buildCatFilters();
  thumbUrls.forEach(u => URL.revokeObjectURL(u));
  thumbUrls = [];

  const q = (document.getElementById('searchBox').value || '').toLowerCase().trim();
  let recs = getRecords();
  if (catFilter !== 'all') recs = recs.filter(r => r.category === catFilter);
  if (q) recs = recs.filter(r =>
    (r.title + ' ' + (r.source || '') + ' ' + (r.notes || '') + ' ' + (r.tags || []).join(' ') + ' ' + fmtDate(r.date))
      .toLowerCase().includes(q));

  const box = document.getElementById('recBox');
  if (!recs.length) {
    const filtered = q || catFilter !== 'all';
    box.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">🗂</div>
      <strong>${esc(t(filtered ? 'dc.noMatch' : 'dc.emptyCabinet'))}</strong>
      ${esc(t(filtered ? 'dc.noMatchSub' : 'dc.emptyCabinetSub'))}
      ${filtered ? '' : `<div style="margin-top:16px">
        <button class="btn btn-teal" onclick="document.getElementById('folderInput').click()">${esc(t('dc.importFolder'))}</button>
        <div style="font-size:12px;margin-top:8px">${esc(t('dc.importEmptyHint'))}</div>
      </div>`}</div></div>`;
    return;
  }

  box.innerHTML = `<div class="rec-grid">${recs.map(r => {
    const cat = RECORD_CATEGORIES[r.category] || RECORD_CATEGORIES.other;
    const ev  = r.eventId ? Store.find(HK.events, r.eventId) : null;
    const n   = (r.attachments || []).length;
    return `<div class="rec" id="${r.id}">
      <div class="rec-thumb" id="th_${r.id}" onclick="openFirst('${r.id}')">${cat.icon}
        ${n > 1 ? `<span class="rec-count">${esc(t('dc.nFiles', { n }))}</span>` : ''}</div>
      <div class="rec-body">
        <div class="rec-cat">${cat.icon} ${esc(L(cat))}</div>
        <div class="rec-title">${esc(r.title)}</div>
        <div class="rec-meta">
          ${esc(fmtDate(r.date))}${r.source ? ' · ' + esc(r.source) : ''}
          ${ev ? `<br>${eventIcon(ev.type)} ${esc(ev.title || eventLabel(ev.type))}` : ''}
          ${r.notes ? `<br><span style="color:var(--text-2)">${esc(r.notes.slice(0, 80))}${r.notes.length > 80 ? '…' : ''}</span>` : ''}
        </div>
        ${(r.tags || []).length ? `<div style="margin-top:7px">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="rec-foot">
          <button class="btn btn-outline btn-sm" onclick="openRecord('${r.id}')">${esc(t('common.edit'))}</button>
          ${r.sourcePath && !n ? `<a class="btn btn-outline btn-sm" href="${esc(r.sourcePath)}" target="_blank">${esc(t('common.open'))}</a>` : ''}
          ${n ? `<button class="btn btn-outline btn-sm" onclick="openFirst('${r.id}')">${esc(t('common.open'))}</button>
                 <button class="btn btn-outline btn-sm" onclick="downloadAll('${r.id}')">${esc(t('dc.saveFile'))}</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;

  /* Thumbnails for image attachments, drawn after the cards exist. */
  for (const r of recs) {
    const img = (r.attachments || []).find(a => /^image\//.test(a.type || ''));
    if (!img) continue;
    const blob = await Files.get(img.id);
    if (!blob) continue;
    const url = URL.createObjectURL(blob);
    thumbUrls.push(url);
    const el = document.getElementById('th_' + r.id);
    if (el) el.innerHTML = `<img src="${url}" alt="${esc(r.title)}">` +
      ((r.attachments || []).length > 1 ? `<span class="rec-count">${esc(t('dc.nFiles', { n: r.attachments.length }))}</span>` : '');
  }

  const focus = deepLinkId();
  if (focus) {
    const el = document.getElementById(focus);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function openFirst(id) {
  const r = Store.find(HK.records, id);
  if (!r || !(r.attachments || []).length) { openRecord(id); return; }
  Files.open_(r.attachments[0]);
}
async function downloadAll(id) {
  const r = Store.find(HK.records, id);
  for (const a of (r.attachments || [])) await Files.download(a);
}

/* ══ FOLDER IMPORT ═══════════════════════════════════════════
 * Reads an existing folder of reports and files them in one pass. The browser
 * hands over the file list only after the user picks the folder, and nothing
 * leaves the machine.
 * ═════════════════════════════════════════════════════════ */

let impRows = [];

/* Keywords that identify a document type, in both languages. Order matters:
   the first family that matches the file name wins. */
const CATEGORY_HINTS = [
  ['pathology',    ['βιοψ', 'ιστολογ', 'παθολογοανατ', 'κυτταρολογ', 'biops', 'histo', 'patholog', 'cytolog']],
  ['imaging',      ['αξονικ', 'μαγνητικ', 'υπερηχ', 'ακτινογραφ', 'μαστογραφ', 'σπινθηρογραφ', 'απεικον',
                    'ct', 'mri', 'pet', 'xray', 'x-ray', 'ultrasound', 'mammog', 'scan', 'scinti']],
  ['lab',          ['αιματολογ', 'βιοχημ', 'γενικη αιματος', 'ουρων', 'εξετασ', 'δεικτ',
                    'lab', 'blood', 'cbc', 'haem', 'hema', 'urine', 'marker']],
  ['discharge',    ['εξιτηρι', 'εξοδο', 'discharge']],
  ['surgery',      ['χειρουργ', 'επεμβασ', 'surg', 'operat']],
  ['oncology',     ['ογκολογ', 'χημειοθεραπ', 'ακτινοθεραπ', 'oncolog', 'chemo', 'radiother']],
  ['prescription', ['συνταγ', 'φαρμακ', 'prescript', 'medicat']],
  ['referral',     ['παραπεμπτ', 'referral']],
  ['consent',      ['συγκαταθ', 'consent']],
  ['insurance',    ['ασφαλ', 'εοπυυ', 'eopyy', 'insur']],
  ['receipt',      ['αποδειξ', 'τιμολογ', 'receipt', 'invoice']]
];

/* Strip Greek accents so "ΑΞΟΝΙΚΉ" and "αξονικη" match the same hint. */
function foldGreek(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .normalize('NFC');
}

function guessCategory(name) {
  const n = foldGreek(name);
  for (const [cat, words] of CATEGORY_HINTS) {
    if (words.some(w => n.includes(w))) return cat;
  }
  return 'other';
}

/** Pull a date out of the file name; fall back to the file's own timestamp. */
function guessDate(name, lastModified) {
  const clean = name.replace(/[^0-9]/g, ' ');
  let m = /(20\d{2})\s?(\d{2})\s?(\d{2})/.exec(clean);          // 2026-08-14
  if (m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /(\d{2})\s?(\d{2})\s?(20\d{2})/.exec(clean);              // 14-08-2026
  if (m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) return `${m[3]}-${m[2]}-${m[1]}`;
  return todayISO(new Date(lastModified || Date.now()));
}

/** A readable title from the file name: drop the extension and separators. */
function guessTitle(name) {
  return name.replace(/\.[^.]+$/, '')
             .replace(/[_]+/g, ' ')
             .replace(/\s{2,}/g, ' ')
             .trim() || name;
}

function scanFolder(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;

  /* Anything already filed from the same folder is skipped, so importing the
     same folder twice adds only what is new. */
  /* ?? not || — a genuinely zero-byte file has size 0, which is falsy, and
     `0 || ''` would give it a different key on the way in than on the way out. */
  const known = new Set(getRecords().map(r => (r.sourceFile || '') + '|' + (r.sourceSize ?? '')));
  let skipped = 0;

  /* Junk names are skipped; size is deliberately NOT a filter — some browsers
     report 0 for files that are fine, and silently dropping one is unacceptable. */
  impRows = files
    .filter(f => !/^\./.test(f.name) && !/^(thumbs\.db|desktop\.ini|\.ds_store)$/i.test(f.name) && !/\.(lnk|tmp)$/i.test(f.name))
    .filter(f => {
      if (known.has(f.name + '|' + f.size)) { skipped++; return false; }
      return true;
    })
    .map(f => {
      /* webkitRelativePath starts with the folder the user picked; the rest is
         the path to use if Care Log sits inside that same folder. */
      const parts = (f.webkitRelativePath || f.name).split('/');
      const rel = parts.slice(1).join('/') || f.name;
      return {
        file: f, use: true,
        name: f.name, size: f.size, rel,
        folder: parts.length > 2 ? parts.slice(1, -1).join('/') : '',
        date: guessDate(f.webkitRelativePath || f.name, f.lastModified),
        category: guessCategory(f.webkitRelativePath || f.name),
        title: guessTitle(f.name)
      };
    })
    .sort((a, b) => b.date.localeCompare(a.date));

  if (!impRows.length) {
    toast(skipped ? t('dc.importSkipped', { n: skipped }) : t('dc.importNothing'), skipped ? 'info' : 'warning');
    return;
  }

  document.getElementById('impCount').textContent =
    t('dc.importFound', { n: impRows.length }) + (skipped ? ' ' + t('dc.importSkipped', { n: skipped }) : '');
  renderImpTable();
  openModal('importModal');
}

function renderImpTable() {
  const cats = Object.entries(RECORD_CATEGORIES);
  document.getElementById('impTable').innerHTML = `
    <thead><tr>
      <th style="width:30px"></th>
      <th>${esc(t('dc.colFile'))}</th>
      <th style="width:140px">${esc(t('common.date'))}</th>
      <th style="width:170px">${esc(t('dc.type'))}</th>
      <th>${esc(t('common.title'))}</th>
    </tr></thead>
    <tbody>${impRows.map((r, i) => `<tr>
      <td><input type="checkbox" ${r.use ? 'checked' : ''} onchange="impRows[${i}].use=this.checked;impCountUpdate()"></td>
      <td><div class="fname" title="${esc(r.rel)}">${esc(r.name)}</div>
          <div style="font-size:10px;color:var(--text-muted)">${fmtBytes(r.size)}${r.folder ? ' · ' + esc(r.folder) : ''}</div></td>
      <td><input type="date" value="${esc(r.date)}" onchange="impRows[${i}].date=this.value"></td>
      <td><select onchange="impRows[${i}].category=this.value">
        ${cats.map(([k, c]) => `<option value="${k}" ${r.category === k ? 'selected' : ''}>${c.icon} ${esc(L(c))}</option>`).join('')}
      </select></td>
      <td><input type="text" value="${esc(r.title)}" onchange="impRows[${i}].title=this.value"></td>
    </tr>`).join('')}</tbody>`;
  impCountUpdate();
}

function impCountUpdate() {
  const n = impRows.filter(r => r.use).length;
  const btn = document.getElementById('impGo');
  btn.textContent = t('dc.importBtn', { n });
  btn.disabled = n === 0;
}

function impSelectAll(on) {
  impRows.forEach(r => { r.use = on; });
  renderImpTable();
}

async function runImport() {
  const keep = document.getElementById('impKeepCopy').checked;
  const chosen = impRows.filter(r => r.use);
  if (!chosen.length) return;

  document.getElementById('impGo').disabled = true;
  let done = 0;

  for (const r of chosen) {
    const rec = {
      date: r.date, category: r.category, title: r.title,
      source: '', eventId: '', notes: '',
      tags: r.folder ? r.folder.split('/').filter(Boolean) : [],
      sourceFile: r.name, sourceSize: r.size, sourcePath: r.rel,
      attachments: []
    };
    /* Files over 25 MB (or reported as empty) are indexed by name only. */
    if (keep && r.size > 0 && r.size <= 25 * 1024 * 1024) {
      try {
        const id = await Files.put(r.file);
        rec.attachments = [{ id, name: r.name, type: r.file.type, size: r.size }];
      } catch (e) {
        toast(t('dc.storeFail', { name: r.name }), 'error');
      }
    }
    Store.upsert(HK.records, rec);
    done++;
  }

  closeModal('importModal');
  impRows = [];
  toast(t('dc.imported', { n: done }));
  render();
}

/* ── boot ── */
applyI18n();
render();
</script>
<script src="health-nav.js"></script>
</body>
