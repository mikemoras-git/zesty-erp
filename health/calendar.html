<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log — Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="health-style.css">
<style>
.cal-nav { display: flex; align-items: center; gap: 10px; }
.cal-month { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; color: var(--teal-dark);
  min-width: 180px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--grid);
  border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; }
.cal-dow { background: var(--surface); padding: 8px 6px; text-align: center; font-size: 10px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.cal-day { background: var(--surface); min-height: 104px; padding: 6px 6px 8px; position: relative;
  cursor: pointer; transition: background .12s; }
.cal-day:hover { background: var(--teal-wash); }
.cal-day.other { background: #fbfbfa; }
.cal-day.other .cal-num { color: var(--border); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--teal); }
.cal-num { font-size: 12px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.cal-day.today .cal-num { color: var(--teal); }
.cal-vital { position: absolute; top: 8px; right: 7px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--series-1); opacity: .55; }
.cal-ev { display: flex; align-items: center; gap: 4px; font-size: 10.5px; line-height: 1.3;
  margin-top: 3px; padding: 2px 4px; border-radius: 4px; border-left: 3px solid var(--axis);
  background: var(--cream); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev.done { opacity: .5; text-decoration: line-through; }
.cal-more { font-size: 10px; color: var(--text-muted); margin-top: 3px; padding-left: 4px; }

.agenda-item { display: grid; grid-template-columns: 62px 1fr auto; gap: 14px; align-items: start;
  padding: 13px 0; border-bottom: 1px solid var(--grid); }
.agenda-item:last-child { border-bottom: none; }
.agenda-date { text-align: center; }
.agenda-date .d { font-size: 20px; font-weight: 700; color: var(--teal-dark); line-height: 1; font-variant-numeric: tabular-nums; }
.agenda-date .m { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-top: 3px; }
.agenda-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.agenda-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
.agenda-rel { font-size: 11.5px; font-weight: 600; color: var(--teal); white-space: nowrap; }
.type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.type-opt { padding: 9px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  cursor: pointer; font-size: 11.5px; text-align: center; font-family: inherit; color: var(--text-2); transition: all .15s; }
.type-opt:hover { border-color: var(--teal); }
.type-opt.sel { border-color: var(--teal); background: var(--teal-wash); color: var(--teal); font-weight: 700; }
.type-opt .ico { display: block; font-size: 17px; margin-bottom: 3px; }
@media(max-width:900px){
  .cal-day { min-height: 76px; padding: 4px 3px 6px; }
  .cal-ev { font-size: 9px; padding: 1px 3px; }
  .type-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body data-i18n-doctitle="cal.title">
<div class="container wide">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="cal.title"></div>
      <div class="page-sub" data-i18n="cal.sub"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-outline" onclick="exportUpcomingICS()" data-i18n="rm.exportAll"></button>
      <button class="btn btn-gold" onclick="openEvent(null, todayISO())" data-i18n="cal.addEvent"></button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="month"  onclick="setView('month', this)" data-i18n="cal.month"></button>
    <button class="tab" data-view="upcoming" onclick="setView('upcoming', this)" data-i18n="cal.upcoming"></button>
    <button class="tab" data-view="history"  onclick="setView('history', this)" data-i18n="cal.history"></button>
  </div>

  <!-- Month view -->
  <div id="viewMonth">
    <div class="card">
      <div class="card-hdr">
        <div class="cal-nav">
          <button class="btn btn-outline btn-sm" onclick="shiftMonth(-1)">‹</button>
          <div class="cal-month" id="calMonth"></div>
          <button class="btn btn-outline btn-sm" onclick="shiftMonth(1)">›</button>
          <button class="btn btn-outline btn-sm" onclick="gotoToday()" data-i18n="cal.todayBtn"></button>
        </div>
        <div class="chart-legend" style="margin:0" id="calLegend"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="card-note" style="margin-top:10px" data-i18n="cal.hint"></div>
    </div>
  </div>

  <!-- List views -->
  <div id="viewList" style="display:none">
    <div class="filters">
      <button class="chip-btn active" data-type="all" onclick="setTypeFilter('all', this)" data-i18n="cal.allTypes"></button>
      <button class="chip-btn" data-type="treatment"  onclick="setTypeFilter('treatment', this)" data-group="treatment"></button>
      <button class="chip-btn" data-type="diagnostic" onclick="setTypeFilter('diagnostic', this)" data-group="diagnostic"></button>
      <button class="chip-btn" data-type="care"       onclick="setTypeFilter('care', this)" data-group="care"></button>
    </div>
    <div class="card"><div id="agenda"></div></div>
  </div>

</div>

<!-- ── Event modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <h2 id="eventTitle">Add event</h2>
    <div class="modal-sub" data-i18n="cal.modalSub"></div>

    <input type="hidden" id="e_id">

    <div class="form-group">
      <label data-i18n="cal.whatKind"></label>
      <div class="type-grid" id="typeGrid"></div>
    </div>

    <div class="form-group">
      <label data-i18n="common.title"></label>
      <input type="text" id="e_title" data-i18n-ph="cal.titlePh">
    </div>

    <div class="form-row">
      <div class="form-group"><label data-i18n="common.date"></label><input type="date" id="e_date"></div>
      <div class="form-group"><label data-i18n="cal.timeOpt"></label><input type="time" id="e_time"></div>
    </div>

    <div class="form-row">
      <div class="form-group"><label data-i18n="cal.doctorDept"></label><input type="text" id="e_doctor" placeholder="Dr. …"></div>
      <div class="form-group"><label data-i18n="cal.place"></label><input type="text" id="e_place" data-i18n-ph="cal.placePh"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label data-i18n="common.status"></label>
        <select id="e_status">
          <option value="scheduled" data-i18n="cal.scheduled"></option>
          <option value="done" data-i18n="cal.done"></option>
          <option value="cancelled" data-i18n="cal.cancelled"></option>
        </select>
      </div>
      <div class="form-group"><label data-i18n="cal.cycleNo"></label><input type="number" id="e_cycle" data-i18n-ph="cal.optional"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label data-i18n="rm.remindMe"></label>
        <select id="e_remind"></select>
        <div class="hint" data-i18n="rm.icsNote"></div>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end">
        <button class="btn btn-outline" style="width:100%" onclick="addThisToCalendar()" data-i18n="rm.addToCalendar"></button>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="common.notes"></label>
      <textarea id="e_notes" data-i18n-ph="cal.notesPh"></textarea>
    </div>

    <div class="form-group" id="repeatBox">
      <label data-i18n="cal.repeat"></label>
      <div class="form-row">
        <input type="number" id="e_repeatEvery" data-i18n-ph="cal.repeatEvery">
        <input type="number" id="e_repeatCount" data-i18n-ph="cal.repeatCount">
      </div>
      <div class="hint" data-i18n="cal.repeatHint"></div>
    </div>

    <div id="eventLinks"></div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="eDeleteBtn" onclick="deleteEvent()" style="margin-right:auto;display:none" data-i18n="common.delete"></button>
      <button class="btn btn-outline" onclick="closeModal('eventModal')" data-i18n="common.cancel"></button>
      <button class="btn btn-teal" onclick="saveEvent()" data-i18n="common.save"></button>
    </div>
  </div>
</div>

<script src="health-i18n.js"></script>
<script src="health-base.js"></script>
<script>
let view = 'month';
let typeFilter = 'all';
let cursor = new Date();
let selectedType = 'consult';

/* ── View switching ────────────────────────────────────────── */
function setView(v, btn) {
  view = v;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('viewMonth').style.display = v === 'month' ? '' : 'none';
  document.getElementById('viewList').style.display  = v === 'month' ? 'none' : '';
  render();
}
function setTypeFilter(t, btn) {
  typeFilter = t;
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAgenda();
}
function shiftMonth(n) { cursor.setMonth(cursor.getMonth() + n); renderMonth(); }
function gotoToday()   { cursor = new Date(); renderMonth(); }

/* ── Month grid (weeks start Monday) ───────────────────────── */
function renderMonth() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('calMonth').textContent = fmtMonthYear(cursor);

  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7;   // Mon = 0
  const gridStart = new Date(y, m, 1 - startOffset);

  const events = getEvents();
  const byDate = {};
  events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  const vitalDates = new Set(getVitals().map(v => v.date));

  const cells = weekdayNames().map(d => `<div class="cal-dow">${esc(d)}</div>`);

  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const iso = todayISO(d);
    const other = d.getMonth() !== m;
    const isToday = iso === todayISO();
    const evs = byDate[iso] || [];

    const chips = evs.slice(0, 3).map(e => {
      const c = eventColor(e.type);
      return `<div class="cal-ev ${e.status === 'done' ? 'done' : ''}" style="border-left-color:${c}"
                   onclick="event.stopPropagation();openEvent('${e.id}')"
                   title="${esc(e.title || eventLabel(e.type))}">${eventIcon(e.type)} ${esc(e.title || eventLabel(e.type))}</div>`;
    }).join('');
    const more = evs.length > 3 ? `<div class="cal-more">${esc(t('cal.more', { n: evs.length - 3 }))}</div>` : '';

    cells.push(`<div class="cal-day ${other ? 'other' : ''} ${isToday ? 'today' : ''}" onclick="openEvent(null,'${iso}')">
      <div class="cal-num">${d.getDate()}</div>
      ${vitalDates.has(iso) ? `<span class="cal-vital" title="${esc(t('nav.dailyLog'))}"></span>` : ''}
      ${chips}${more}
    </div>`);
  }

  document.getElementById('calGrid').innerHTML = cells.join('');
  document.getElementById('calLegend').innerHTML = Object.entries(EVENT_GROUPS)
    .map(([, g]) => `<span class="legend-item"><span class="legend-swatch" style="background:${g.color}"></span>${esc(L(g))}</span>`)
    .join('');
}

/* ── Agenda list ───────────────────────────────────────────── */
function renderAgenda() {
  let list = view === 'upcoming' ? upcomingEvents() : pastEvents();
  if (typeFilter !== 'all') list = list.filter(e => (EVENT_TYPES[e.type] || {}).group === typeFilter);

  const box = document.getElementById('agenda');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="empty-icon">📅</div>
      <strong>${esc(t('cal.nothingHere'))}</strong>
      ${esc(t(view === 'upcoming' ? 'cal.addNext' : 'cal.pastCollect'))}</div>`;
    return;
  }

  box.innerHTML = list.map(e => {
    const d = parseISO(e.date);
    const att = eventAttachments(e.id);
    const nAtt = att.records.length + att.labs.length;
    const bits = [];
    if (e.time)   bits.push('🕑 ' + e.time);
    if (e.doctor) bits.push('👤 ' + e.doctor);
    if (e.place)  bits.push('📍 ' + e.place);
    if (e.cycle)  bits.push(t('cal.cycle', { n: e.cycle }));
    return `<div class="agenda-item">
      <div class="agenda-date">
        <div class="d">${d ? d.getDate() : '?'}</div>
        <div class="m">${d ? d.toLocaleDateString('en-GB', { month: 'short' }) : ''}</div>
      </div>
      <div>
        <div class="agenda-title">
          <span>${eventIcon(e.type)}</span>
          <span>${esc(e.title || eventLabel(e.type))}</span>
          <span class="badge" style="background:${eventColor(e.type)}18;color:${eventColor(e.type)}">${esc(eventLabel(e.type))}</span>
          ${e.status === 'done' ? `<span class="badge badge-good">✓ ${esc(t('cal.done'))}</span>` : ''}
          ${e.status === 'cancelled' ? `<span class="badge badge-neutral">${esc(t('cal.cancelled'))}</span>` : ''}
          ${nAtt ? `<span class="badge badge-teal">📎 ${nAtt}</span>` : ''}
        </div>
        <div class="agenda-meta">${bits.map(esc).join(' · ')}${e.notes ? '<br>' + esc(e.notes.slice(0, 160)) + (e.notes.length > 160 ? '…' : '') : ''}</div>
      </div>
      <div style="text-align:right">
        <div class="agenda-rel">${esc(relDays(e.date))}</div>
        <button class="btn btn-outline btn-sm" style="margin-top:7px" onclick="openEvent('${e.id}')">${esc(t('common.open'))}</button>
      </div>
    </div>`;
  }).join('');
}

/* ── Event modal ───────────────────────────────────────────── */
function buildTypeGrid() {
  document.getElementById('typeGrid').innerHTML = Object.entries(EVENT_TYPES).map(([k, def]) =>
    `<button type="button" class="type-opt" data-t="${k}" onclick="pickType('${k}')">
       <span class="ico">${def.icon}</span>${esc(L(def))}</button>`).join('');
}
function pickType(k) {
  selectedType = k;
  document.querySelectorAll('.type-opt').forEach(b => b.classList.toggle('sel', b.dataset.t === k));
}

function openEvent(id, date) {
  const e = id ? Store.find(HK.events, id) : null;
  document.getElementById('eventTitle').textContent = t(e ? 'cal.modalEdit' : 'cal.modalAdd');
  document.getElementById('eDeleteBtn').style.display = e ? '' : 'none';
  document.getElementById('repeatBox').style.display = e ? 'none' : '';
  document.getElementById('e_id').value = e ? e.id : '';
  document.getElementById('e_title').value  = e ? (e.title || '') : '';
  document.getElementById('e_date').value   = e ? e.date : (date || todayISO());
  document.getElementById('e_time').value   = e ? (e.time || '') : '';
  document.getElementById('e_doctor').value = e ? (e.doctor || '') : '';
  document.getElementById('e_place').value  = e ? (e.place || '') : '';
  document.getElementById('e_status').value = e ? (e.status || 'scheduled') : 'scheduled';
  document.getElementById('e_cycle').value  = e ? (e.cycle || '') : '';
  document.getElementById('e_notes').value  = e ? (e.notes || '') : '';
  document.getElementById('e_remind').value = e && e.remind != null ? String(e.remind) : '1440';
  document.getElementById('e_repeatEvery').value = '';
  document.getElementById('e_repeatCount').value = '';
  pickType(e ? e.type : 'consult');

  /* Anything already filed against this event */
  const links = document.getElementById('eventLinks');
  if (e) {
    const att = eventAttachments(e.id);
    const items = [
      ...att.labs.map(l => `<a href="labs.html#${l.id}" class="tag" style="text-decoration:none">🧪 ${esc(l.title || 'Lab results')} — ${esc(fmtDate(l.date))}</a>`),
      ...att.records.map(r => `<a href="records.html#${r.id}" class="tag" style="text-decoration:none">${(RECORD_CATEGORIES[r.category] || {}).icon || '📄'} ${esc(r.title)}</a>`)
    ];
    links.innerHTML = items.length
      ? `<div class="form-group"><label>${esc(t('cal.filedAgainst'))}</label><div>${items.join('')}</div></div>`
      : `<div class="form-group"><label>${esc(t('cal.filedAgainst'))}</label>
           <div class="hint">${esc(t('cal.nothingFiled'))}</div></div>`;
  } else {
    links.innerHTML = '';
  }

  openModal('eventModal');
}

function saveEvent() {
  const date = document.getElementById('e_date').value;
  if (!date) { toast(t('common.pickDate'), 'error'); return; }

  const base = {
    type:   selectedType,
    title:  document.getElementById('e_title').value.trim() || eventLabel(selectedType),
    date:   date,
    time:   document.getElementById('e_time').value,
    doctor: document.getElementById('e_doctor').value.trim(),
    place:  document.getElementById('e_place').value.trim(),
    status: document.getElementById('e_status').value,
    cycle:  document.getElementById('e_cycle').value,
    notes:  document.getElementById('e_notes').value.trim(),
    remind: num(document.getElementById('e_remind').value)
  };

  const id = document.getElementById('e_id').value;
  let saved = null;
  if (id) {
    saved = Store.upsert(HK.events, { ...Store.find(HK.events, id), ...base, id });
    toast(t('cal.updated'));
  } else {
    const every = num(document.getElementById('e_repeatEvery').value);
    const count = num(document.getElementById('e_repeatCount').value);
    if (every && count && count > 1) {
      const n = Math.min(count, 60);
      const startCycle = num(base.cycle) || 1;
      for (let i = 0; i < n; i++) {
        Store.upsert(HK.events, {
          ...base,
          date: addDays(date, every * i),
          cycle: String(startCycle + i),
          title: base.title.replace(/\s*—\s*(cycle|κύκλος)\s*\d+$/i, '') + ' — ' + t('cal.cycle', { n: startCycle + i })
        });
      }
      toast(t('cal.seriesCreated', { n, d: every }));
    } else {
      saved = Store.upsert(HK.events, base);
      toast(t('cal.added'));
    }
  }

  closeModal('eventModal');
  render();
  return saved;
}

function deleteEvent() {
  const id = document.getElementById('e_id').value;
  if (!id) return;
  confirmAction(t('cal.deleteQ'), t('cal.deleteBody'), t('common.delete'), () => {
      Store.remove(HK.events, id);
      closeModal('eventModal');
      toast(t('cal.deleted'));
      render();
    });
}

function render() {
  if (view === 'month') renderMonth(); else renderAgenda();
}

/* Reminder lead times and the type-filter chips come from the domain tables. */
function buildReminderSelect() {
  document.getElementById('e_remind').innerHTML =
    REMINDERS.map(r => `<option value="${r.v}">${esc(t(r.key))}</option>`).join('');
}
function labelGroups() {
  document.querySelectorAll('[data-group]').forEach(el => {
    el.textContent = L(EVENT_GROUPS[el.getAttribute('data-group')]);
  });
}

/** Hand the open event to the phone's calendar app, saving it first if needed. */
function addThisToCalendar() {
  const id = document.getElementById('e_id').value;
  if (id) { exportEventICS(Store.find(HK.events, id)); return; }
  /* Not saved yet — save it first, then hand the stored record to the calendar. */
  const saved = saveEvent();
  if (saved) exportEventICS(saved);
}

applyI18n();
labelGroups();
buildTypeGrid();
buildReminderSelect();
render();
</script>
<script src="health-nav.js"></script>
</body>
</html>
