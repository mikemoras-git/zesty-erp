<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="health-style.css">
<style>
.danger-card { border: 1px solid #f0cdc8; background: #fffbfa; }
.danger-card .card-title { color: var(--critical); }
.store-bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 9px 0 6px; }
.store-fill { height: 100%; background: var(--teal); }
.med-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.med-row:last-child { border-bottom: none; }
.med-name { font-size: 13.5px; font-weight: 600; }
.med-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.med-row.off { opacity: .5; }
</style>
</head>
<body data-i18n-doctitle="st.title">
<div class="container">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="st.title"></div>
      <div class="page-sub" data-i18n="st.sub"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-gold" onclick="doBackup()" data-i18n="st.backupNow"></button>
    </div>
  </div>

  <!-- ── Privacy note ── -->
  <div class="card" style="border-left:4px solid var(--teal)">
    <div class="card-title" style="margin-bottom:7px" data-i18n="st.whereLives"></div>
    <div style="font-size:13px;color:var(--text-2);line-height:1.65" data-i18n-html="st.whereLivesBody"></div>
  </div>

  <!-- ── Language ── -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title" data-i18n="st.language"></div>
      <div class="card-note" data-i18n="st.languageNote"></div>
    </div>
    <div class="lang-choice">
      <button class="lang-opt" id="langEn" onclick="setLang('en')"><span class="flag">🇬🇧</span> English</button>
      <button class="lang-opt" id="langEl" onclick="setLang('el')"><span class="flag">🇬🇷</span> Ελληνικά</button>
    </div>
  </div>

  <!-- ── Patient ── -->
  <div class="card">
    <div class="card-hdr"><div class="card-title" data-i18n="st.patient"></div></div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.name"></label><input type="text" id="p_name" data-i18n-ph="st.namePh"></div>
      <div class="form-group"><label data-i18n="st.dob"></label><input type="date" id="p_dob"></div>
    </div>
    <div class="form-row3">
      <div class="form-group"><label data-i18n="st.height"></label><input type="number" id="p_heightCm" placeholder="165"></div>
      <div class="form-group"><label data-i18n="st.bloodGroup"></label><input type="text" id="p_bloodType" placeholder="A+"></div>
      <div class="form-group"><label data-i18n="st.phone"></label><input type="text" id="p_phone" data-i18n-ph="st.phonePh"></div>
    </div>
    <div class="form-group">
      <label data-i18n="st.allergies"></label>
      <input type="text" id="p_allergies" data-i18n-ph="st.allergiesPh">
      <div class="hint" data-i18n="st.allergiesHint"></div>
    </div>
  </div>

  <!-- ── Diagnosis ── -->
  <div class="card">
    <div class="card-hdr"><div class="card-title" data-i18n="st.diagnosisTeam"></div></div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.diagnosis"></label><input type="text" id="p_diagnosis" data-i18n-ph="st.diagnosisPh"></div>
      <div class="form-group"><label data-i18n="st.stage"></label><input type="text" id="p_stage" data-i18n-ph="st.stagePh"></div>
    </div>
    <div class="form-row3">
      <div class="form-group"><label data-i18n="st.diagnosedOn"></label><input type="date" id="p_diagnosedOn"></div>
      <div class="form-group"><label data-i18n="st.treatingDoctor"></label><input type="text" id="p_oncologist" placeholder="Dr. …"></div>
      <div class="form-group"><label data-i18n="st.hospital"></label><input type="text" id="p_hospital" placeholder="…"></div>
    </div>
    <div class="form-group"><label data-i18n="common.notes"></label><textarea id="p_notes" data-i18n-ph="st.notesPh"></textarea></div>
  </div>

  <!-- ── Targets ── -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title" data-i18n="st.targets"></div>
      <div class="card-note" data-i18n="st.targetsNote"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.weightAbove"></label><input type="number" step="0.1" id="t_weightLow" placeholder="58"></div>
      <div class="form-group"><label data-i18n="st.weightBelow"></label><input type="number" step="0.1" id="t_weightHigh" placeholder="68"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.sugarLow"></label><input type="number" id="t_glucoseLow" placeholder="70"></div>
      <div class="form-group"><label data-i18n="st.sugarHigh"></label><input type="number" id="t_glucoseHigh" placeholder="180"></div>
    </div>
    <div class="card-note" data-i18n="st.targetsHint"></div>
    <div style="margin-top:16px"><button class="btn btn-teal" onclick="saveAll()" data-i18n="st.saveSettings"></button></div>
  </div>

  <!-- ── Reminders ── -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title" data-i18n="rm.section"></div>
    </div>
    <div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:15px" data-i18n="rm.sub"></div>

    <div style="margin-bottom:18px">
      <button class="btn btn-teal" onclick="exportUpcomingICS()" data-i18n="rm.exportAll"></button>
      <div class="card-note" style="margin-top:8px" data-i18n="rm.exportAllHint"></div>
    </div>

    <div style="border-top:1px solid var(--grid);padding-top:16px">
      <div style="font-size:13px;font-weight:600;color:var(--teal-dark);margin-bottom:4px" data-i18n="rm.dailyTitle"></div>
      <div class="card-note" style="margin-bottom:11px" data-i18n="rm.dailyHint"></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="font-size:12px;color:var(--text-muted)" data-i18n="rm.dailyAt"></label>
        <input type="time" id="dailyTime" value="09:00" style="padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px">
        <button class="btn btn-outline" onclick="exportDailyReminderICS(document.getElementById('dailyTime').value)" data-i18n="rm.dailyExport"></button>
      </div>
    </div>
  </div>

  <!-- ── Medication ── -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title" data-i18n="st.medication"></div>
      <button class="btn btn-outline btn-sm" onclick="openMed()" data-i18n="st.addMedicine"></button>
    </div>
    <div id="medBox"></div>
  </div>

  <!-- ── Backup ── -->
  <div class="card">
    <div class="card-hdr"><div class="card-title" data-i18n="st.backupRestore"></div></div>
    <div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:15px" data-i18n-html="st.backupBody"></div>
    <div id="backupStatus" style="margin-bottom:15px"></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="doBackup()" data-i18n="st.exportFull"></button>
      <button class="btn btn-outline" onclick="doBackup(false)" data-i18n="st.exportNoDocs"></button>
      <button class="btn btn-outline" onclick="document.getElementById('importFile').click()" data-i18n="st.restore"></button>
      <button class="btn btn-outline" onclick="exportVitalsCSV()" data-i18n="st.dailyCsv"></button>
      <button class="btn btn-outline" onclick="exportLabsCSV()" data-i18n="st.labsCsv"></button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="doRestore(this)">
  </div>

  <!-- ── Storage ── -->
  <div class="card">
    <div class="card-hdr"><div class="card-title" data-i18n="st.whatStored"></div></div>
    <div id="storageBox"><div class="loading" style="font-size:13px;color:var(--text-muted)" data-i18n="st.measuring"></div></div>
  </div>

  <!-- ── Danger ── -->
  <div class="card danger-card">
    <div class="card-hdr"><div class="card-title" data-i18n="st.eraseTitle"></div></div>
    <div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:14px" data-i18n="st.eraseBody"></div>
    <button class="btn btn-danger" onclick="wipeAll()" data-i18n="st.eraseBtn"></button>
  </div>

</div>

<!-- ── Medicine modal ──────────────────────────────────────── -->
<div class="modal-overlay" id="medModal">
  <div class="modal">
    <h2 id="medTitle">Add medicine</h2>
    <div class="modal-sub" data-i18n="st.medModalSub"></div>
    <input type="hidden" id="m_id">
    <div class="form-group"><label data-i18n="st.medName"></label><input type="text" id="m_name" data-i18n-ph="st.medNamePh"></div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.medDose"></label><input type="text" id="m_dose" placeholder="8 mg"></div>
      <div class="form-group"><label data-i18n="st.medWhen"></label><input type="text" id="m_schedule" data-i18n-ph="st.medWhenPh"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label data-i18n="st.medStarted"></label><input type="date" id="m_startDate"></div>
      <div class="form-group"><label data-i18n="common.status"></label>
        <select id="m_active"><option value="yes" data-i18n="st.medTaking"></option><option value="no" data-i18n="st.medStopped"></option></select>
      </div>
    </div>
    <div class="form-group"><label data-i18n="common.notes"></label><textarea id="m_notes" data-i18n-ph="st.medNotesPh"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="mDeleteBtn" onclick="deleteMed()" style="margin-right:auto;display:none" data-i18n="common.delete"></button>
      <button class="btn btn-outline" onclick="closeModal('medModal')" data-i18n="common.cancel"></button>
      <button class="btn btn-teal" onclick="saveMed()" data-i18n="common.save"></button>
    </div>
  </div>
</div>

<script src="health-i18n.js"></script>
<script src="health-base.js"></script>
<script>
const PROFILE_FIELDS = ['name','dob','heightCm','bloodType','phone','allergies',
                        'diagnosis','stage','diagnosedOn','oncologist','hospital','notes'];
const TARGET_FIELDS  = ['weightLow','weightHigh','glucoseLow','glucoseHigh'];

function loadForm() {
  const p = getProfile();
  PROFILE_FIELDS.forEach(k => { const el = document.getElementById('p_' + k); if (el) el.value = p[k] ?? ''; });
  TARGET_FIELDS.forEach(k => { const el = document.getElementById('t_' + k); if (el) el.value = p.targets[k] ?? ''; });
}

function saveAll() {
  const p = getProfile();
  PROFILE_FIELDS.forEach(k => { const el = document.getElementById('p_' + k); if (el) p[k] = el.value.trim(); });
  TARGET_FIELDS.forEach(k => { const el = document.getElementById('t_' + k); if (el) p.targets[k] = el.value === '' ? '' : num(el.value); });

  const lo = num(p.targets.weightLow), hi = num(p.targets.weightHigh);
  if (lo !== null && hi !== null && lo > hi) { toast(t('st.badWeightTarget'), 'error'); return; }
  const glo = num(p.targets.glucoseLow), ghi = num(p.targets.glucoseHigh);
  if (glo !== null && ghi !== null && glo > ghi) { toast(t('st.badSugarTarget'), 'error'); return; }

  saveProfile(p);
  toast(t('common.saved'));
  setTimeout(() => location.reload(), 700);   // refresh the sidebar patient name
}

/* ── Medication ────────────────────────────────────────────── */
function renderMeds() {
  const meds = getMeds();
  const box = document.getElementById('medBox');
  if (!meds.length) {
    box.innerHTML = `<div class="empty" style="padding:26px 12px"><div class="empty-icon">💊</div>${esc(t('st.noMeds'))}</div>`;
    return;
  }
  box.innerHTML = meds.map(m => `<div class="med-row ${m.active === false ? 'off' : ''}">
    <span style="font-size:18px">💊</span>
    <span style="flex:1;min-width:0">
      <div class="med-name">${esc(m.name)} ${m.dose ? `<span style="font-weight:400;color:var(--text-muted)">${esc(m.dose)}</span>` : ''}</div>
      <div class="med-meta">${esc([m.schedule, m.startDate ? t('st.since', { date: fmtDate(m.startDate) }) : ''].filter(Boolean).join(' · '))}
        ${m.active === false ? `<span class="badge badge-neutral" style="margin-left:6px">${esc(t('st.stopped'))}</span>` : ''}</div>
    </span>
    <button class="btn btn-outline btn-sm" onclick="openMed('${m.id}')">${esc(t('common.edit'))}</button>
  </div>`).join('');
}

function openMed(id) {
  const m = id ? Store.find(HK.meds, id) : null;
  document.getElementById('medTitle').textContent = t(m ? 'st.medModalEdit' : 'st.medModalAdd');
  document.getElementById('mDeleteBtn').style.display = m ? '' : 'none';
  document.getElementById('m_id').value        = m ? m.id : '';
  document.getElementById('m_name').value      = m ? m.name : '';
  document.getElementById('m_dose').value      = m ? (m.dose || '') : '';
  document.getElementById('m_schedule').value  = m ? (m.schedule || '') : '';
  document.getElementById('m_startDate').value = m ? (m.startDate || '') : '';
  document.getElementById('m_notes').value     = m ? (m.notes || '') : '';
  document.getElementById('m_active').value    = m && m.active === false ? 'no' : 'yes';
  openModal('medModal');
}

function saveMed() {
  const name = document.getElementById('m_name').value.trim();
  if (!name) { toast(t('st.medNeedName'), 'error'); return; }
  const rec = Store.find(HK.meds, document.getElementById('m_id').value) || {};
  rec.name      = name;
  rec.dose      = document.getElementById('m_dose').value.trim();
  rec.schedule  = document.getElementById('m_schedule').value.trim();
  rec.startDate = document.getElementById('m_startDate').value;
  rec.notes     = document.getElementById('m_notes').value.trim();
  rec.active    = document.getElementById('m_active').value === 'yes';
  Store.upsert(HK.meds, rec);
  closeModal('medModal');
  toast(t('common.saved'));
  renderMeds();
}

function deleteMed() {
  const id = document.getElementById('m_id').value;
  confirmAction(t('st.medRemoveQ'), t('st.medRemoveBody'), t('common.remove'), () => {
    Store.remove(HK.meds, id);
    closeModal('medModal');
    renderMeds();
    toast(t('common.deleted'));
  });
}

/* ── Backup ────────────────────────────────────────────────── */
function renderBackupStatus() {
  const since = daysSinceBackup();
  const el = document.getElementById('backupStatus');
  if (since === null) {
    el.innerHTML = `<span class="badge badge-warning">▲ ${esc(t('st.neverBackedUp'))}</span>`;
  } else if (since > BACKUP_NAG_DAYS) {
    el.innerHTML = `<span class="badge badge-warning">▲ ${esc(t('st.lastBackupDays', { n: since }))}</span>`;
  } else {
    el.innerHTML = `<span class="badge badge-good">✓ ${esc(since === 0 ? t('st.lastBackupToday') : t('st.lastBackupNDays', { n: since }))}</span>`;
  }
}

async function doBackup(withFiles = true) {
  toast(t('st.preparing'), 'info');
  try {
    const r = await exportBackup(withFiles);
    toast(withFiles
      ? t('st.backupSaved', { records: r.records, files: r.files, size: fmtBytes(r.bytes) })
      : t('st.backupSavedNoFiles', { records: r.records, size: fmtBytes(r.bytes) }));
    renderBackupStatus();
    renderStorage();
  } catch (e) {
    toast(t('st.backupFailed', { msg: e.message }), 'error');
  }
}

function doRestore(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  confirmAction(t('st.restoreQ'), t('st.restoreBody'), t('st.mergeIn'), async () => {
      try {
        const r = await importBackup(file, 'merge');
        toast(t('st.restored', { records: r.records, files: r.files }));
        setTimeout(() => location.reload(), 1000);
      } catch (e) {
        toast(e.message, 'error');
      }
    }, false);
}

/* ── Storage readout ───────────────────────────────────────── */
async function renderStorage() {
  let lsBytes = 0;
  Object.values(HK).forEach(k => { lsBytes += (localStorage.getItem(k) || '').length * 2; });
  const fileBytes = await Files.totalBytes().catch(() => 0);

  let quotaTxt = '';
  let pct = null;
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      if (est.quota) {
        pct = Math.min(((est.usage || 0) / est.quota) * 100, 100);
        quotaTxt = t('st.quotaLine', { used: fmtBytes(est.usage || 0), quota: fmtBytes(est.quota) });
      }
    } catch {}
  }

  document.getElementById('storageBox').innerHTML = `
    <div class="stats" style="margin-bottom:14px">
      <div class="stat blue"><div class="stat-val">${getVitals().length}</div><div class="stat-lbl">${esc(t('st.dailyReadings'))}</div></div>
      <div class="stat aqua"><div class="stat-val">${getEvents().length}</div><div class="stat-lbl">${esc(t('st.calendarEvents'))}</div></div>
      <div class="stat orange"><div class="stat-val">${getLabs().length}</div><div class="stat-lbl">${esc(t('st.labSets'))}</div></div>
      <div class="stat"><div class="stat-val">${getRecords().length}</div><div class="stat-lbl">${esc(t('st.documents'))}</div></div>
    </div>
    <div style="font-size:12.5px;color:var(--text-2);line-height:1.7">
      ${esc(t('st.recordsText'))} <strong>${fmtBytes(lsBytes)}</strong><br>
      ${esc(t('st.scannedDocs'))} <strong>${fmtBytes(fileBytes)}</strong>
    </div>
    ${pct !== null ? `<div class="store-bar"><div class="store-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div style="font-size:11px;color:var(--text-muted)">${esc(quotaTxt)}</div>` : ''}`;
}

/* ── Wipe ──────────────────────────────────────────────────── */
function wipeAll() {
  confirmAction(t('st.eraseQ'), t('st.eraseQBody'), t('st.eraseConfirm'), () => {
      confirmAction(t('st.eraseQ2'), t('st.eraseQ2Body'), t('st.eraseYes'), async () => {
          for (const r of getRecords()) for (const a of (r.attachments || [])) await Files.del(a.id).catch(() => {});
          Object.values(HK).forEach(k => localStorage.removeItem(k));
          toast(t('st.erased'));
          setTimeout(() => location.reload(), 900);
        });
    });
}

applyI18n();
document.getElementById('lang' + (getLang() === 'el' ? 'El' : 'En')).classList.add('on');
loadForm();
renderMeds();
renderBackupStatus();
renderStorage();
</script>
<script src="health-nav.js"></script>
</body>
</html>
