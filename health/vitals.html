<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log — Daily Log</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="health-style.css">
<style>
.scale-row { display: grid; grid-template-columns: 96px 1fr 34px; gap: 10px; align-items: center; margin-bottom: 9px; }
.scale-row label { font-size: 12px; color: var(--text-2); text-transform: none; letter-spacing: 0; font-weight: 500; margin: 0; }
.scale-row input[type=range] { width: 100%; accent-color: var(--teal); }
.scale-val { font-size: 13px; font-weight: 700; color: var(--teal-dark); text-align: right; font-variant-numeric: tabular-nums; }
.scale-val.unset { color: var(--border); font-weight: 400; }
.section-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-muted); margin: 20px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid); }
.section-lbl:first-child { margin-top: 0; }
.today-strip { background: linear-gradient(135deg, #0f4a42, #1a7a6e); color: #fff; border-radius: var(--radius);
  padding: 18px 22px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.today-strip h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-weight: 500; }
.today-strip p { font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 3px; }
.bp-cell { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="container">

  <div class="page-hdr">
    <div>
      <div class="page-title">Daily Log</div>
      <div class="page-sub">Weight, blood sugar, blood pressure and how she felt — one row per reading.</div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-outline" onclick="exportVitalsCSV()">↓ CSV</button>
      <button class="btn btn-gold" onclick="openEntry()">+ Log a reading</button>
    </div>
  </div>

  <div class="today-strip">
    <div>
      <h3 id="todayHeading">Today</h3>
      <p id="todaySummary">Nothing logged yet today.</p>
    </div>
    <button class="btn btn-gold btn-lg" onclick="openEntry(null, true)">Log today</button>
  </div>

  <div class="stats" id="statTiles"></div>

  <div class="card">
    <div class="card-hdr">
      <div class="card-title">Readings</div>
      <div class="filters" style="margin:0">
        <button class="chip-btn active" data-range="30"  onclick="setRange('30', this)">30 days</button>
        <button class="chip-btn" data-range="90"  onclick="setRange('90', this)">3 months</button>
        <button class="chip-btn" data-range="365" onclick="setRange('365', this)">1 year</button>
        <button class="chip-btn" data-range="all" onclick="setRange('all', this)">All</button>
      </div>
    </div>
    <div class="table-wrap"><table class="data" id="vitalsTable"></table></div>
    <div id="vitalsEmpty"></div>
  </div>

</div>

<!-- ── Entry modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="entryModal">
  <div class="modal wide">
    <h2 id="entryTitle">Log a reading</h2>
    <div class="modal-sub">Leave anything blank that wasn't measured — blanks are not stored as zero.</div>

    <input type="hidden" id="f_id">

    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="f_date"></div>
      <div class="form-group"><label>Time</label><input type="time" id="f_time"></div>
    </div>

    <div class="section-lbl">Body &amp; blood sugar</div>
    <div class="form-row">
      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" step="0.1" inputmode="decimal" id="f_weight" placeholder="e.g. 62.4">
      </div>
      <div class="form-group">
        <label>Blood sugar (mg/dL)</label>
        <input type="number" step="1" inputmode="numeric" id="f_glucose" placeholder="e.g. 112">
      </div>
    </div>
    <div class="form-group">
      <label>When was the sugar taken?</label>
      <select id="f_glucoseContext"></select>
      <div class="hint" id="glucoseHint"></div>
    </div>

    <div class="section-lbl">Vitals</div>
    <div class="form-row4">
      <div class="form-group"><label>Systolic</label><input type="number" inputmode="numeric" id="f_systolic" placeholder="120"></div>
      <div class="form-group"><label>Diastolic</label><input type="number" inputmode="numeric" id="f_diastolic" placeholder="80"></div>
      <div class="form-group"><label>Pulse (bpm)</label><input type="number" inputmode="numeric" id="f_pulse" placeholder="72"></div>
      <div class="form-group"><label>Temp (°C)</label><input type="number" step="0.1" inputmode="decimal" id="f_temp" placeholder="36.6"></div>
    </div>
    <div class="form-group" style="max-width:220px"><label>Oxygen SpO₂ (%)</label><input type="number" inputmode="numeric" id="f_spo2" placeholder="97"></div>

    <div class="section-lbl">How she felt <span style="text-transform:none;letter-spacing:0;font-weight:400">— drag only what applies</span></div>
    <div id="scales"></div>

    <div class="section-lbl">Notes</div>
    <div class="form-group">
      <textarea id="f_notes" placeholder="Anything worth remembering — side effects, appetite, sleep, what the doctor said…"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteEntry()" style="margin-right:auto;display:none">Delete</button>
      <button class="btn btn-outline" onclick="closeModal('entryModal')">Cancel</button>
      <button class="btn btn-teal" onclick="saveEntry()">Save reading</button>
    </div>
  </div>
</div>

<script src="health-base.js"></script>
<script>
/* ── Symptom scales rendered from the metric table ─────────── */
const SCALES = ['pain', 'nausea', 'fatigue', 'appetite', 'mood'];
let currentRange = '30';

function buildScales() {
  document.getElementById('scales').innerHTML = SCALES.map(k => {
    const m = METRICS[k];
    const hint = m.higherIsBetter === false ? '0 = none' : '0 = worst';
    return `<div class="scale-row">
      <label for="f_${k}">${esc(m.label)}</label>
      <input type="range" id="f_${k}" min="0" max="10" step="1" value="0"
             oninput="onScale('${k}')" title="${hint}">
      <span class="scale-val unset" id="v_${k}">–</span>
    </div>`;
  }).join('');
}

/* A slider only counts as "recorded" once it has been touched — otherwise a
   resting 0 would silently claim "no pain at all" on every entry. */
const touched = new Set();
function onScale(k) {
  touched.add(k);
  const el = document.getElementById('v_' + k);
  el.textContent = document.getElementById('f_' + k).value;
  el.classList.remove('unset');
}

function buildContexts() {
  document.getElementById('f_glucoseContext').innerHTML =
    Object.entries(GLUCOSE_CONTEXTS).map(([k, c]) => `<option value="${k}">${esc(c.label)}</option>`).join('');
  document.getElementById('f_glucoseContext').onchange = showGlucoseHint;
  showGlucoseHint();
}
function showGlucoseHint() {
  const c = GLUCOSE_CONTEXTS[document.getElementById('f_glucoseContext').value];
  document.getElementById('glucoseHint').textContent =
    c ? `Usual target for this reading: ${c.low}–${c.high} mg/dL. Your doctor may set a different one.` : '';
}

/* ── Modal ─────────────────────────────────────────────────── */
function openEntry(id, forToday) {
  buildScales();
  touched.clear();
  const existing = id ? Store.find(HK.vitals, id)
    : (forToday ? getVitals().filter(v => v.date === todayISO()).pop() : null);

  document.getElementById('entryTitle').textContent = existing ? 'Edit reading' : 'Log a reading';
  document.getElementById('deleteBtn').style.display = existing ? '' : 'none';
  document.getElementById('f_id').value = existing ? existing.id : '';
  document.getElementById('f_date').value = existing ? existing.date : todayISO();
  document.getElementById('f_time').value = existing ? (existing.time || '') : nowHM();

  ['weight','glucose','systolic','diastolic','pulse','temp','spo2','notes'].forEach(k => {
    document.getElementById('f_' + k).value = existing && existing[k] != null ? existing[k] : '';
  });
  document.getElementById('f_glucoseContext').value = (existing && existing.glucoseContext) || 'fasting';
  showGlucoseHint();

  SCALES.forEach(k => {
    const has = existing && num(existing[k]) !== null;
    document.getElementById('f_' + k).value = has ? existing[k] : 0;
    const v = document.getElementById('v_' + k);
    v.textContent = has ? existing[k] : '–';
    v.classList.toggle('unset', !has);
    if (has) touched.add(k);
  });

  openModal('entryModal');
}

function saveEntry() {
  const date = document.getElementById('f_date').value;
  if (!date) { toast('Pick a date first.', 'error'); return; }

  const rec = Store.find(HK.vitals, document.getElementById('f_id').value) || {};
  rec.date = date;
  rec.time = document.getElementById('f_time').value || '';

  let any = false;
  ['weight','glucose','systolic','diastolic','pulse','temp','spo2'].forEach(k => {
    const v = num(document.getElementById('f_' + k).value);
    const m = METRICS[k];
    if (v !== null && (v < m.min || v > m.max)) {
      toast(`${m.label} of ${v} looks out of range (${m.min}–${m.max} ${m.unit}). Saved anyway — check it.`, 'warning');
    }
    if (v === null) delete rec[k]; else { rec[k] = v; any = true; }
  });

  SCALES.forEach(k => {
    if (touched.has(k)) { rec[k] = num(document.getElementById('f_' + k).value); any = true; }
    else delete rec[k];
  });

  rec.glucoseContext = rec.glucose != null ? document.getElementById('f_glucoseContext').value : '';
  rec.notes = document.getElementById('f_notes').value.trim();

  if (!any && !rec.notes) { toast('Nothing to save — fill in at least one measurement or a note.', 'error'); return; }

  Store.upsert(HK.vitals, rec);
  closeModal('entryModal');
  toast('Reading saved.');
  render();
}

function deleteEntry() {
  const id = document.getElementById('f_id').value;
  if (!id) return;
  confirmAction('Delete this reading?', 'It will be removed from the log and from every chart. This cannot be undone.',
    'Delete', () => {
      Store.remove(HK.vitals, id);
      closeModal('entryModal');
      toast('Reading deleted.');
      render();
    });
}

/* ── Rendering ─────────────────────────────────────────────── */
function setRange(key, btn) {
  currentRange = key;
  document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderToday() {
  const today = getVitals().filter(v => v.date === todayISO());
  document.getElementById('todayHeading').textContent = fmtDateLong(todayISO());
  if (!today.length) {
    document.getElementById('todaySummary').textContent = 'Nothing logged yet today.';
    return;
  }
  const bits = [];
  const last = today[today.length - 1];
  if (last.weight  != null) bits.push(`${fmtNum(last.weight, 1)} kg`);
  if (last.glucose != null) bits.push(`sugar ${fmtNum(last.glucose, 0)} mg/dL`);
  if (last.systolic != null && last.diastolic != null) bits.push(`BP ${last.systolic}/${last.diastolic}`);
  document.getElementById('todaySummary').textContent =
    `${today.length} reading${today.length > 1 ? 's' : ''} today` + (bits.length ? ' — ' + bits.join(', ') : '') + '.';
}

function renderStats() {
  const profile = getProfile();
  const tiles = [];

  /* Weight, with a 30-day delta. Direction has no inherent good/bad in cancer
     care, so the arrow is neutral unless a target range is set. */
  const w = latestVital('weight');
  if (w) {
    const d = metricDelta('weight', 30);
    let deltaHtml = '<div class="stat-delta flat">first reading</div>';
    if (d) {
      const dir = d.diff > 0.05 ? 'up' : d.diff < -0.05 ? 'down' : 'flat';
      const arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→';
      deltaHtml = `<div class="stat-delta flat">${arrow} ${fmtNum(Math.abs(d.diff), 1)} kg vs ${fmtDateShort(d.fromDate)}</div>`;
    }
    tiles.push(`<div class="stat blue">
      <div class="stat-val">${fmtNum(w.weight, 1)}<span class="unit">kg</span></div>
      <div class="stat-lbl">Weight · ${esc(fmtDateShort(w.date))}</div>
      ${deltaHtml}
      <div class="stat-spark" id="sparkWeight"></div>
    </div>`);
  }

  const g = latestVital('glucose');
  if (g) {
    const ctx = GLUCOSE_CONTEXTS[g.glucoseContext] || GLUCOSE_CONTEXTS.random;
    const st = rangeStatus(g.glucose, ctx.low, ctx.high);
    tiles.push(`<div class="stat ${st === 'good' ? 'good' : st === 'critical' ? 'critical' : 'warning'}">
      <div class="stat-val">${fmtNum(g.glucose, 0)}<span class="unit">mg/dL</span></div>
      <div class="stat-lbl">Sugar · ${esc(ctx.label)}</div>
      <div style="margin-top:6px">${statusBadge(st, st === 'good' ? 'In target' : 'Outside target')}</div>
      <div class="stat-spark" id="sparkGlucose"></div>
    </div>`);
  }

  const bp = getVitals().filter(v => v.systolic != null && v.diastolic != null).pop();
  if (bp) {
    const st = rangeStatus(bp.systolic, 90, 140);
    tiles.push(`<div class="stat aqua">
      <div class="stat-val">${bp.systolic}/${bp.diastolic}<span class="unit">mmHg</span></div>
      <div class="stat-lbl">Blood pressure · ${esc(fmtDateShort(bp.date))}</div>
      <div style="margin-top:6px">${statusBadge(st, st === 'good' ? 'Normal' : 'Check')}</div>
    </div>`);
  }

  const all = getVitals();
  const streak = (() => {
    let n = 0, d = todayISO();
    const dates = new Set(all.map(v => v.date));
    if (!dates.has(d)) d = addDays(d, -1);
    while (dates.has(d)) { n++; d = addDays(d, -1); }
    return n;
  })();
  tiles.push(`<div class="stat">
    <div class="stat-val">${all.length}</div>
    <div class="stat-lbl">Readings logged</div>
    <div class="stat-delta flat">${streak ? streak + '-day streak' : 'log today to start a streak'}</div>
  </div>`);

  document.getElementById('statTiles').innerHTML = tiles.join('') ||
    '<div class="stat"><div class="stat-val">—</div><div class="stat-lbl">No readings yet</div></div>';

  renderSparkline(document.getElementById('sparkWeight'),
    vitalSeries('weight', addDays(todayISO(), -90)).map(p => p.y), '#2a78d6');
  renderSparkline(document.getElementById('sparkGlucose'),
    vitalSeries('glucose', addDays(todayISO(), -90)).map(p => p.y), '#eb6834');
}

function renderTable() {
  const from = rangeFrom(currentRange);
  const rows = getVitals().filter(v => inRange(v.date, from, '')).reverse();
  const table = document.getElementById('vitalsTable');
  const empty = document.getElementById('vitalsEmpty');

  if (!rows.length) {
    table.innerHTML = '';
    empty.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>
      <strong>No readings in this period</strong>
      Tap “Log today” above to record her weight, blood sugar or how she is feeling.</div>`;
    return;
  }
  empty.innerHTML = '';

  table.innerHTML = `
    <thead><tr>
      <th>Date</th><th>Time</th>
      <th class="num">Weight</th><th class="num">Sugar</th><th>When</th>
      <th class="num">BP</th><th class="num">Pulse</th><th class="num">Temp</th>
      <th>Symptoms</th><th>Notes</th><th></th>
    </tr></thead>
    <tbody>${rows.map(v => {
      const ctx = GLUCOSE_CONTEXTS[v.glucoseContext];
      const gs  = v.glucose != null && ctx ? rangeStatus(v.glucose, ctx.low, ctx.high) : null;
      const sym = SCALES.filter(k => num(v[k]) !== null)
        .map(k => `<span class="tag">${esc(METRICS[k].label)} ${v[k]}</span>`).join('');
      return `<tr>
        <td>${esc(fmtDate(v.date))}</td>
        <td style="color:var(--text-muted)">${esc(v.time || '—')}</td>
        <td class="num">${v.weight != null ? fmtNum(v.weight, 1) : '—'}</td>
        <td class="num">${v.glucose != null ? `<span style="color:${gs === 'good' ? 'inherit' : 'var(--critical)'};font-weight:${gs === 'good' ? '400' : '600'}">${fmtNum(v.glucose, 0)}</span>` : '—'}</td>
        <td style="color:var(--text-muted);font-size:12px">${ctx ? esc(ctx.label) : '—'}</td>
        <td class="num bp-cell">${v.systolic != null && v.diastolic != null ? v.systolic + '/' + v.diastolic : '—'}</td>
        <td class="num">${v.pulse != null ? v.pulse : '—'}</td>
        <td class="num">${v.temp != null ? fmtNum(v.temp, 1) : '—'}</td>
        <td>${sym || '<span style="color:var(--border)">—</span>'}</td>
        <td style="max-width:220px;font-size:12px;color:var(--text-2)">${esc((v.notes || '').slice(0, 90))}${(v.notes || '').length > 90 ? '…' : ''}</td>
        <td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="openEntry('${v.id}')">Edit</button></div></td>
      </tr>`;
    }).join('')}</tbody>`;
}

function render() { renderToday(); renderStats(); renderTable(); }

buildContexts();
buildScales();
render();
</script>
<script src="health-nav.js"></script>
</body>
</html>
