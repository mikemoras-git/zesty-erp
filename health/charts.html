<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log — Trends</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="health-style.css">
<style>
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.toggle-row input { accent-color: var(--teal); width: 15px; height: 15px; }
.lab-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lab-pick select { padding: 7px 11px; border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 13px; outline: none; background: var(--surface); min-width: 210px; }
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 16px; }
@media(max-width:1000px){ .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body data-i18n-doctitle="tr.title">
<div class="container wide">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="tr.title"></div>
      <div class="page-sub" data-i18n="tr.sub"></div>
    </div>
  </div>

  <div class="filters">
    <button class="chip-btn" data-range="30"  onclick="setRange('30', this)" data-i18n="common.30days"></button>
    <button class="chip-btn active" data-range="90" onclick="setRange('90', this)" data-i18n="common.3months"></button>
    <button class="chip-btn" data-range="180" onclick="setRange('180', this)" data-i18n="common.6months"></button>
    <button class="chip-btn" data-range="365" onclick="setRange('365', this)" data-i18n="common.1year"></button>
    <button class="chip-btn" data-range="all" onclick="setRange('all', this)" data-i18n="common.allTime"></button>
    <label class="toggle-row" style="margin-left:auto">
      <input type="checkbox" id="showMarkers" checked onchange="render()"> <span data-i18n="tr.showTreatments"></span>
    </label>
  </div>

  <div class="chart-grid">

    <div class="chart-card">
      <div class="chart-hdr">
        <div>
          <div class="chart-title" data-i18n="tr.weight"></div>
          <div class="chart-sub" id="weightSub"></div>
        </div>
      </div>
      <div class="chart-host" id="chartWeight"></div>
    </div>

    <div class="chart-card">
      <div class="chart-hdr">
        <div>
          <div class="chart-title" data-i18n="tr.sugar"></div>
          <div class="chart-sub" data-i18n="tr.sugarSub"></div>
        </div>
      </div>
      <div class="chart-host" id="chartGlucose"></div>
    </div>

    <div class="chart-card">
      <div class="chart-hdr">
        <div>
          <div class="chart-title" data-i18n="tr.bp"></div>
          <div class="chart-sub" data-i18n="tr.bpSub"></div>
        </div>
      </div>
      <div class="chart-host" id="chartBP"></div>
    </div>

    <div class="chart-card">
      <div class="chart-hdr">
        <div>
          <div class="chart-title" data-i18n="tr.felt"></div>
          <div class="chart-sub" data-i18n="tr.feltSub"></div>
        </div>
      </div>
      <div class="chart-host" id="chartSymptoms"></div>
    </div>

  </div>

  <div class="chart-card">
    <div class="chart-hdr">
      <div>
        <div class="chart-title" data-i18n="tr.labTrend"></div>
        <div class="chart-sub" id="labSub"></div>
      </div>
      <div class="lab-pick">
        <select id="labSelect" onchange="renderLab()"></select>
      </div>
    </div>
    <div class="chart-host" id="chartLab"></div>
  </div>

  <div class="card no-print">
    <div class="card-note" data-i18n="tr.disclaimer"></div>
  </div>

</div>

<script src="health-i18n.js"></script>
<script src="health-base.js"></script>
<script>
let range = '90';

function setRange(k, btn) {
  range = k;
  document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function markers() {
  if (!document.getElementById('showMarkers').checked) return [];
  return treatmentMarkers(rangeFrom(range), '');
}

/* ── Weight ────────────────────────────────────────────────── */
function renderWeight() {
  const from = rangeFrom(range);
  const pts = vitalSeries('weight', from, '');
  const tg = getProfile().targets || {};
  const band = (num(tg.weightLow) !== null || num(tg.weightHigh) !== null)
    ? { low: tg.weightLow, high: tg.weightHigh, label: t('tr.targetRange') } : null;

  const first = pts[0], last = pts[pts.length - 1];
  document.getElementById('weightSub').textContent = pts.length > 1
    ? t('tr.kgChange', { n: fmtNum(last.y - first.y, 1), date: fmtDate(first.x) })
    : t('tr.kilograms');

  renderLineChart(document.getElementById('chartWeight'), {
    title: L(METRICS.weight), unit: 'kg', dec: 1, height: 250, band, markers: markers(),
    series: [{ key: 'weight', label: L(METRICS.weight), color: '#2a78d6', points: pts }],
    emptyMsg: t('tr.noWeight')
  });
}

/* ── Blood sugar ───────────────────────────────────────────── */
function renderGlucose() {
  const from = rangeFrom(range);
  const buckets = glucoseSeriesByContext(from, '');
  const order = ['fasting', 'postmeal', 'premeal', 'bedtime', 'random'];
  const colors = { fasting: '#2a78d6', postmeal: '#eb6834', premeal: '#1baf7a', bedtime: '#eda100', random: '#eda100' };

  const series = order.filter(k => buckets[k] && buckets[k].length).map(k => ({
    key: k, label: L(GLUCOSE_CONTEXTS[k]), color: colors[k], points: buckets[k]
  }));

  const tg = getProfile().targets || {};
  renderLineChart(document.getElementById('chartGlucose'), {
    title: L(METRICS.glucose), unit: 'mg/dL', dec: 0, height: 250, markers: markers(),
    band: { low: tg.glucoseLow || 70, high: tg.glucoseHigh || 180, label: t('tr.target') },
    series,
    emptyMsg: t('tr.noSugar')
  });
}

/* ── Blood pressure (one axis: systolic, diastolic and pulse are all
      plotted against the same numeric scale, never a second y-axis) ── */
function renderBP() {
  const from = rangeFrom(range);
  const series = [
    { key: 'systolic',  label: L(METRICS.systolic),  color: '#2a78d6', points: vitalSeries('systolic', from, '') },
    { key: 'diastolic', label: L(METRICS.diastolic), color: '#eb6834', points: vitalSeries('diastolic', from, '') },
    { key: 'pulse',     label: L(METRICS.pulse),     color: '#1baf7a', points: vitalSeries('pulse', from, '') }
  ].filter(s => s.points.length);

  renderLineChart(document.getElementById('chartBP'), {
    title: t('tr.bp'), unit: '', dec: 0, height: 250, markers: markers(), series,
    emptyMsg: t('tr.noBp')
  });
}

/* ── Symptom scores ────────────────────────────────────────── */
function renderSymptoms() {
  const from = rangeFrom(range);
  const series = [
    { key: 'pain',     label: L(METRICS.pain),     color: '#2a78d6', points: vitalSeries('pain', from, '') },
    { key: 'nausea',   label: L(METRICS.nausea),   color: '#eb6834', points: vitalSeries('nausea', from, '') },
    { key: 'fatigue',  label: L(METRICS.fatigue),  color: '#1baf7a', points: vitalSeries('fatigue', from, '') },
    { key: 'appetite', label: L(METRICS.appetite), color: '#eda100', points: vitalSeries('appetite', from, '') }
  ].filter(s => s.points.length);

  renderLineChart(document.getElementById('chartSymptoms'), {
    title: t('tr.felt'), unit: '/10', dec: 0, height: 250, yMin: 0, yMax: 10, markers: markers(), series,
    emptyMsg: t('tr.noSymptoms')
  });
}

/* ── Lab trend ─────────────────────────────────────────────── */
function buildLabSelect() {
  const keys = labTestsWithData(1);
  const sel = document.getElementById('labSelect');
  if (!keys.length) {
    sel.innerHTML = `<option value="">${esc(t('tr.noLabs'))}</option>`;
    return;
  }
  const prev = sel.value;
  sel.innerHTML = keys.map(k => {
    const def = LAB_TESTS[k];
    const n = labSeries(k, '', '').length;
    return `<option value="${k}">${esc(def ? L(def) : k)} (${n})</option>`;
  }).join('');
  if (prev && keys.includes(prev)) sel.value = prev;
}

function renderLab() {
  const key = document.getElementById('labSelect').value;
  const host = document.getElementById('chartLab');
  if (!key) {
    host.innerHTML = `<div class="empty" style="padding:34px 16px"><div class="empty-icon">🧪</div>
      ${esc(t('tr.labEmpty'))}</div>`;
    document.getElementById('labSub').textContent = t('tr.labPick');
    return;
  }

  const def = LAB_TESTS[key] || {};
  const pts = labSeries(key, rangeFrom(range), '');
  const ref = pts.length ? pts[pts.length - 1] : {};

  const name = def.label ? L(def) : key;
  document.getElementById('labSub').textContent =
    `${name}${def.unit ? ' — ' + def.unit : ''}` +
    (ref.low != null || ref.high != null
      ? ' · ' + t('tr.reference', { low: ref.low ?? '–', high: ref.high ?? '–' }) : '');

  renderLineChart(host, {
    title: name, unit: def.unit || '', dec: def.dec ?? 1, height: 260, markers: markers(),
    band: (ref.low != null || ref.high != null) ? { low: ref.low, high: ref.high, label: t('tr.referenceRange') } : null,
    series: [{ key, label: name, color: '#2a78d6', points: pts }],
    emptyMsg: t('tr.noLabPeriod')
  });
}

function render() {
  renderWeight();
  renderGlucose();
  renderBP();
  renderSymptoms();
  buildLabSelect();
  renderLab();
}

applyI18n();
render();
</script>
<script src="health-nav.js"></script>
</body>
</html>
