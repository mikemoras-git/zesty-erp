<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Log</title>
<style>
/* ════════════════════════════════════════════════════════════════
   Care Log — single file. Generated by health/build-single.js;
   edit the pages under health/ and rebuild rather than editing this.
   ════════════════════════════════════════════════════════════════ */
/**
 * Care Log — shared stylesheet
 * Local-first medical tracking. Light mode only, matching the Zesty ERP family.
 */

/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  /* UI chrome (teal family, harmonised with Zesty ERP) */
  --teal:        #1a7a6e;
  --teal-dark:   #115950;
  --teal-deep:   #0a3d36;
  --teal-wash:   #f0faf8;
  --gold:        #c9a84c;
  --gold-light:  #e8c97a;

  --cream:       #f8f5f0;
  --surface:     #ffffff;
  --plane:       #f8f5f0;

  /* Ink */
  --text:        #1e2a28;
  --text-2:      #52514e;
  --text-muted:  #6b7e7b;

  /* Hairlines */
  --border:      #d4e0de;
  --grid:        #e8eeed;
  --axis:        #c3c2b7;

  /* Validated categorical series slots (see dataviz palette).
     Slots 1-3 clear all-pairs CVD + normal-vision gates on a white surface. */
  --series-1:    #2a78d6;  /* blue   */
  --series-2:    #eb6834;  /* orange */
  --series-3:    #1baf7a;  /* aqua   */
  --series-4:    #eda100;  /* yellow — adjacent-forms only */

  /* Status (fixed, never themed, always paired with icon + label) */
  --good:        #0ca30c;
  --good-bg:     #eafaf1;
  --warning:     #fab219;
  --warning-bg:  #fef9ec;
  --serious:     #ec835a;
  --serious-bg:  #fdf1ec;
  --critical:    #d03b3b;
  --critical-bg: #fdf0ef;

  --radius:      12px;
  --shadow:      0 2px 16px rgba(26,122,110,.10);
  --shadow-lg:   0 8px 40px rgba(26,122,110,.16);

  --sidebar-w:   208px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--plane);
  color: var(--text);
  min-height: 100vh;
  margin-left: var(--sidebar-w);
  -webkit-text-size-adjust: 100%;
}

.container { max-width: 1180px; margin: 0 auto; padding: 28px 24px 90px; }
.container.wide { max-width: 1400px; }

/* ── SIDEBAR ────────────────────────────────────────────────── */
#h-sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); z-index: 900;
  background: linear-gradient(175deg, #0a3330 0%, #0d4a41 60%, #0f3d35 100%);
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,.06);
  box-shadow: 4px 0 30px rgba(0,0,0,.35);
  overflow-y: auto; overflow-x: hidden;
  transition: transform .26s cubic-bezier(.4,0,.2,1);
}
#h-sidebar::-webkit-scrollbar { width: 3px; }
#h-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

.h-brand { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.07); flex-shrink: 0; }
.h-brand-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 21px; font-weight: 600; color: #fff; line-height: 1; letter-spacing: .3px;
}
.h-brand-name span { color: var(--gold-light); }
.h-brand-sub {
  font-size: 9px; color: rgba(255,255,255,.3); text-transform: uppercase;
  letter-spacing: 2.4px; margin-top: 5px; font-family: 'DM Mono', ui-monospace, monospace;
}
.h-patient {
  padding: 11px 18px; font-size: 12px; color: rgba(255,255,255,.72);
  border-bottom: 1px solid rgba(255,255,255,.07); line-height: 1.4;
}
.h-patient small { display: block; font-size: 10px; color: rgba(255,255,255,.34); margin-top: 2px; }

.h-section { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em;
  color: rgba(255,255,255,.2); padding: 13px 18px 4px; }

.h-link {
  display: flex; align-items: center; gap: 10px; padding: 9px 18px;
  color: rgba(255,255,255,.56); text-decoration: none; font-size: 13px;
  border-left: 2px solid transparent; transition: all .13s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.h-link:hover { color: rgba(255,255,255,.92); background: rgba(255,255,255,.05); border-left-color: rgba(255,255,255,.15); }
.h-link.active { color: var(--gold-light); background: rgba(201,168,76,.1); border-left-color: var(--gold); font-weight: 600; }
.h-link-icon { width: 20px; text-align: center; font-size: 13px; opacity: .75; flex-shrink: 0; font-style: normal; }
.h-link.active .h-link-icon { opacity: 1; }

.h-foot { margin-top: auto; padding: 13px 18px; border-top: 1px solid rgba(255,255,255,.07); flex-shrink: 0; }
.h-store { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(255,255,255,.3);
  font-family: 'DM Mono', ui-monospace, monospace; }
.h-store-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.h-store-dot.warn { background: var(--warning); }

#h-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 899; }
#h-overlay.open { display: block; }
#h-burger {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 901;
  background: var(--teal-dark); border: 1px solid rgba(255,255,255,.2); color: #fff;
  font-size: 18px; padding: 6px 11px; border-radius: 8px; cursor: pointer; line-height: 1;
  box-shadow: 0 2px 10px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent;
}

/* ── PAGE HEADER ────────────────────────────────────────────── */
.page-hdr { display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
.page-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 31px;
  font-weight: 400; color: var(--teal-dark); line-height: 1.15; }
.page-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── CARDS ──────────────────────────────────────────────────── */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 22px; margin-bottom: 16px; }
.card-hdr { display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title { font-size: 14px; font-weight: 600; color: var(--teal-dark); }
.card-note { font-size: 11px; color: var(--text-muted); }

/* ── STAT TILES ─────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); border-left: 4px solid var(--teal); min-width: 0; }
.stat.blue     { border-left-color: var(--series-1); }
.stat.orange   { border-left-color: var(--series-2); }
.stat.aqua     { border-left-color: var(--series-3); }
.stat.good     { border-left-color: var(--good); }
.stat.warning  { border-left-color: var(--warning); }
.stat.critical { border-left-color: var(--critical); }
.stat-val { font-size: 25px; font-weight: 700; color: var(--teal-dark); line-height: 1.1; }
.stat-val .unit { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }
.stat-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); margin-top: 5px; }
.stat-delta { font-size: 11.5px; margin-top: 6px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.stat-delta.up   { color: #006300; }
.stat-delta.down { color: var(--critical); }
.stat-delta.flat { color: var(--text-muted); }
.stat-spark { margin-top: 8px; height: 30px; }

/* ── HERO ───────────────────────────────────────────────────── */
.hero-fig { font-size: 48px; font-weight: 700; color: var(--teal-dark); line-height: 1; }
.hero-lbl { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

/* ── BUTTONS ────────────────────────────────────────────────── */
.btn { padding: 7px 15px; border-radius: 8px; border: none; font-family: inherit;
  font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .18s;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-teal    { background: var(--teal); color: #fff; }
.btn-teal:hover:not(:disabled) { background: var(--teal-dark); }
.btn-gold    { background: var(--gold); color: var(--teal-deep); font-weight: 700; }
.btn-gold:hover:not(:disabled) { background: var(--gold-light); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
.btn-outline:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); background: var(--teal-wash); }
.btn-danger  { background: var(--critical-bg); color: var(--critical); border: 1px solid #f5c6c2; }
.btn-danger:hover:not(:disabled) { background: var(--critical); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 11.5px; border-radius: 6px; }
.btn-lg { padding: 10px 22px; font-size: 14px; border-radius: 10px; }

/* ── TABS & FILTERS ─────────────────────────────────────────── */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px;
  overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-muted); border: none; border-bottom: 2px solid transparent;
  margin-bottom: -2px; background: transparent; font-family: inherit; transition: all .2s; white-space: nowrap; }
.tab.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.chip-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer;
  font-family: inherit; color: var(--text-muted); transition: all .15s; }
.chip-btn:hover { border-color: var(--teal); color: var(--teal); }
.chip-btn.active { border-color: var(--teal); color: var(--teal); background: var(--teal-wash); font-weight: 700; }

.search-box { flex: 1; min-width: 180px; max-width: 320px; padding: 7px 12px;
  border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
  font-size: 13px; outline: none; background: var(--surface); }
.search-box:focus { border-color: var(--teal); }

/* ── FORMS ──────────────────────────────────────────────────── */
.form-group { margin-bottom: 13px; }
.form-group label { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-muted); display: block; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 7px;
  font-family: inherit; font-size: 13px; outline: none; background: var(--surface); color: var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--teal); }
.form-group textarea { resize: vertical; min-height: 66px; line-height: 1.5; }
.form-group .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

/* ── TABLES ─────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); font-weight: 600; padding: 8px 10px;
  border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface);
}
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
table.data tbody tr:hover { background: var(--teal-wash); }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data th.num { text-align: right; }
table.data .row-actions { display: flex; gap: 5px; justify-content: flex-end; }

/* ── BADGES ─────────────────────────────────────────────────── */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-good     { background: var(--good-bg);     color: #006300; }
.badge-warning  { background: var(--warning-bg);  color: #8a5d00; }
.badge-serious  { background: var(--serious-bg);  color: #a4441c; }
.badge-critical { background: var(--critical-bg); color: var(--critical); }
.badge-neutral  { background: var(--cream);       color: var(--text-muted); }
.badge-teal     { background: var(--teal-wash);   color: var(--teal); }

.tag { display: inline-block; font-size: 11px; background: var(--cream); color: var(--text-muted);
  padding: 2px 8px; border-radius: 4px; margin: 2px 3px 2px 0; }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 1000; align-items: center; justify-content: center; padding: 16px;
  backdrop-filter: blur(3px); overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; padding: 26px; width: 100%;
  max-width: 540px; box-shadow: var(--shadow-lg); max-height: 92vh; overflow-y: auto;
  animation: modal-in .2s ease; }
.modal.wide { max-width: 780px; }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.modal h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px;
  color: var(--teal-dark); margin-bottom: 4px; font-weight: 500; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
  padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* ── EMPTY ──────────────────────────────────────────────────── */
.empty { text-align: center; padding: 54px 20px; color: var(--text-muted); font-size: 13.5px; }
.empty-icon { font-size: 42px; margin-bottom: 12px; opacity: .55; }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; font-weight: 600; }

/* ── CHART ──────────────────────────────────────────────────── */
.chart-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 20px 14px; margin-bottom: 16px; }
.chart-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  margin-bottom: 4px; flex-wrap: wrap; }
.chart-title { font-size: 14px; font-weight: 600; color: var(--teal-dark); }
.chart-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 2px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.chart-body { position: relative; width: 100%; }
.chart-body svg { display: block; width: 100%; overflow: visible; }
.chart-tip {
  position: absolute; pointer-events: none; z-index: 5; opacity: 0;
  background: rgba(10,61,54,.96); color: #fff; border-radius: 8px; padding: 8px 11px;
  font-size: 11.5px; line-height: 1.55; white-space: nowrap; transition: opacity .12s;
  box-shadow: 0 6px 22px rgba(0,0,0,.28);
}
.chart-tip.on { opacity: 1; }
.chart-tip .tip-date { font-weight: 600; margin-bottom: 3px; color: var(--gold-light); }
.chart-tip .tip-row { display: flex; align-items: center; gap: 6px; }
.chart-tip .tip-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.chart-tip .tip-val { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; font-weight: 600; }
.chart-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 8px; flex-wrap: wrap; }
.chart-note { font-size: 11px; color: var(--text-muted); }

/* ── PRINT ──────────────────────────────────────────────────── */
@media print {
  body { margin-left: 0 !important; background: #fff; }
  #h-sidebar, #h-burger, #h-overlay, .no-print, .hdr-actions { display: none !important; }
  .container { max-width: none; padding: 0; }
  .card, .chart-card, .stat { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  .page-break { break-before: page; }
  a { text-decoration: none; color: inherit; }
}

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media (max-width: 900px) {
  body { margin-left: 0; }
  #h-sidebar { transform: translateX(-100%); }
  #h-sidebar.open { transform: none; }
  #h-burger { display: block; }
  .container { padding: 58px 14px 80px; }
  .page-title { font-size: 25px; }
  .form-row, .form-row3, .form-row4 { grid-template-columns: 1fr; }
  .card, .chart-card { padding: 16px 14px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 9px; }
  .stat-val { font-size: 21px; }
}

/* ── LANGUAGE SWITCH ────────────────────────────────────────── */
.h-lang { display: flex; gap: 4px; margin-bottom: 10px; }
.h-lang-btn {
  flex: 1; padding: 4px 0; border-radius: 6px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.14); background: transparent;
  color: rgba(255,255,255,.45); font-family: 'DM Mono', ui-monospace, monospace;
  font-size: 10px; letter-spacing: .08em; transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.h-lang-btn:hover { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.3); }
.h-lang-btn.on { background: rgba(201,168,76,.16); border-color: var(--gold); color: var(--gold-light); font-weight: 700; }

/* Settings page: the same choice, spelled out */
.lang-choice { display: flex; gap: 10px; flex-wrap: wrap; }
.lang-opt {
  display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
  font-family: inherit; font-size: 13.5px; color: var(--text-2); transition: all .15s; min-width: 150px;
}
.lang-opt:hover { border-color: var(--teal); }
.lang-opt.on { border-color: var(--teal); background: var(--teal-wash); color: var(--teal); font-weight: 600; }
.lang-opt .flag { font-size: 18px; }


.view[hidden] { display: none !important; }

/* ── index.html ── */
.hero { background: linear-gradient(135deg, #0a3d36 0%, #1a7a6e 100%); color: #fff;
  border-radius: 16px; padding: 26px 28px; margin-bottom: 18px; }
.hero-name { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 27px; font-weight: 500; }
.hero-dx { font-size: 13px; color: rgba(255,255,255,.72); margin-top: 4px; }
.hero-next { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero-next-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: rgba(255,255,255,.44); }
.hero-next-title { font-size: 17px; font-weight: 600; margin-top: 5px; display: flex; align-items: center; gap: 8px; }
.hero-next-when { font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 4px; }
.hero-countdown { text-align: right; }
.hero-countdown .n { font-size: 40px; font-weight: 700; line-height: 1; color: var(--gold-light); }
.hero-countdown .u { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.5); margin-top: 3px; }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 11px; margin-bottom: 20px; }
.quick a { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 15px 17px; text-decoration: none; color: var(--text); display: flex; align-items: center;
  gap: 12px; transition: all .18s; border-left: 4px solid transparent; }
.quick a:hover { box-shadow: var(--shadow-lg); border-left-color: var(--gold); transform: translateY(-1px); }
.quick .ico { font-size: 21px; }
.quick .lbl { font-size: 13px; font-weight: 600; display: block; }
.quick .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; display: block; }

.two-col { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
@media(max-width:980px){ .two-col { grid-template-columns: 1fr; } }

.mini-ev { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.mini-ev:last-child { border-bottom: none; }
.mini-ev .ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-shrink: 0; }
.mini-ev .tx { flex: 1; min-width: 0; }
.mini-ev .t1 { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-ev .t2 { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.mini-ev .rel { font-size: 11.5px; font-weight: 600; color: var(--teal); white-space: nowrap; }

.nag { background: var(--warning-bg); border-left: 4px solid var(--warning); border-radius: var(--radius);
  padding: 13px 17px; margin-bottom: 16px; font-size: 13px; color: #6b4a00;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.nag strong { color: #4a3300; }
.setup { background: var(--teal-wash); border: 1px solid #bfe3dd; border-radius: var(--radius);
  padding: 24px 26px; margin-bottom: 18px; }

/* ── vitals.html ── */
.scale-row { display: grid; grid-template-columns: 96px 1fr 34px; gap: 10px; align-items: center; margin-bottom: 9px; }
.scale-row label { font-size: 12px; color: var(--text-2); text-transform: none; letter-spacing: 0; font-weight: 500; margin: 0; }
.scale-row input[type=range] { width: 100%; accent-color: var(--teal); }
.scale-val { font-size: 13px; font-weight: 700; color: var(--teal-dark); text-align: right; font-variant-numeric: tabular-nums; }
.scale-val.unset { color: var(--border); font-weight: 400; }
.section-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-muted); margin: 20px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid); }
.section-lbl:first-child { margin-top: 0; }
.today-strip { background: linear-gradient(135deg, #0f4a42, #1a7a6e); color: #fff; border-radius: var(--radius);
  padding: 18px 22px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.today-strip h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-weight: 500; }
.today-strip p { font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 3px; }
.bp-cell { font-variant-numeric: tabular-nums; }

/* ── calendar.html ── */
.cal-nav { display: flex; align-items: center; gap: 10px; }
.cal-month { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; color: var(--teal-dark);
  min-width: 180px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--grid);
  border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; }
.cal-dow { background: var(--surface); padding: 8px 6px; text-align: center; font-size: 10px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.cal-day { background: var(--surface); min-height: 104px; padding: 6px 6px 8px; position: relative;
  cursor: pointer; transition: background .12s; }
.cal-day:hover { background: var(--teal-wash); }
.cal-day.other { background: #fbfbfa; }
.cal-day.other .cal-num { color: var(--border); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--teal); }
.cal-num { font-size: 12px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.cal-day.today .cal-num { color: var(--teal); }
.cal-vital { position: absolute; top: 8px; right: 7px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--series-1); opacity: .55; }
.cal-ev { display: flex; align-items: center; gap: 4px; font-size: 10.5px; line-height: 1.3;
  margin-top: 3px; padding: 2px 4px; border-radius: 4px; border-left: 3px solid var(--axis);
  background: var(--cream); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev.done { opacity: .5; text-decoration: line-through; }
.cal-more { font-size: 10px; color: var(--text-muted); margin-top: 3px; padding-left: 4px; }

.agenda-item { display: grid; grid-template-columns: 62px 1fr auto; gap: 14px; align-items: start;
  padding: 13px 0; border-bottom: 1px solid var(--grid); }
.agenda-item:last-child { border-bottom: none; }
.agenda-date { text-align: center; }
.agenda-date .d { font-size: 20px; font-weight: 700; color: var(--teal-dark); line-height: 1; font-variant-numeric: tabular-nums; }
.agenda-date .m { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-top: 3px; }
.agenda-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.agenda-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
.agenda-rel { font-size: 11.5px; font-weight: 600; color: var(--teal); white-space: nowrap; }
.type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.type-opt { padding: 9px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  cursor: pointer; font-size: 11.5px; text-align: center; font-family: inherit; color: var(--text-2); transition: all .15s; }
.type-opt:hover { border-color: var(--teal); }
.type-opt.sel { border-color: var(--teal); background: var(--teal-wash); color: var(--teal); font-weight: 700; }
.type-opt .ico { display: block; font-size: 17px; margin-bottom: 3px; }
@media(max-width:900px){
  .cal-day { min-height: 76px; padding: 4px 3px 6px; }
  .cal-ev { font-size: 9px; padding: 1px 3px; }
  .type-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ── labs.html ── */
.panel { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 10px; overflow: hidden; }
.panel > summary { padding: 10px 14px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  color: var(--teal-dark); background: var(--teal-wash); list-style: none; display: flex;
  align-items: center; justify-content: space-between; gap: 10px; }
.panel > summary::-webkit-details-marker { display: none; }
.panel > summary::after { content: '▾'; color: var(--text-muted); font-size: 11px; }
.panel[open] > summary::after { content: '▴'; }
.panel-body { padding: 10px 14px 14px; }
.test-row { display: grid; grid-template-columns: 1fr 88px 74px 64px 64px; gap: 8px; align-items: center; margin-bottom: 7px; }
.test-row .tname { font-size: 12.5px; color: var(--text-2); min-width: 0; }
.test-row input { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; font-size: 12.5px; outline: none; width: 100%; }
.test-row input:focus { border-color: var(--teal); }
.test-row input.val { font-weight: 600; }
.test-row .tunit { font-size: 11px; color: var(--text-muted); text-align: center; }
.test-head { display: grid; grid-template-columns: 1fr 88px 74px 64px 64px; gap: 8px;
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted);
  font-weight: 600; margin-bottom: 6px; }
.test-head span:first-child { text-align: left; }
.test-head span { text-align: center; }
.result-card { border-bottom: 1px solid var(--grid); padding: 14px 0; }
.result-card:last-child { border-bottom: none; }
.result-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.result-title { font-size: 14px; font-weight: 600; color: var(--text); }
.result-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.val-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; margin-top: 11px; }
.val-chip { border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.val-chip.out { border-color: #f3d3ce; background: #fffaf9; }
.val-name { font-size: 10.5px; color: var(--text-muted); margin-bottom: 3px; }
.val-num { font-size: 15px; font-weight: 700; color: var(--teal-dark); font-variant-numeric: tabular-nums; }
.val-chip.out .val-num { color: var(--critical); }
.val-num .u { font-size: 10.5px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }
.val-ref { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.trend-arrow { font-size: 11px; font-weight: 700; margin-left: 5px; }
@media(max-width:900px){
  .test-row, .test-head { grid-template-columns: 1fr 76px 56px; }
  .test-row input.lo, .test-row input.hi, .test-head span:nth-child(4), .test-head span:nth-child(5) { display: none; }
}

/* ── records.html ── */
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
.rec { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s; }
.rec:hover { box-shadow: var(--shadow-lg); }
.rec-thumb { height: 128px; background: var(--cream); display: flex; align-items: center;
  justify-content: center; font-size: 40px; position: relative; overflow: hidden; cursor: pointer; }
.rec-thumb img { width: 100%; height: 100%; object-fit: cover; }
.rec-count { position: absolute; bottom: 7px; right: 7px; background: rgba(10,61,54,.85); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; }
.rec-body { padding: 12px 14px 13px; flex: 1; display: flex; flex-direction: column; }
.rec-cat { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 4px; }
.rec-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 5px; }
.rec-meta { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
.rec-foot { display: flex; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--grid); }
.drop { border: 2px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center;
  color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all .18s; background: #fdfdfc; }
.drop:hover, .drop.over { border-color: var(--teal); background: var(--teal-wash); color: var(--teal); }
.att-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--grid);
  border-radius: 7px; margin-bottom: 6px; font-size: 12.5px; }
.att-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-row .s { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.imp-bar { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 9px; }
.imp-keep { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px;
  background: var(--teal-wash); border-radius: 9px; cursor: pointer; }
.imp-keep input { margin-top: 2px; accent-color: var(--teal); width: 16px; height: 16px; flex-shrink: 0; }
.imp-keep .hint { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
#impTable td { padding: 6px 8px; }
#impTable input[type=date], #impTable select, #impTable input[type=text] {
  padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
  font-size: 12px; outline: none; width: 100%; background: var(--surface); }
#impTable .fname { font-size: 11.5px; color: var(--text-muted); max-width: 210px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#impTable input[type=checkbox] { accent-color: var(--teal); width: 15px; height: 15px; }

/* ── charts.html ── */
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.toggle-row input { accent-color: var(--teal); width: 15px; height: 15px; }
.lab-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lab-pick select { padding: 7px 11px; border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 13px; outline: none; background: var(--surface); min-width: 210px; }
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 16px; }
@media(max-width:1000px){ .chart-grid { grid-template-columns: 1fr; } }

/* ── reports.html ── */
.rpt { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 34px; }
.rpt-head { border-bottom: 2px solid var(--teal); padding-bottom: 15px; margin-bottom: 22px; }
.rpt-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: var(--teal-dark); }
.rpt-for { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 7px; }
.rpt-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }
.rpt-sec { margin-bottom: 26px; break-inside: avoid; }
.rpt-sec h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--teal); padding-bottom: 6px; border-bottom: 1px solid var(--grid); margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.kv-item { }
.kv-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.kv-val { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 3px; font-variant-numeric: tabular-nums; }
.tl { position: relative; padding-left: 24px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--grid); }
.tl-item { position: relative; padding: 8px 0; break-inside: avoid; }
.tl-dot { position: absolute; left: -22px; top: 12px; width: 11px; height: 11px; border-radius: 50%;
  border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--grid); }
.tl-date { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tl-title { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 1px; }
.tl-note { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.5; }
.rpt-foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--grid);
  font-size: 10.5px; color: var(--text-muted); line-height: 1.6; }
.qbox { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-height: 78px; }
.qbox .line { border-bottom: 1px solid var(--grid); height: 26px; }
@media print { .rpt { padding: 0; } }
@media (max-width:900px){ .rpt { padding: 18px 15px; } .rpt-title { font-size: 21px; } }

/* ── settings.html ── */
.danger-card { border: 1px solid #f0cdc8; background: #fffbfa; }
.danger-card .card-title { color: var(--critical); }
.store-bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 9px 0 6px; }
.store-fill { height: 100%; background: var(--teal); }
.med-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.med-row:last-child { border-bottom: none; }
.med-name { font-size: 13.5px; font-weight: 600; }
.med-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.med-row.off { opacity: .5; }
</style>
</head>
<body>

<section class="view" id="view-overview" hidden>
<div class="container">

  <div id="setupBox"></div>
  <div id="nagBox"></div>
  <div id="heroBox"></div>

  <div class="quick">
    <a href="#vitals"><span class="ico">◔</span><span><span class="lbl" data-i18n="ov.qLogToday"></span><span class="sub" data-i18n="ov.qLogTodaySub"></span></span></a>
    <a href="#calendar"><span class="ico">📅</span><span><span class="lbl" data-i18n="ov.qAddAppt"></span><span class="sub" data-i18n="ov.qAddApptSub"></span></span></a>
    <a href="#labs"><span class="ico">🧪</span><span><span class="lbl" data-i18n="ov.qAddLab"></span><span class="sub" data-i18n="ov.qAddLabSub"></span></span></a>
    <a href="#records"><span class="ico">🗂</span><span><span class="lbl" data-i18n="ov.qAddDoc"></span><span class="sub" data-i18n="ov.qAddDocSub"></span></span></a>
  </div>

  <div class="stats" id="overview_statTiles"></div>

  <div class="two-col">
    <div>
      <div class="chart-card">
        <div class="chart-hdr">
          <div>
            <div class="chart-title" data-i18n="ov.weight90"></div>
            <div class="chart-sub" id="wSub"></div>
          </div>
          <a href="#charts" class="btn btn-outline btn-sm" data-i18n="ov.allTrends"></a>
        </div>
        <div class="chart-host" id="overview_chartWeight"></div>
      </div>

      <div class="card">
        <div class="card-hdr">
          <div class="card-title" data-i18n="ov.recentlyFiled"></div>
          <a href="#records" class="btn btn-outline btn-sm" data-i18n="ov.openCabinet"></a>
        </div>
        <div id="recentBox"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-hdr">
          <div class="card-title" data-i18n="ov.comingUp"></div>
          <a href="#calendar" class="btn btn-outline btn-sm" data-i18n="ov.calendarLink"></a>
        </div>
        <div id="upcomingBox"></div>
      </div>

      <div class="card">
        <div class="card-hdr">
          <div class="card-title" data-i18n="ov.lastBloodTest"></div>
          <a href="#labs" class="btn btn-outline btn-sm" data-i18n="ov.allResults"></a>
        </div>
        <div id="lastLabBox"></div>
      </div>
    </div>
  </div>

</div>
</section>

<section class="view" id="view-vitals" hidden>
<div class="container">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="vt.title"></div>
      <div class="page-sub" data-i18n="vt.sub"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-outline" onclick="exportVitalsCSV()">↓ CSV</button>
      <button class="btn btn-gold" onclick="V_vitals.openEntry()" data-i18n="vt.logReading"></button>
    </div>
  </div>

  <div class="today-strip">
    <div>
      <h3 id="todayHeading">Today</h3>
      <p id="todaySummary">Nothing logged yet today.</p>
    </div>
    <button class="btn btn-gold btn-lg" onclick="V_vitals.openEntry(null, true)" data-i18n="vt.logToday"></button>
  </div>

  <div class="stats" id="vitals_statTiles"></div>

  <div class="card">
    <div class="card-hdr">
      <div class="card-title" data-i18n="vt.readings"></div>

        <button class="chip-btn active" data-range="30"  onclick="V_vitals.setRange('30', this)" data-i18n="common.30days"></button>
        <button class="chip-btn" data-range="90"  onclick="V_vitals.setRange('90', this)" data-i18n="common.3months"></button>
        <button class="chip-btn" data-range="365" onclick="V_vitals.setRange('365', this)" data-i18n="common.1year"></button>
        <button class="chip-btn" data-range="all" onclick="V_vitals.setRange('all', this)" data-i18n="common.allTime"></button>

<!-- ── Entry modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="entryModal">
  <div class="modal wide">
    <h2 id="entryTitle">Log a reading</h2>
    <div class="modal-sub" data-i18n="vt.modalSub"></div>

    <input type="hidden" id="f_id">

    <div class="form-row">
      <div class="form-group"><label data-i18n="common.date"></label><input type="date" id="f_date"></div>
      <div class="form-group"><label data-i18n="common.time"></label><input type="time" id="f_time"></div>
    </div>

    <div class="section-lbl" data-i18n="vt.secBody"></div>
    <div class="form-row">
      <div class="form-group">
        <label data-metric="weight"></label>
        <input type="number" step="0.1" inputmode="decimal" id="f_weight" placeholder="e.g. 62.4">
      </div>
      <div class="form-group">
        <label data-metric="glucose"></label>
        <input type="number" step="1" inputmode="numeric" id="f_glucose" placeholder="e.g. 112">
      </div>
    </div>
    <div class="form-group">
      <label data-i18n="vt.sugarWhen"></label>
      <select id="f_glucoseContext"></select>
      <div class="hint" id="glucoseHint"></div>
    </div>

    <div class="section-lbl" data-i18n="vt.secVitals"></div>
    <div class="form-row4">
      <div class="form-group"><label data-metric="systolic"></label><input type="number" inputmode="numeric" id="f_systolic" placeholder="120"></div>
      <div class="form-group"><label data-metric="diastolic"></label><input type="number" inputmode="numeric" id="f_diastolic" placeholder="80"></div>
      <div class="form-group"><label data-metric="pulse"></label><input type="number" inputmode="numeric" id="f_pulse" placeholder="72"></div>
      <div class="form-group"><label data-metric="temp"></label><input type="number" step="0.1" inputmode="decimal" id="f_temp" placeholder="36.6"></div>
    </div>
    <div class="form-group" style="max-width:220px"><label data-metric="spo2"></label><input type="number" inputmode="numeric" id="f_spo2" placeholder="97"></div>

    <div class="section-lbl"><span data-i18n="vt.secFelt"></span> <span style="text-transform:none;letter-spacing:0;font-weight:400" data-i18n="vt.secFeltHint"></span></div>
    <div id="scales"></div>

    <div class="section-lbl" data-i18n="common.notes"></div>
    <div class="form-group">
      <textarea id="f_notes" data-i18n-ph="vt.notesPh"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="V_vitals.deleteEntry()" style="margin-right:auto;display:none" data-i18n="common.delete"></button>
      <button class="btn btn-outline" onclick="closeModal('entryModal')" data-i18n="common.cancel"></button>
      <button class="btn btn-teal" onclick="V_vitals.saveEntry()" data-i18n="vt.saveReading"></button>
    </div>
  </div>
</div>
</section>

<section class="view" id="view-calendar" hidden>
<div class="container wide">

  <div class="page-hdr">
    <div>
      <div class="page-title" data-i18n="cal.title"></div>
      <div class="page-sub" data-i18n="cal.sub"></div>

<script>
/**
 * Care Log — language layer (English / Ελληνικά)
 * Load BEFORE health-base.js on every page.
 *
 * Static markup is translated through `data-i18n` attributes; dynamic strings
 * go through t('key', {vars}). Domain labels (event types, metrics, lab tests)
 * carry their Greek inline in health-base.js and resolve through L().
 *
 * To correct a translation, edit the `el` side of the pair below — nothing else
 * needs to change.
 */

const LANG_KEY = 'carelog_lang';

function getLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'en' || saved === 'el') return saved;
  } catch {}
  /* First run: follow the browser, since the patient is the likelier reader. */
  return (navigator.language || '').toLowerCase().startsWith('el') ? 'el' : 'en';
}

function setLang(lang) {
  try { localStorage.setItem(LANG_KEY, lang === 'el' ? 'el' : 'en'); } catch {}
  /* A reload is the honest way to re-render every chart, table and modal. */
  location.reload();
}

/** Locale tag for date formatting. */
function localeTag() { return getLang() === 'el' ? 'el-GR' : 'en-GB'; }

/** Pick the right side of a { label, el } pair from the domain tables. */
function L(def) {
  if (!def) return '';
  return getLang() === 'el' && def.el ? def.el : (def.label || '');
}

/** Translate a key, with optional {placeholder} interpolation. */
function t(key, vars) {
  const dict = STRINGS[getLang()] || STRINGS.en;
  let s = dict[key];
  if (s === undefined) s = STRINGS.en[key];
  if (s === undefined) s = key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

/** Apply translations to the static markup of the current page. */
function applyI18n(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  scope.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
  scope.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  scope.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
  if (!root) {
    document.documentElement.lang = getLang();
    const titleKey = document.body && document.body.getAttribute('data-i18n-doctitle');
    if (titleKey) document.title = t(titleKey);
  }
}

  read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },

  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      const full = e && (e.name === 'QuotaExceededError' || e.code === 22);
      toast(full ? t('common.storageFull') : t('common.saveError', { msg: e.message }), 'error');
      return false;
    }
  },

  list(key)          { const v = this.read(key, []); return Array.isArray(v) ? v : []; },
  saveList(key, arr) { return this.write(key, arr); },

  /** Insert or update by id; returns the saved record. */
  upsert(key, record) {
    const all = this.list(key);
    const now = new Date().toISOString();
    if (!record.id) {
      record.id = uid();
      record.createdAt = now;
    }
    record.updatedAt = now;
    const i = all.findIndex(r => r.id === record.id);
    if (i >= 0) all[i] = record; else all.push(record);
    this.saveList(key, all);
    return record;
  },

  remove(key, id) {
    this.saveList(key, this.list(key).filter(r => r.id !== id));
  },

  find(key, id) { return this.list(key).find(r => r.id === id) || null; }
};

/* Profile + targets. */

  name: '', dob: '', sex: '', heightCm: '',
  diagnosis: '', stage: '', diagnosedOn: '',
  oncologist: '', hospital: '', phone: '', bloodType: '',
  allergies: '', notes: '',
  targets: { weightLow: '', weightHigh: '', glucoseLow: 70, glucoseHigh: 180 }
};

function getProfile() {
  const p = Store.read(HK.profile, null);
  if (!p) return { ...DEFAULT_PROFILE, targets: { ...DEFAULT_PROFILE.targets } };
  return { ...DEFAULT_PROFILE, ...p, targets: { ...DEFAULT_PROFILE.targets, ...(p.targets || {}) } };
}
function saveProfile(p) { Store.write(HK.profile, p); }

function getMeta()      { return Store.read(HK.meta, { lastBackup: null, created: new Date().toISOString() }); }
function setMeta(patch) { Store.write(HK.meta, { ...getMeta(), ...patch }); }

/* ══ DOCUMENT BLOB STORE (IndexedDB) ════════════════════════════ */
const Files = {
  _db: null,

  async open() {
    if (this._db) return this._db;
    this._db = await new Promise((resolve, reject) => {
      const req = indexedDB.open('carelog_files', 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains('blobs')) req.result.createObjectStore('blobs');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
    return this._db;
  },

  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('blobs', mode);
      const req = fn(tx.objectStore('blobs'));
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  },

  /** Store a File/Blob, returns the generated attachment id. */
  async put(file) {
    const id = uid('file');
    await this._tx('readwrite', s => s.put(file, id));
    return id;
  },
  async get(id)    { return this._tx('readonly',  s => s.get(id)); },
  async del(id)    { return this._tx('readwrite', s => s.delete(id)); },
  async keys()     { return this._tx('readonly',  s => s.getAllKeys()); },

  /** Open an attachment in a new tab. */
  async open_(att) {
    const blob = await this.get(att.id);
    if (!blob) { toast(t('dc.missing'), 'error'); return; }
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  /** Download an attachment to disk. */
  async download(att) {
    const blob = await this.get(att.id);
    if (!blob) { toast(t('dc.missing'), 'error'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = att.name || 'document';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  /** Total bytes held, for the storage readout in Settings. */
  async totalBytes() {
    const ids = await this.keys();
    let total = 0;
    for (const id of ids) {
      const b = await this.get(id);
      if (b && typeof b.size === 'number') total += b.size;
    }
    return total;
  }
};

/* ══ UTILITIES ══════════════════════════════════════════════════ */
function uid(prefix = 'r') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

/** Today as YYYY-MM-DD in the *local* timezone (never toISOString — it shifts). */
function todayISO(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function nowHM() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
/** Parse YYYY-MM-DD into a local-midnight Date. */
function parseISO(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) { const d = new Date(s); return isNaN(d) ? null : d; }
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function addDays(iso, n) {
  const d = parseISO(iso); if (!d) return iso;
  d.setDate(d.getDate() + n);
  return todayISO(d);
}
function daysBetween(a, b) {
  const da = parseISO(a), db = parseISO(b);
  if (!da || !db) return null;
  return Math.round((db - da) / 86400000);
}
/* Numeric DD/MM/YYYY in both languages — unambiguous on a printed report. */
function fmtDate(iso) {
  const d = parseISO(iso);
  return d ? d.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
}
function fmtDateLong(iso) {
  const d = parseISO(iso);
  return d ? d.toLocaleDateString(localeTag(), { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '—';
}
function fmtDateShort(iso) {
  const d = parseISO(iso);
  return d ? d.toLocaleDateString(localeTag(), { day: 'numeric', month: 'short' }) : '—';
}
function fmtMonthYear(date) {
  return date.toLocaleDateString(localeTag(), { month: 'long', year: 'numeric' });
}
/** Short weekday names starting Monday, in the active language. */
function weekdayNames() {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(2024, 0, 1 + i);           // 1 Jan 2024 was a Monday
    out.push(d.toLocaleDateString(localeTag(), { weekday: 'short' }));
  }
  return out;
}
/** "in 3 days" / "5 days ago" / "today". */
function relDays(iso) {
  const n = daysBetween(todayISO(), iso);
  if (n === null) return '';
  if (n === 0)  return t('common.today');
  if (n === 1)  return t('common.tomorrow');
  if (n === -1) return t('common.yesterday');
  return n > 0 ? t('common.inDays', { n }) : t('common.daysAgo', { n: -n });
}
function fmtNum(v, dec = 1) {
  const n = parseFloat(v);
  return isNaN(n) ? '—' : n.toFixed(dec);
}
function fmtBytes(b) {
  if (!b) return '0 KB';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/** Numeric input → number, or null when blank. Never coerces '' to 0. */
function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

/** Classify a value against a reference range → status token. */
function rangeStatus(value, low, high) {
  const v = num(value);
  if (v === null) return null;
  const lo = num(low), hi = num(high);
  if (lo === null && hi === null) return null;
  if (hi !== null && v > hi) {
    const over = lo !== null && hi > lo ? (v - hi) / (hi - lo) : (v - hi) / (hi || 1);
    return over > 0.5 ? 'critical' : 'warning';
  }
  if (lo !== null && v < lo) {
    const under = hi !== null && hi > lo ? (lo - v) / (hi - lo) : (lo - v) / (lo || 1);
    return under > 0.5 ? 'critical' : 'warning';
  }
  return 'good';
}
const STATUS_ICON = { good: '✓', warning: '▲', serious: '▲', critical: '●' };
function statusBadge(status, text) {
  if (!status) return '';
  return `<span class="badge badge-${status}">${STATUS_ICON[status] || ''} ${esc(text)}</span>`;
}

/* ══ TOAST & CONFIRM ════════════════════════════════════════════ */
function toast(msg, type = 'success') {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;right:20px;padding:11px 20px;border-radius:10px;' +
      'font-size:13px;font-weight:500;z-index:3000;pointer-events:none;transition:all .3s;opacity:0;' +
      'transform:translateY(10px);font-family:DM Sans,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.22);max-width:min(92vw,420px)';
    document.body.appendChild(t);
  }
  const colors = { success: ['#0f4a42', '#e8c97a'], error: ['#d03b3b', '#fff'], warning: ['#8a5d00', '#fff'], info: ['#1a5a8a', '#fff'] };
  const [bg, fg] = colors[type] || colors.info;
  t.style.background = bg; t.style.color = fg; t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateY(0)';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; }, 3000);
}

let _confirmCb = null;
function confirmAction(title, msg, btnLabel, cb, danger = true) {
  let m = document.getElementById('_confirm');
  if (!m) {
    m = document.createElement('div');
    m.id = '_confirm';
    m.className = 'modal-overlay';
    m.innerHTML =
      '<div class="modal" style="max-width:410px">' +
        '<h2 id="_cf-title"></h2>' +
        '<p id="_cf-msg" style="font-size:13px;color:var(--text-muted);line-height:1.55;margin:8px 0 4px"></p>' +
        '<div class="modal-footer">' +
          '<button class="btn btn-outline" id="_cf-cancel"></button>' +
          '<button class="btn" id="_cf-ok"></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(m);
    m.querySelector('#_cf-cancel').textContent = t('common.cancel');
    m.querySelector('#_cf-cancel').onclick = () => m.classList.remove('open');
    m.querySelector('#_cf-ok').onclick = () => { m.classList.remove('open'); if (_confirmCb) _confirmCb(); };
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
  }
  m.querySelector('#_cf-title').textContent = title;
  m.querySelector('#_cf-msg').textContent = msg;
  const ok = m.querySelector('#_cf-ok');
  ok.textContent = btnLabel;
  ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-teal');
  _confirmCb = cb;
  m.classList.add('open');
}

function openModal(id)  { const el = document.getElementById(id); if (el) el.classList.add('open'); }
function closeModal(id) { const el = document.getElementById(id); if (el) el.classList.remove('open'); }

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('modal-overlay')) e.target.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});

/* ══ CHARTS ═════════════════════════════════════════════════════
 * Dependency-free SVG. Thin marks, hairline grid, one y-axis (never two),
 * crosshair + tooltip on hover, the last point of each series direct-labelled,
 * and a table view under every chart so no value is reachable by colour alone.
 * ═════════════════════════════════════════════════════════════ */

const SERIES_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100'];
const CHART_INK   = { grid: '#e8eeed', axis: '#c3c2b7', muted: '#898781', text: '#52514e' };

/** Round a numeric domain out to human-readable tick stops. */
function niceScale(min, max, target = 5) {
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (min === max) { const pad = Math.abs(min || 1) * 0.1; min -= pad; max += pad; }
  const rawStep = (max - min) / target;
  const mag  = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-9; v += step) ticks.push(+v.toPrecision(12));
  return { ticks, min: lo, max: hi };
}

/**
 * Draw a time-series line chart into `el`.
 * opts.series: [{ key, label, color, points:[{x:'YYYY-MM-DD', y:Number, note}] }]
 * opts.band:   { low, high, label }  — a reference/target range drawn behind the lines
 * opts.markers:[{ x, label, icon, color }] — treatment dates, ticked on the x-axis
 */
function renderLineChart(el, opts) {
  if (!el) return;
  el._chartOpts = opts;

  const series = (opts.series || [])
    .map((s, i) => ({
      ...s,
      color: s.color || SERIES_COLORS[i % SERIES_COLORS.length],
      points: (s.points || []).filter(p => p && p.x && num(p.y) !== null)
        .map(p => ({ ...p, y: num(p.y), t: parseISO(p.x).getTime() }))
        .sort((a, b) => a.t - b.t)
    }))
    .filter(s => s.points.length);

  const dec  = opts.dec == null ? 1 : opts.dec;
  const unit = opts.unit || '';

  if (!series.length) {
    el.innerHTML = `<div class="empty" style="padding:34px 16px">
      <div class="empty-icon">📉</div>${esc(opts.emptyMsg || t('common.noReadings'))}</div>`;
    return;
  }

  /* ── Geometry ── */
  const W = Math.max(el.clientWidth || el.parentElement.clientWidth || 640, 280);
  const H = opts.height || 250;
  const M = { top: 14, right: 60, bottom: 34, left: 46 };
  const pw = W - M.left - M.right;
  const ph = H - M.top - M.bottom;

  /* ── Scales (one y-axis, always) ── */
  const allT = series.flatMap(s => s.points.map(p => p.t));
  let t0 = Math.min(...allT), t1 = Math.max(...allT);
  if (t0 === t1) { t0 -= 86400000; t1 += 86400000; }

  const allY = series.flatMap(s => s.points.map(p => p.y));
  let yLo = Math.min(...allY), yHi = Math.max(...allY);
  const band = opts.band && (num(opts.band.low) !== null || num(opts.band.high) !== null) ? opts.band : null;
  if (band) {
    if (num(band.low)  !== null) yLo = Math.min(yLo, num(band.low));
    if (num(band.high) !== null) yHi = Math.max(yHi, num(band.high));
  }
  /* yMin/yMax are hard bounds, not hints: a 0–10 symptom score must never
     grow an axis that runs from -3 to 13 just because of the padding. */
  const hardMin = opts.yMin, hardMax = opts.yMax;
  let scale;
  if (hardMin !== undefined && hardMax !== undefined) {
    scale = niceScale(hardMin, hardMax, 5);
    scale.min = hardMin; scale.max = hardMax;
    scale.ticks = scale.ticks.filter(t => t >= hardMin && t <= hardMax);
  } else {
    const pad = (yHi - yLo) * 0.12 || Math.abs(yHi * 0.1) || 1;
    let lo = yLo - pad, hi = yHi + pad;
    if (hardMin !== undefined) lo = Math.max(lo, hardMin);
    if (hardMax !== undefined) hi = Math.min(hi, hardMax);
    scale = niceScale(lo, hi, 5);
    if (hardMin !== undefined && scale.min < hardMin) { scale.min = hardMin; scale.ticks = scale.ticks.filter(t => t >= hardMin); }
    if (hardMax !== undefined && scale.max > hardMax) { scale.max = hardMax; scale.ticks = scale.ticks.filter(t => t <= hardMax); }
  }

  const X = t => M.left + ((t - t0) / (t1 - t0)) * pw;
  const Y = v => M.top + ph - ((v - scale.min) / (scale.max - scale.min)) * ph;

  /* ── Build SVG ── */
  const svg = [];
  svg.push(`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || 'chart')}">`);

  /* Reference band — behind everything, tinted so it recedes */
  if (band) {
    const bTop = Y(num(band.high) !== null ? num(band.high) : scale.max);
    const bBot = Y(num(band.low)  !== null ? num(band.low)  : scale.min);
    svg.push(`<rect x="${M.left}" y="${bTop.toFixed(1)}" width="${pw}" height="${Math.max(bBot - bTop, 0).toFixed(1)}" fill="#1baf7a" opacity="0.07"/>`);
    if (band.label) {
      svg.push(`<text x="${M.left + pw - 4}" y="${(bTop + 12).toFixed(1)}" text-anchor="end" font-size="10" fill="${CHART_INK.muted}">${esc(band.label)}</text>`);
    }
  }

  /* Horizontal grid — solid hairlines, one shade off the surface */
  scale.ticks.forEach(v => {
    const y = Y(v);
    if (y < M.top - 1 || y > M.top + ph + 1) return;
    svg.push(`<line x1="${M.left}" y1="${y.toFixed(1)}" x2="${M.left + pw}" y2="${y.toFixed(1)}" stroke="${CHART_INK.grid}" stroke-width="1"/>`);
    svg.push(`<text x="${M.left - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${CHART_INK.muted}" style="font-variant-numeric:tabular-nums">${fmtNum(v, v % 1 === 0 ? 0 : dec)}</text>`);
  });

  /* Baseline */
  svg.push(`<line x1="${M.left}" y1="${M.top + ph}" x2="${M.left + pw}" y2="${M.top + ph}" stroke="${CHART_INK.axis}" stroke-width="1"/>`);

  /* X ticks — evenly spaced dates across the domain */
  const nTicks = Math.max(2, Math.min(6, Math.floor(pw / 90)));
  for (let i = 0; i <= nTicks; i++) {
    const t = t0 + ((t1 - t0) * i) / nTicks;
    const x = X(t);
    const anchor = i === 0 ? 'start' : i === nTicks ? 'end' : 'middle';
    svg.push(`<text x="${x.toFixed(1)}" y="${M.top + ph + 16}" text-anchor="${anchor}" font-size="10" fill="${CHART_INK.muted}">${esc(fmtDateShort(todayISO(new Date(t))))}</text>`);
  }

  /* Event markers — a tick on the axis plus its icon; label lives in the tooltip */
  (opts.markers || []).forEach(mk => {
    const t = parseISO(mk.x); if (!t) return;
    const ms = t.getTime();
    if (ms < t0 || ms > t1) return;
    const x = X(ms);
    svg.push(`<line x1="${x.toFixed(1)}" y1="${M.top + ph}" x2="${x.toFixed(1)}" y2="${M.top + ph + 6}" stroke="${mk.color || CHART_INK.axis}" stroke-width="2"/>`);
    if (mk.icon) svg.push(`<text x="${x.toFixed(1)}" y="${M.top + ph - 3}" text-anchor="middle" font-size="10">${esc(mk.icon)}</text>`);
  });

  /* Series lines */
  series.forEach(s => {
    const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    svg.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
  });

  /* Dots — 2px surface ring keeps overlapping marks readable. Hidden when dense. */
  const dense = series.reduce((n, s) => n + s.points.length, 0) > 70;
  if (!dense) {
    series.forEach(s => s.points.forEach(p => {
      svg.push(`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="2"/>`);
    }));
  }

  /* Direct label on the last point of each series (never a label on every
     point). Labels are nudged apart vertically so four close series don't
     stack their numbers on top of each other. */
  const labels = series.map(s => {
    const p = s.points[s.points.length - 1];
    return { x: X(p.t) + 8, y: Y(p.y), text: fmtNum(p.y, dec) + (unit ? ' ' + unit : '') };
  }).sort((a, b) => a.y - b.y);
  const GAP = 13;
  for (let i = 1; i < labels.length; i++) {
    if (labels[i].y - labels[i - 1].y < GAP) labels[i].y = labels[i - 1].y + GAP;
  }
  const overflow = labels.length ? labels[labels.length - 1].y - (M.top + ph) : 0;
  if (overflow > 0) labels.forEach(l => { l.y -= overflow; });
  labels.forEach(l => {
    svg.push(`<text x="${l.x.toFixed(1)}" y="${(Math.max(l.y, M.top + 4) + 3.5).toFixed(1)}" font-size="11" font-weight="600" fill="${CHART_INK.text}" style="font-variant-numeric:tabular-nums">${esc(l.text)}</text>`);
  });

  /* Hover layer: crosshair, highlight rings, and the interaction target */
  svg.push(`<g class="ch-hover" style="display:none">
    <line class="ch-cross" y1="${M.top}" y2="${M.top + ph}" stroke="${CHART_INK.axis}" stroke-width="1"/>
    ${series.map(s => `<circle class="ch-hi" r="5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join('')}
  </g>`);
  svg.push(`<rect class="ch-catch" x="${M.left}" y="${M.top}" width="${pw}" height="${ph}" fill="transparent" style="cursor:crosshair"/>`);
  svg.push('</svg>');

  /* ── Legend (always present for 2+ series; a single series is named by the title) ── */
  const legend = series.length > 1
    ? `<div class="chart-legend">${series.map(s =>
        `<span class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${esc(s.label)}</span>`).join('')}</div>`
    : '';

  /* ── Table view — the relief for low-contrast hues and for screen readers ── */
  const xs = [...new Set(series.flatMap(s => s.points.map(p => p.x)))].sort();
  const tableRows = xs.map(x => {
    const cells = series.map(s => {
      const p = s.points.find(pt => pt.x === x);
      return `<td class="num">${p ? fmtNum(p.y, dec) : '—'}</td>`;
    }).join('');
    return `<tr><td>${esc(fmtDate(x))}</td>${cells}</tr>`;
  }).join('');
  const table = `<details class="chart-table no-print"><summary style="cursor:pointer;font-size:11.5px;color:var(--text-muted);padding:4px 0">${esc(t('common.showNumbers', { n: xs.length }))}</summary>
    <div class="table-wrap" style="max-height:260px;overflow-y:auto;margin-top:6px"><table class="data">
    <thead><tr><th>Date</th>${series.map(s => `<th class="num">${esc(s.label)}${unit ? ' (' + esc(unit) + ')' : ''}</th>`).join('')}</tr></thead>
    <tbody>${tableRows}</tbody></table></div></details>`;

  el.innerHTML = legend +
    `<div class="chart-body">${svg.join('')}<div class="chart-tip"></div></div>` +
    `<div class="chart-foot">${table}</div>`;

  /* ── Interaction ── */
  const body  = el.querySelector('.chart-body');
  const svgEl = body.querySelector('svg');
  const tip   = body.querySelector('.chart-tip');
  const hover = svgEl.querySelector('.ch-hover');
  const cross = svgEl.querySelector('.ch-cross');
  const rings = [...svgEl.querySelectorAll('.ch-hi')];
  const catcher = svgEl.querySelector('.ch-catch');

  const markerAt = {};
  (opts.markers || []).forEach(mk => { (markerAt[mk.x] = markerAt[mk.x] || []).push(mk); });

  function showAt(clientX) {
    const rect = svgEl.getBoundingClientRect();
    const sx = (clientX - rect.left) * (W / rect.width);
    const t  = t0 + ((sx - M.left) / pw) * (t1 - t0);

    /* Nearest shared x position */
    let best = null, bestD = Infinity;
    xs.forEach(x => {
      const d = Math.abs(parseISO(x).getTime() - t);
      if (d < bestD) { bestD = d; best = x; }
    });
    if (!best) return;

    const bt = parseISO(best).getTime();
    const px = X(bt);
    hover.style.display = '';
    cross.setAttribute('x1', px.toFixed(1));
    cross.setAttribute('x2', px.toFixed(1));

    const rows = [];
    series.forEach((s, i) => {
      const p = s.points.find(pt => pt.x === best);
      const ring = rings[i];
      if (p) {
        ring.setAttribute('cx', px.toFixed(1));
        ring.setAttribute('cy', Y(p.y).toFixed(1));
        ring.style.display = '';
        rows.push(`<div class="tip-row"><span class="tip-dot" style="background:${s.color}"></span>${esc(s.label)}<span class="tip-val">${fmtNum(p.y, dec)}${unit ? ' ' + esc(unit) : ''}</span></div>`);
      } else {
        ring.style.display = 'none';
      }
    });
    (markerAt[best] || []).forEach(mk => {
      rows.push(`<div class="tip-row" style="opacity:.85">${esc(mk.icon || '•')} ${esc(mk.label)}</div>`);
    });

    tip.innerHTML = `<div class="tip-date">${esc(fmtDateLong(best))}</div>${rows.join('')}`;
    tip.classList.add('on');
    const bw = body.clientWidth, tw = tip.offsetWidth;
    const left = Math.min(Math.max(px * (body.clientWidth / W) - tw / 2, 2), Math.max(bw - tw - 2, 2));
    tip.style.left = left + 'px';
    tip.style.top  = '4px';
  }

  function hide() { hover.style.display = 'none'; tip.classList.remove('on'); }

  catcher.addEventListener('mousemove', e => showAt(e.clientX));
  catcher.addEventListener('mouseleave', hide);
  catcher.addEventListener('touchstart', e => { if (e.touches[0]) showAt(e.touches[0].clientX); }, { passive: true });
  catcher.addEventListener('touchmove',  e => { if (e.touches[0]) showAt(e.touches[0].clientX); }, { passive: true });
  catcher.addEventListener('touchend', hide);
}

/** Tiny inline trend line for stat tiles — no axes, no interaction. */
function renderSparkline(el, values, color = SERIES_COLORS[0], height = 30) {
  if (!el) return;
  const vals = (values || []).map(num).filter(v => v !== null);
  if (vals.length < 2) { el.innerHTML = ''; return; }
  const W = Math.max(el.clientWidth || 120, 40), H = height, p = 3;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const X = i => p + (i / (vals.length - 1)) * (W - p * 2);
  const Y = v => H - p - ((v - lo) / span) * (H - p * 2);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lastX = X(vals.length - 1), lastY = Y(vals[vals.length - 1]);
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
}

window.addEventListener('resize', () => {

/* ══ QUERIES ════════════════════════════════════════════════════ */

/** All daily readings, oldest first. */
function getVitals()  { return Store.list(HK.vitals).slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))); }
/** All calendar events, oldest first. */
function getEvents()  { return Store.list(HK.events).slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))); }
/** Filed documents, newest first. */
function getRecords() { return Store.list(HK.records).slice().sort((a, b) => b.date.localeCompare(a.date)); }
/** Lab result sets, newest first. */
function getLabs()    { return Store.list(HK.labs).slice().sort((a, b) => b.date.localeCompare(a.date)); }
function getMeds()    { return Store.list(HK.meds); }

function inRange(iso, from, to) {
  if (from && iso < from) return false;
  if (to   && iso > to)   return false;
  return true;
}

/** Chart-ready points for one daily metric. */
function vitalSeries(metric, from, to) {
  return getVitals()
    .filter(v => num(v[metric]) !== null && inRange(v.date, from, to))
    .map(v => ({ x: v.date, y: num(v[metric]), note: v.notes }));
}

/** Blood sugar split by reading context, so fasting and post-meal never mix. */
function glucoseSeriesByContext(from, to) {
  const buckets = {};
  getVitals().forEach(v => {
    if (num(v.glucose) === null || !inRange(v.date, from, to)) return;
    const ctx = v.glucoseContext || 'random';
    (buckets[ctx] = buckets[ctx] || []).push({ x: v.date, y: num(v.glucose) });
  });
  return buckets;
}

/** The most recent non-empty reading of a metric. */
function latestVital(metric) {
  const all = getVitals().filter(v => num(v[metric]) !== null);
  return all.length ? all[all.length - 1] : null;
}

/** Change between the last reading and the one closest to `days` ago. */
function metricDelta(metric, days = 30) {
  const all = getVitals().filter(v => num(v[metric]) !== null);
  if (all.length < 2) return null;
  const last = all[all.length - 1];
  const cutoff = addDays(last.date, -days);
  const prior = all.slice(0, -1).filter(v => v.date >= cutoff);
  const ref = (prior.length ? prior[0] : all[0]);
  if (ref.id === last.id) return null;
  return { from: num(ref[metric]), to: num(last[metric]), diff: num(last[metric]) - num(ref[metric]), fromDate: ref.date, toDate: last.date };
}

/** Chart-ready points for one lab analyte across every filed result set. */
function labSeries(testKey, from, to) {
  const pts = [];
  getLabs().forEach(l => {
    if (!inRange(l.date, from, to)) return;
    const hit = (l.values || []).find(v => v.key === testKey);
    if (hit && num(hit.value) !== null) pts.push({ x: l.date, y: num(hit.value), low: hit.low, high: hit.high });
  });
  return pts.sort((a, b) => a.x.localeCompare(b.x));
}

/** Every analyte that has at least `min` recorded results. */
function labTestsWithData(min = 1) {
  const counts = {};
  getLabs().forEach(l => (l.values || []).forEach(v => {
    if (num(v.value) !== null) counts[v.key] = (counts[v.key] || 0) + 1;
  }));
  return Object.keys(counts).filter(k => counts[k] >= min)
    .sort((a, b) => (LAB_TESTS[a]?.label || a).localeCompare(LAB_TESTS[b]?.label || b));
}

/** Events on or after today, soonest first. */
function upcomingEvents(limit = 0) {
  const today = todayISO();
  const list = getEvents().filter(e => e.date >= today && e.status !== 'cancelled');
  return limit ? list.slice(0, limit) : list;
}
/** Events before today, most recent first. */
function pastEvents(limit = 0) {
  const today = todayISO();
  const list = getEvents().filter(e => e.date < today).reverse();
  return limit ? list.slice(0, limit) : list;
}
/** Treatment markers (chemo, radio, surgery…) for overlaying on charts. */
function treatmentMarkers(from, to) {
  return getEvents()
    .filter(e => ['chemo', 'radio', 'immuno', 'surgery'].includes(e.type) && inRange(e.date, from, to) && e.status !== 'cancelled')
    .map(e => ({ x: e.date, label: e.title || eventLabel(e.type), icon: eventIcon(e.type), color: eventColor(e.type) }));
}

/** Documents and lab sets attached to one event. */
function eventAttachments(eventId) {
  return {
    records: getRecords().filter(r => r.eventId === eventId),
    labs:    getLabs().filter(l => l.eventId === eventId)
  };
}

/** Preset date windows used by the filter rows. */
const RANGES = {
  '30':  { label: '30 days',  days: 30  },
  '90':  { label: '3 months', days: 90  },
  '180': { label: '6 months', days: 180 },
  '365': { label: '1 year',   days: 365 },
  'all': { label: 'All time',  days: null }
};
function rangeFrom(key) {
  const r = RANGES[key];
  return r && r.days ? addDays(todayISO(), -r.days) : '';
}

/* ══ BACKUP ═════════════════════════════════════════════════════ */

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload  = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

/** Write the whole archive — records and scanned documents — to one .json file. */
async function exportBackup(includeFiles = true) {
  const payload = {
    app: 'carelog', version: 1, exportedAt: new Date().toISOString(),
    profile: getProfile(),
    vitals:  Store.list(HK.vitals),
    events:  Store.list(HK.events),
    records: Store.list(HK.records),
    labs:    Store.list(HK.labs),
    meds:    Store.list(HK.meds),
    files:   []
  };

  if (includeFiles) {
    const wanted = new Map();
    payload.records.forEach(r => (r.attachments || []).forEach(a => wanted.set(a.id, a)));
    for (const [id, att] of wanted) {
      const blob = await Files.get(id);
      if (!blob) continue;
      payload.files.push({ id, name: att.name, type: att.type || blob.type, data: await blobToDataURL(blob) });
    }
  }

  const json = JSON.stringify(payload);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const who = (payload.profile.name || 'patient').replace(/[^\w\-]+/g, '-').toLowerCase();
  a.href = url;
  a.download = `carelog-${who}-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  setMeta({ lastBackup: new Date().toISOString() });
  return { records: payload.records.length, files: payload.files.length, bytes: json.length };
}

/**
 * Restore an archive.
 * mode 'replace' wipes what is here first; 'merge' keeps both, skipping ids
 * that already exist so re-importing the same file is harmless.
 */
async function importBackup(file, mode = 'merge') {
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(t('st.notJson')); }
  if (!data || data.app !== 'carelog') throw new Error(t('st.notCarelog'));

  const lists = [
    [HK.vitals,  data.vitals],
    [HK.events,  data.events],
    [HK.records, data.records],
    [HK.labs,    data.labs],
    [HK.meds,    data.meds]
  ];

  let added = 0;
  for (const [key, incoming] of lists) {
    const rows = Array.isArray(incoming) ? incoming : [];
    if (mode === 'replace') {
      Store.saveList(key, rows);
      added += rows.length;
    } else {
      const existing = Store.list(key);
      const seen = new Set(existing.map(r => r.id));
      rows.forEach(r => { if (r && r.id && !seen.has(r.id)) { existing.push(r); seen.add(r.id); added++; } });
      Store.saveList(key, existing);
    }
  }

  if (data.profile && (mode === 'replace' || !getProfile().name)) saveProfile(data.profile);

  let filesIn = 0;
  for (const f of (data.files || [])) {
    try {
      const blob = await (await fetch(f.data)).blob();
      await Files._tx('readwrite', s => s.put(blob, f.id));
      filesIn++;
    } catch { /* one unreadable attachment must not abort the restore */ }
  }

  return { records: added, files: filesIn };
}

/** Spreadsheet-friendly export of the daily readings. */
function exportVitalsCSV() {
  const cols = ['date', 'time', ...Object.keys(METRICS), 'glucoseContext', 'notes'];

    return /[",\n]/.test(String(val)) ? '"' + String(val).replace(/"/g, '""') + '"' : String(val);
  }).join(','));

/** Spreadsheet-friendly export of every lab value, one row per analyte. */
function exportLabsCSV() {
  const head = [t('common.date'), t('lb.otherTests'), t('lb.colTest'), t('lb.colValue'), t('lb.colUnit'),
                t('lb.colRefLow'), t('lb.colRefHigh'), t('common.status'), t('lb.labName'), t('common.notes')];

               v.low ?? '', v.high ?? '', st === 'good' ? t('rp.inRange') : st ? t('lb.outOfRangeN', { n: 1 }) : '',
               l.source || '', (l.notes || '').replace(/\n/g, ' ')]
      .map(c => /[",\n]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : String(c)).join(','));
  }));
