function downloadText(text, filename, mime = 'text/plain') {
  const blob = new Blob(['﻿' + text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/**
 * A record id passed in the URL hash, if any. Generated ids look like
 * "l_abc123_xy9"; view names in the single-file build look like "labs", so the
 * underscore is what tells them apart.
 */
function deepLinkId() {
  const h = (location.hash || '').replace(/^#/, '');
  return /^[a-z]+_[a-z0-9]/i.test(h) ? h : '';
}

/** Days since the last backup, or null if there has never been one. */
function daysSinceBackup() {
  const m = getMeta();
  if (!m.lastBackup) return null;
  return Math.floor((Date.now() - new Date(m.lastBackup).getTime()) / 86400000);
}

/* ══ CALENDAR EXPORT (.ics) ═════════════════════════════════════
 * Care Log cannot notify anyone while it is closed — a browser simply can't.
 * So reminders are delegated: appointments are written to a standard iCalendar
 * file that Google, Apple and Outlook all import, alarms included.
 * ═════════════════════════════════════════════════════════════ */

/** Escape a value for an iCalendar property. */
function icsEscape(v) {
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');
}

/** Fold a content line to 75 octets, per RFC 5545. */
function icsFold(line) {
  const bytes = new TextEncoder().encode(line);
  if (bytes.length <= 75) return line;
  const out = [];
  let cur = '';
  for (const ch of line) {                       // iterate by code point
    const next = cur + ch;
    if (new TextEncoder().encode(next).length > (out.length ? 74 : 75)) { out.push(cur); cur = ch; }
    else cur = next;
  }
  if (cur) out.push(cur);
  return out.join('\r\n ');
}

function icsStampUTC(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + 'T' +
         p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + 'Z';
}
function icsDate(iso)         { return iso.replace(/-/g, ''); }
function icsDateTime(iso, hm) { return icsDate(iso) + 'T' + hm.replace(':', '') + '00'; }

/** Minutes-before → an iCalendar duration such as -P1DT2H. */
function icsTrigger(minutes) {
  const m = Math.max(0, Math.round(minutes));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  let s = '-P';
  if (d) s += d + 'D';
  if (h || mm || !d) {
    s += 'T';
    if (h) s += h + 'H';
    if (mm || !h) s += mm + 'M';
  }
  return s;
}

/** One VEVENT for a Care Log event. Times are floating (local wherever opened). */
function icsEvent(e) {
  const lines = [];
  const startHM = e.time || '';
  const dur = num(e.durationMin) || 60;

  lines.push('BEGIN:VEVENT');
  lines.push('UID:' + e.id + '@carelog');
  lines.push('DTSTAMP:' + icsStampUTC());
  /* Bump SEQUENCE on every edit so a re-import replaces rather than duplicates. */
  const EPOCH_2020 = 1577836800000;
  lines.push('SEQUENCE:' + Math.max(0, Math.floor(
    (new Date(e.updatedAt || e.createdAt || Date.now()).getTime() - EPOCH_2020) / 1000)));

  if (startHM) {
    const [h, m] = startHM.split(':').map(Number);
    const end = new Date(2000, 0, 1, h, m + dur);
    const p = n => String(n).padStart(2, '0');
    lines.push('DTSTART:' + icsDateTime(e.date, startHM));
    lines.push('DTEND:'   + icsDateTime(e.date, p(end.getHours()) + ':' + p(end.getMinutes())));
  } else {
    lines.push('DTSTART;VALUE=DATE:' + icsDate(e.date));
    lines.push('DTEND;VALUE=DATE:'   + icsDate(addDays(e.date, 1)));
  }

  const title = e.title || eventLabel(e.type);
  lines.push('SUMMARY:' + icsEscape(eventIcon(e.type) + ' ' + title));

  const desc = [
    eventLabel(e.type),
    e.doctor ? t('cal.doctorDept') + ': ' + e.doctor : '',
    e.cycle  ? t('cal.cycle', { n: e.cycle }) : '',
    e.notes || ''
  ].filter(Boolean).join('\n');
  if (desc) lines.push('DESCRIPTION:' + icsEscape(desc));
  if (e.place) lines.push('LOCATION:' + icsEscape(e.place));
  if (e.status === 'cancelled') lines.push('STATUS:CANCELLED');

  /* An event saved before reminders existed still deserves one: default to a
     day's notice, and treat an explicit 0 as "the user asked for none". */
  const remind = (e.remind === undefined || e.remind === null || e.remind === '')
    ? 1440 : (num(e.remind) ?? 0);
  if (remind > 0) {
    lines.push('BEGIN:VALARM');
    lines.push('ACTION:DISPLAY');
    lines.push('TRIGGER:' + icsTrigger(remind));
    lines.push('DESCRIPTION:' + icsEscape(title));
    lines.push('END:VALARM');
  }

  lines.push('END:VEVENT');
  return lines;
}

/** Wrap VEVENT blocks into a complete calendar document. */
function icsWrap(bodyLines) {
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Care Log//Care Log//EN',
          'CALSCALE:GREGORIAN', 'METHOD:PUBLISH']
    .concat(bodyLines, ['END:VCALENDAR'])
    .map(icsFold).join('\r\n') + '\r\n';
}

function downloadICS(text, filename) {
  const blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/** Export one event to the phone's calendar. */
function exportEventICS(event) {
  if (!event) return;
  downloadICS(icsWrap(icsEvent(event)), `carelog-${event.date}.ics`);
  toast(t('rm.exportedOne'));
}

/** Export every appointment from today onwards. */
function exportUpcomingICS() {
  const list = upcomingEvents().filter(e => e.status !== 'cancelled');
  if (!list.length) { toast(t('rm.nothingUpcoming'), 'warning'); return; }
  const body = list.flatMap(icsEvent);
  downloadICS(icsWrap(body), `carelog-appointments-${todayISO()}.ics`);
  toast(t('rm.exported', { n: list.length }));
}

/**
 * A repeating daily nudge to record readings. Written as its own event so the
 * calendar app owns the notification — Care Log never needs to be open.
 */
function exportDailyReminderICS(hm) {
  const time = /^\d{2}:\d{2}$/.test(hm || '') ? hm : '09:00';
  const start = todayISO();
  const lines = [
    'BEGIN:VEVENT',
    'UID:carelog-daily-' + time.replace(':', '') + '@carelog',
    'DTSTAMP:' + icsStampUTC(),
    'DTSTART:' + icsDateTime(start, time),
    'DTEND:'   + icsDateTime(start, time),
    'RRULE:FREQ=DAILY',
    'SUMMARY:' + icsEscape('◔ ' + t('rm.dailySummary')),
    'DESCRIPTION:' + icsEscape(t('rm.dailyDesc')),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-PT0M',
    'DESCRIPTION:' + icsEscape(t('rm.dailySummary')), 'END:VALARM',
    'END:VEVENT'
  ];
  downloadICS(icsWrap(lines), 'carelog-daily-reminder.ics');
  toast(t('rm.dailyCreated'));
}

  function renderHero() {
    const next = upcomingEvents(1)[0];
    const dxDays = P.diagnosedOn ? daysBetween(P.diagnosedOn, todayISO()) : null;
  
    const heroNext = next ? `
      <div class="hero-next">
        <div>
          <div class="hero-next-lbl">${esc(t('ov.nextAppt'))}</div>
          <div class="hero-next-title">${eventIcon(next.type)} ${esc(next.title || eventLabel(next.type))}</div>
          <div class="hero-next-when">${esc(fmtDateLong(next.date))}${next.time ? ' · ' + esc(next.time) : ''}${next.place ? ' · ' + esc(next.place) : ''}${next.doctor ? ' · ' + esc(next.doctor) : ''}</div>
        </div>
        <div class="hero-countdown">
          <div class="n">${Math.max(daysBetween(todayISO(), next.date), 0)}</div>
          <div class="u">${esc(t(daysBetween(todayISO(), next.date) === 1 ? 'ov.dayAway' : 'ov.daysAway'))}</div>
        </div>
      </div>` : `
      <div class="hero-next">
        <div>
          <div class="hero-next-lbl">${esc(t('ov.nextAppt'))}</div>
          <div class="hero-next-when" style="margin-top:6px">${esc(t('ov.nothingScheduled'))}</div>
        </div>
        <a href="#calendar" class="btn btn-gold">${esc(t('ov.addOne'))}</a>
      </div>`;
  
    document.getElementById('heroBox').innerHTML = `<div class="hero">
      <div class="hero-name">${esc(P.name || 'Care Log')}</div>
      <div class="hero-dx">${esc([P.diagnosis, P.stage].filter(Boolean).join(' · ') || t('ov.noDiagnosis'))}${
        dxDays !== null ? ' · ' + esc(t('ov.daySince', { n: dxDays })) : ''}</div>
      ${heroNext}
    </div>`;
  }
  
  /* ── Stat tiles ────────────────────────────────────────────── */
  function renderStats() {
    const tiles = [];
  
    const w = latestVital('weight');
    if (w) {
      const d = metricDelta('weight', 30);
      tiles.push(`<div class="stat blue">
        <div class="stat-val">${fmtNum(w.weight, 1)}<span class="unit">kg</span></div>
        <div class="stat-lbl">${esc(t('ov.statWeight', { date: fmtDateShort(w.date) }))}</div>
        <div class="stat-delta flat">${esc(d ? t('ov.kgIn30', { arrow: d.diff > 0 ? '↑' : d.diff < 0 ? '↓' : '→', n: fmtNum(Math.abs(d.diff), 1) }) : t('ov.firstReading'))}</div>
      </div>`);
    }
  
    const g = latestVital('glucose');
    if (g) {
      const c = GLUCOSE_CONTEXTS[g.glucoseContext] || GLUCOSE_CONTEXTS.random;
      const st = rangeStatus(g.glucose, c.low, c.high);
      tiles.push(`<div class="stat ${st === 'good' ? 'good' : 'warning'}">
        <div class="stat-val">${fmtNum(g.glucose, 0)}<span class="unit">mg/dL</span></div>
        <div class="stat-lbl">${esc(t('ov.statSugar', { ctx: L(c) }))}</div>
        <div style="margin-top:6px">${statusBadge(st, t(st === 'good' ? 'ov.inTarget' : 'ov.outsideTarget'))}</div>
      </div>`);
    }
  
    /* How many analytes on the newest report fell outside their range. */
    const lastLab = getLabs()[0];
    if (lastLab) {
      const out = (lastLab.values || []).filter(v => {
        const s = rangeStatus(v.value, v.low, v.high);
        return s && s !== 'good';
      }).length;
      tiles.push(`<div class="stat ${out ? 'warning' : 'good'}">
        <div class="stat-val">${out}</div>
        <div class="stat-lbl">${esc(t('ov.statOutOfRange', { date: fmtDateShort(lastLab.date) }))}</div>
        <div class="stat-delta flat">${esc(t('ov.statOfTests', { n: (lastLab.values || []).length }))}</div>
      </div>`);
    }
  
    const soon = upcomingEvents().filter(e => daysBetween(todayISO(), e.date) <= 30).length;
    tiles.push(`<div class="stat aqua">
      <div class="stat-val">${soon}</div>
      <div class="stat-lbl">${esc(t('ov.statAppts'))}</div>
      <div class="stat-delta flat">${esc(t('ov.statApptsSub', { n: getEvents().length }))}</div>
    </div>`);
  
    tiles.push(`<div class="stat">
      <div class="stat-val">${getRecords().length}</div>
      <div class="stat-lbl">${esc(t('ov.statDocs'))}</div>
      <div class="stat-delta flat">${esc(t('ov.statDocsSub', { n: getVitals().length }))}</div>
    </div>`);
  
    document.getElementById('overview_statTiles').innerHTML = tiles.join('');
  }
  
  /* ── Weight chart ──────────────────────────────────────────── */
  function renderChart() {
    const from = addDays(todayISO(), -90);
    const pts = vitalSeries('weight', from, '');
    const tg = P.targets || {};
    const first = pts[0], last = pts[pts.length - 1];
    document.getElementById('wSub').textContent = pts.length > 1
      ? t('tr.kgChange', { n: fmtNum(last.y - first.y, 1), date: fmtDate(first.x) }) : t('tr.kilograms');
  
    renderLineChart(document.getElementById('overview_chartWeight'), {
      title: L(METRICS.weight), unit: 'kg', dec: 1, height: 220,
      band: (num(tg.weightLow) !== null || num(tg.weightHigh) !== null)
        ? { low: tg.weightLow, high: tg.weightHigh, label: t('tr.targetRange') } : null,
      markers: treatmentMarkers(from, ''),
      series: [{ key: 'weight', label: L(METRICS.weight), color: '#2a78d6', points: pts }],
      emptyMsg: t('ov.noWeight90')
    });
  }
  
  /* ── Lists ─────────────────────────────────────────────────── */
  function renderUpcoming() {
    const list = upcomingEvents(6);
    const box = document.getElementById('upcomingBox');
    if (!list.length) {
      box.innerHTML = `<div class="empty" style="padding:30px 12px"><div class="empty-icon">📅</div>
        ${esc(t('ov.nothingScheduled'))} <a href="#calendar" style="color:var(--teal)">${esc(t('ov.addOne'))}</a>.</div>`;
      return;
    }
    box.innerHTML = list.map(e => {
      const c = eventColor(e.type);
      return `<a href="#calendar" class="mini-ev" style="text-decoration:none;color:inherit">
        <span class="ic" style="background:${c}18;color:${c}">${eventIcon(e.type)}</span>
        <span class="tx">
          <span class="t1">${esc(e.title || eventLabel(e.type))}</span>
          <span class="t2">${esc(fmtDate(e.date))}${e.time ? ' · ' + esc(e.time) : ''}${e.place ? ' · ' + esc(e.place) : ''}</span>
        </span>
        <span class="rel">${esc(relDays(e.date))}</span>
      </a>`;
    }).join('');
  }
  
  function renderRecent() {
    const list = getRecords().slice(0, 5);
    const box = document.getElementById('recentBox');
    if (!list.length) {
      box.innerHTML = `<div class="empty" style="padding:30px 12px"><div class="empty-icon">🗂</div>
        ${esc(t('ov.nothingFiled'))} <a href="#records" style="color:var(--teal)">${esc(t('ov.fileReport'))}</a>.</div>`;
      return;
    }
    box.innerHTML = list.map(r => {
      const cat = RECORD_CATEGORIES[r.category] || RECORD_CATEGORIES.other;
      return `<a href="#records" class="mini-ev" style="text-decoration:none;color:inherit">
        <span class="ic" style="background:var(--cream)">${cat.icon}</span>
        <span class="tx">
          <span class="t1">${esc(r.title)}</span>
          <span class="t2">${esc(L(cat))} · ${esc(fmtDate(r.date))}${r.source ? ' · ' + esc(r.source) : ''}</span>
        </span>
        <span class="rel" style="color:var(--text-muted)">${(r.attachments || []).length ? '📎 ' + r.attachments.length : ''}</span>
      </a>`;
    }).join('');
  }
  
  function renderLastLab() {
    const lab = getLabs()[0];
    const box = document.getElementById('lastLabBox');
    if (!lab) {
      box.innerHTML = `<div class="empty" style="padding:30px 12px"><div class="empty-icon">🧪</div>
        ${esc(t('ov.noBloodTests'))} <a href="#labs" style="color:var(--teal)">${esc(t('ov.addOneLab'))}</a>.</div>`;
      return;
    }
    const flagged = (lab.values || []).filter(v => {
      const s = rangeStatus(v.value, v.low, v.high);
      return s && s !== 'good';
    });
    box.innerHTML = `
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:11px">
        ${esc(fmtDateLong(lab.date))}${lab.source ? ' · ' + esc(lab.source) : ''}
      </div>` +
      (flagged.length
        ? flagged.slice(0, 7).map(v => {
            const def = LAB_TESTS[v.key] || {};
            const st = rangeStatus(v.value, v.low, v.high);
            return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:12.5px">
              <span>${esc(def.label ? L(def) : (v.label || v.key))}</span>
              <span style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--critical)">
                ${fmtNum(v.value, def.dec ?? 1)} ${esc(v.unit || '')}
                <span style="font-weight:400;color:var(--text-muted);font-size:11px">(${v.low ?? '–'}–${v.high ?? '–'})</span>
              </span>
            </div>`;
          }).join('') + (flagged.length > 7 ? `<div style="font-size:11.5px;color:var(--text-muted);margin-top:8px">${esc(t('ov.moreOutOfRange', { n: flagged.length - 7 }))}</div>` : '')
        : `<div class="badge badge-good">✓ ${esc(t('ov.allInRange'))}</div>`);
  }



  V_overview.show = function () {
    applyI18n();
    renderSetup();
    renderNag();
    renderHero();
    renderStats();
    renderChart();
    renderUpcoming();
    renderRecent();
    renderLastLab();
  };
})();

/* ═══ vitals.html ═══ */
(function () {
  const V_vitals = window.V_vitals = {};
  /* ── Symptom scales rendered from the metric table ─────────── */
  const SCALES = ['pain', 'nausea', 'fatigue', 'appetite', 'mood'];
  let currentRange = '30';
  
  function buildScales() {
    document.getElementById('scales').innerHTML = SCALES.map(k => {
      const m = METRICS[k];
      return `<div class="scale-row">
        <label for="f_${k}">${esc(L(m))}</label>
        <input type="range" id="f_${k}" min="0" max="10" step="1" value="0"
               oninput="V_vitals.onScale('${k}')">
        <span class="scale-val unset" id="v_${k}">–</span>
      </div>`;
    }).join('');
  }
  
  /* A slider only counts as "recorded" once it has been touched — otherwise a
     resting 0 would silently claim "no pain at all" on every entry. */
  const touched = new Set();
  function onScale(k) {
    touched.add(k);
    const el = document.getElementById('v_' + k);
    el.textContent = document.getElementById('f_' + k).value;
    el.classList.remove('unset');
  }
  
  function buildContexts() {
    document.getElementById('f_glucoseContext').innerHTML =
      Object.entries(GLUCOSE_CONTEXTS).map(([k, c]) => `<option value="${k}">${esc(L(c))}</option>`).join('');
    document.getElementById('f_glucoseContext').onchange = showGlucoseHint;
    showGlucoseHint();
  }
  function showGlucoseHint() {
    const c = GLUCOSE_CONTEXTS[document.getElementById('f_glucoseContext').value];
    document.getElementById('glucoseHint').textContent =
      c ? t('vt.sugarTarget', { low: c.low, high: c.high }) : '';
  }
  
  /* ── Modal ─────────────────────────────────────────────────── */
  function openEntry(id, forToday) {
    buildScales();
    touched.clear();
    const existing = id ? Store.find(HK.vitals, id)
      : (forToday ? getVitals().filter(v => v.date === todayISO()).pop() : null);
  
    document.getElementById('entryTitle').textContent = t(existing ? 'vt.modalEdit' : 'vt.modalAdd');
    document.getElementById('deleteBtn').style.display = existing ? '' : 'none';
    document.getElementById('f_id').value = existing ? existing.id : '';
    document.getElementById('f_date').value = existing ? existing.date : todayISO();
    document.getElementById('f_time').value = existing ? (existing.time || '') : nowHM();
  
    ['weight','glucose','systolic','diastolic','pulse','temp','spo2','notes'].forEach(k => {
      document.getElementById('f_' + k).value = existing && existing[k] != null ? existing[k] : '';
    });
    document.getElementById('f_glucoseContext').value = (existing && existing.glucoseContext) || 'fasting';
    showGlucoseHint();
  
    SCALES.forEach(k => {
      const has = existing && num(existing[k]) !== null;
      document.getElementById('f_' + k).value = has ? existing[k] : 0;
      const v = document.getElementById('v_' + k);
      v.textContent = has ? existing[k] : '–';
      v.classList.toggle('unset', !has);
      if (has) touched.add(k);
    });
  
    openModal('entryModal');
  }
  
  function saveEntry() {
    const date = document.getElementById('f_date').value;
    if (!date) { toast(t('common.pickDate'), 'error'); return; }
  
    const rec = Store.find(HK.vitals, document.getElementById('f_id').value) || {};
    rec.date = date;
    rec.time = document.getElementById('f_time').value || '';
  
    let any = false;
    ['weight','glucose','systolic','diastolic','pulse','temp','spo2'].forEach(k => {
      const v = num(document.getElementById('f_' + k).value);
      const m = METRICS[k];
      if (v !== null && (v < m.min || v > m.max)) {
        toast(t('vt.outOfRange', { label: L(m), v, min: m.min, max: m.max, unit: m.unit }), 'warning');
      }
      if (v === null) delete rec[k]; else { rec[k] = v; any = true; }
    });
  
    SCALES.forEach(k => {
      if (touched.has(k)) { rec[k] = num(document.getElementById('f_' + k).value); any = true; }
      else delete rec[k];
    });
  
    rec.glucoseContext = rec.glucose != null ? document.getElementById('f_glucoseContext').value : '';
    rec.notes = document.getElementById('f_notes').value.trim();
  
    if (!any && !rec.notes) { toast(t('vt.nothingToSave'), 'error'); return; }
  
    Store.upsert(HK.vitals, rec);
    closeModal('entryModal');
    toast(t('vt.savedReading'));
    render();
  }
  
  function deleteEntry() {
    const id = document.getElementById('f_id').value;
    if (!id) return;
    confirmAction(t('vt.deleteQ'), t('vt.deleteBody'), t('common.delete'), () => {
        Store.remove(HK.vitals, id);
        closeModal('entryModal');
        toast(t('vt.deletedReading'));
        render();
      });
  }
  
  /* ── Rendering ─────────────────────────────────────────────── */
  function setRange(key, btn) {
    currentRange = key;
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }
  
  function renderToday() {
    const today = getVitals().filter(v => v.date === todayISO());
    document.getElementById('todayHeading').textContent = fmtDateLong(todayISO());
    if (!today.length) {
      document.getElementById('todaySummary').textContent = t('vt.nothingToday');
      return;
    }
    const bits = [];
    const last = today[today.length - 1];
    if (last.weight  != null) bits.push(`${fmtNum(last.weight, 1)} kg`);
    if (last.glucose != null) bits.push(`${L(METRICS.glucose)} ${fmtNum(last.glucose, 0)} mg/dL`);
    if (last.systolic != null && last.diastolic != null) bits.push(`${last.systolic}/${last.diastolic} mmHg`);
    document.getElementById('todaySummary').textContent =
      t('vt.readingsToday', { n: today.length }) + (bits.length ? ' — ' + bits.join(', ') : '') + '.';
  }
  
  function renderStats() {
    const profile = getProfile();
    const tiles = [];
  
    /* Weight, with a 30-day delta. Direction has no inherent good/bad in cancer
       care, so the arrow is neutral unless a target range is set. */
    const w = latestVital('weight');
    if (w) {
      const d = metricDelta('weight', 30);
      let deltaHtml = `<div class="stat-delta flat">${esc(t('ov.firstReading'))}</div>`;
      if (d) {
        const dir = d.diff > 0.05 ? 'up' : d.diff < -0.05 ? 'down' : 'flat';
        const arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→';
        deltaHtml = `<div class="stat-delta flat">${arrow} ${fmtNum(Math.abs(d.diff), 1)} kg · ${esc(fmtDateShort(d.fromDate))}</div>`;
      }
      tiles.push(`<div class="stat blue">
        <div class="stat-val">${fmtNum(w.weight, 1)}<span class="unit">kg</span></div>
        <div class="stat-lbl">${esc(t('ov.statWeight', { date: fmtDateShort(w.date) }))}</div>
        ${deltaHtml}
        <div class="stat-spark" id="sparkWeight"></div>
      </div>`);
    }
  
    const g = latestVital('glucose');
    if (g) {
      const ctx = GLUCOSE_CONTEXTS[g.glucoseContext] || GLUCOSE_CONTEXTS.random;
      const st = rangeStatus(g.glucose, ctx.low, ctx.high);
      tiles.push(`<div class="stat ${st === 'good' ? 'good' : st === 'critical' ? 'critical' : 'warning'}">
        <div class="stat-val">${fmtNum(g.glucose, 0)}<span class="unit">mg/dL</span></div>
        <div class="stat-lbl">${esc(t('ov.statSugar', { ctx: L(ctx) }))}</div>
        <div style="margin-top:6px">${statusBadge(st, t(st === 'good' ? 'ov.inTarget' : 'ov.outsideTarget'))}</div>
        <div class="stat-spark" id="sparkGlucose"></div>
      </div>`);
    }
  
    const bp = getVitals().filter(v => v.systolic != null && v.diastolic != null).pop();
    if (bp) {
      const st = rangeStatus(bp.systolic, 90, 140);
      tiles.push(`<div class="stat aqua">
        <div class="stat-val">${bp.systolic}/${bp.diastolic}<span class="unit">mmHg</span></div>
        <div class="stat-lbl">${esc(t('vt.bp', { date: fmtDateShort(bp.date) }))}</div>
        <div style="margin-top:6px">${statusBadge(st, t(st === 'good' ? 'vt.normal' : 'vt.check'))}</div>
      </div>`);
    }
  
    const all = getVitals();
    const streak = (() => {
      let n = 0, d = todayISO();
      const dates = new Set(all.map(v => v.date));
      if (!dates.has(d)) d = addDays(d, -1);
      while (dates.has(d)) { n++; d = addDays(d, -1); }
      return n;
    })();
    tiles.push(`<div class="stat">
      <div class="stat-val">${all.length}</div>
      <div class="stat-lbl">${esc(t('vt.readingsLogged'))}</div>
      <div class="stat-delta flat">${esc(streak ? t('vt.streak', { n: streak }) : t('vt.startStreak'))}</div>
    </div>`);
  
    document.getElementById('vitals_statTiles').innerHTML = tiles.join('') ||
      `<div class="stat"><div class="stat-val">—</div><div class="stat-lbl">${esc(t('lb.noneYet'))}</div></div>`;
  
    renderSparkline(document.getElementById('sparkWeight'),
      vitalSeries('weight', addDays(todayISO(), -90)).map(p => p.y), '#2a78d6');
    renderSparkline(document.getElementById('sparkGlucose'),
      vitalSeries('glucose', addDays(todayISO(), -90)).map(p => p.y), '#eb6834');
  }
  
  function renderTable() {
    const from = rangeFrom(currentRange);
    const rows = getVitals().filter(v => inRange(v.date, from, '')).reverse();
    const table = document.getElementById('vitalsTable');
    const empty = document.getElementById('vitalsEmpty');
  
    if (!rows.length) {
      table.innerHTML = '';
      empty.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>
        <strong>${esc(t('vt.noneInPeriod'))}</strong>${esc(t('vt.noneInPeriodSub'))}</div>`;
      return;
    }
    empty.innerHTML = '';
  
    table.innerHTML = `
      <thead><tr>
        <th>${esc(t('common.date'))}</th><th>${esc(t('common.time'))}</th>
        <th class="num">${esc(L(METRICS.weight))}</th><th class="num">${esc(L(METRICS.glucose))}</th>
        <th>${esc(t('vt.colWhen'))}</th>
        <th class="num">${esc(L(METRICS.systolic))}</th><th class="num">${esc(L(METRICS.pulse))}</th>
        <th class="num">${esc(L(METRICS.temp))}</th>
        <th>${esc(t('vt.colSymptoms'))}</th><th>${esc(t('common.notes'))}</th><th></th>
      </tr></thead>
      <tbody>${rows.map(v => {
        const ctx = GLUCOSE_CONTEXTS[v.glucoseContext];
        const gs  = v.glucose != null && ctx ? rangeStatus(v.glucose, ctx.low, ctx.high) : null;
        const sym = SCALES.filter(k => num(v[k]) !== null)
          .map(k => `<span class="tag">${esc(L(METRICS[k]))} ${v[k]}</span>`).join('');
        return `<tr>
          <td>${esc(fmtDate(v.date))}</td>
          <td style="color:var(--text-muted)">${esc(v.time || '—')}</td>
          <td class="num">${v.weight != null ? fmtNum(v.weight, 1) : '—'}</td>
          <td class="num">${v.glucose != null ? `<span style="color:${gs === 'good' ? 'inherit' : 'var(--critical)'};font-weight:${gs === 'good' ? '400' : '600'}">${fmtNum(v.glucose, 0)}</span>` : '—'}</td>
          <td style="color:var(--text-muted);font-size:12px">${ctx ? esc(L(ctx)) : '—'}</td>
          <td class="num bp-cell">${v.systolic != null && v.diastolic != null ? v.systolic + '/' + v.diastolic : '—'}</td>
          <td class="num">${v.pulse != null ? v.pulse : '—'}</td>
          <td class="num">${v.temp != null ? fmtNum(v.temp, 1) : '—'}</td>
          <td>${sym || '<span style="color:var(--border)">—</span>'}</td>
          <td style="max-width:220px;font-size:12px;color:var(--text-2)">${esc((v.notes || '').slice(0, 90))}${(v.notes || '').length > 90 ? '…' : ''}</td>
          <td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="V_vitals.openEntry('${v.id}')">${esc(t('common.edit'))}</button></div></td>
        </tr>`;
      }).join('')}</tbody>`;
  }
  
  function render() { renderToday(); renderStats(); renderTable(); }
  
  /* Measurement labels read their names straight from METRICS. */
  function labelMetrics() {
    document.querySelectorAll('[data-metric]').forEach(el => {
      const k = el.getAttribute('data-metric'), m = METRICS[k];
      if (m) el.textContent = `${L(m)} (${m.unit})`;
    });
  }

  V_vitals.openEntry = openEntry;
  V_vitals.setRange = setRange;
  V_vitals.deleteEntry = deleteEntry;
  V_vitals.saveEntry = saveEntry;
  V_vitals.onScale = onScale;

  V_vitals.show = function () {
    applyI18n();
    labelMetrics();
    buildContexts();
    buildScales();
    render();
  };
})();

/* ═══ calendar.html ═══ */
(function () {
  const V_calendar = window.V_calendar = {};
  let view = 'month';
  let typeFilter = 'all';
  let cursor = new Date();
  let selectedType = 'consult';
  
  /* ── View switching ────────────────────────────────────────── */
  function setView(v, btn) {
    view = v;
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('viewMonth').style.display = v === 'month' ? '' : 'none';
    document.getElementById('viewList').style.display  = v === 'month' ? 'none' : '';
    render();
  }
  function setTypeFilter(t, btn) {
    typeFilter = t;
    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAgenda();
  }
  function shiftMonth(n) { cursor.setMonth(cursor.getMonth() + n); renderMonth(); }
  function gotoToday()   { cursor = new Date(); renderMonth(); }
  
  /* ── Month grid (weeks start Monday) ───────────────────────── */
  function renderMonth() {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    document.getElementById('calMonth').textContent = fmtMonthYear(cursor);
  
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7;   // Mon = 0
    const gridStart = new Date(y, m, 1 - startOffset);
  
    const events = getEvents();
    const byDate = {};
    events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
    const vitalDates = new Set(getVitals().map(v => v.date));
  
    const cells = weekdayNames().map(d => `<div class="cal-dow">${esc(d)}</div>`);
  
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const iso = todayISO(d);
      const other = d.getMonth() !== m;
      const isToday = iso === todayISO();
      const evs = byDate[iso] || [];
  
      const chips = evs.slice(0, 3).map(e => {
        const c = eventColor(e.type);
        return `<div class="cal-ev ${e.status === 'done' ? 'done' : ''}" style="border-left-color:${c}"
                     onclick="event.stopPropagation();V_calendar.openEvent('${e.id}')"
                     title="${esc(e.title || eventLabel(e.type))}">${eventIcon(e.type)} ${esc(e.title || eventLabel(e.type))}</div>`;
      }).join('');
      const more = evs.length > 3 ? `<div class="cal-more">${esc(t('cal.more', { n: evs.length - 3 }))}</div>` : '';
  
      cells.push(`<div class="cal-day ${other ? 'other' : ''} ${isToday ? 'today' : ''}" onclick="V_calendar.openEvent(null,'${iso}')">
        <div class="cal-num">${d.getDate()}</div>
        ${vitalDates.has(iso) ? `<span class="cal-vital" title="${esc(t('nav.dailyLog'))}"></span>` : ''}
        ${chips}${more}
      </div>`);
    }
  
    document.getElementById('calGrid').innerHTML = cells.join('');
    document.getElementById('calLegend').innerHTML = Object.entries(EVENT_GROUPS)
      .map(([, g]) => `<span class="legend-item"><span class="legend-swatch" style="background:${g.color}"></span>${esc(L(g))}</span>`)
      .join('');
  }
  
  /* ── Agenda list ───────────────────────────────────────────── */
  function renderAgenda() {
    let list = view === 'upcoming' ? upcomingEvents() : pastEvents();
    if (typeFilter !== 'all') list = list.filter(e => (EVENT_TYPES[e.type] || {}).group === typeFilter);
  
    const box = document.getElementById('agenda');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="empty-icon">📅</div>
        <strong>${esc(t('cal.nothingHere'))}</strong>
        ${esc(t(view === 'upcoming' ? 'cal.addNext' : 'cal.pastCollect'))}</div>`;
      return;
    }
  
    box.innerHTML = list.map(e => {
      const d = parseISO(e.date);
      const att = eventAttachments(e.id);
      const nAtt = att.records.length + att.labs.length;
      const bits = [];
      if (e.time)   bits.push('🕑 ' + e.time);
      if (e.doctor) bits.push('👤 ' + e.doctor);
      if (e.place)  bits.push('📍 ' + e.place);
      if (e.cycle)  bits.push(t('cal.cycle', { n: e.cycle }));
      return `<div class="agenda-item">
        <div class="agenda-date">
          <div class="d">${d ? d.getDate() : '?'}</div>
          <div class="m">${d ? d.toLocaleDateString('en-GB', { month: 'short' }) : ''}</div>
        </div>
        <div>
          <div class="agenda-title">
            <span>${eventIcon(e.type)}</span>
            <span>${esc(e.title || eventLabel(e.type))}</span>
            <span class="badge" style="background:${eventColor(e.type)}18;color:${eventColor(e.type)}">${esc(eventLabel(e.type))}</span>
            ${e.status === 'done' ? `<span class="badge badge-good">✓ ${esc(t('cal.done'))}</span>` : ''}
            ${e.status === 'cancelled' ? `<span class="badge badge-neutral">${esc(t('cal.cancelled'))}</span>` : ''}
            ${nAtt ? `<span class="badge badge-teal">📎 ${nAtt}</span>` : ''}
          </div>
          <div class="agenda-meta">${bits.map(esc).join(' · ')}${e.notes ? '<br>' + esc(e.notes.slice(0, 160)) + (e.notes.length > 160 ? '…' : '') : ''}</div>
        </div>
        <div style="text-align:right">
          <div class="agenda-rel">${esc(relDays(e.date))}</div>
          <button class="btn btn-outline btn-sm" style="margin-top:7px" onclick="V_calendar.openEvent('${e.id}')">${esc(t('common.open'))}</button>
        </div>
      </div>`;
    }).join('');
  }
  
  /* ── Event modal ───────────────────────────────────────────── */
  function buildTypeGrid() {
    document.getElementById('typeGrid').innerHTML = Object.entries(EVENT_TYPES).map(([k, def]) =>
      `<button type="button" class="type-opt" data-t="${k}" onclick="V_calendar.pickType('${k}')">
         <span class="ico">${def.icon}</span>${esc(L(def))}</button>`).join('');
  }
  function pickType(k) {
    selectedType = k;
    document.querySelectorAll('.type-opt').forEach(b => b.classList.toggle('sel', b.dataset.t === k));
  }
  
  function openEvent(id, date) {
    const e = id ? Store.find(HK.events, id) : null;
    document.getElementById('eventTitle').textContent = t(e ? 'cal.modalEdit' : 'cal.modalAdd');
    document.getElementById('eDeleteBtn').style.display = e ? '' : 'none';
    document.getElementById('repeatBox').style.display = e ? 'none' : '';
    document.getElementById('e_id').value = e ? e.id : '';
    document.getElementById('e_title').value  = e ? (e.title || '') : '';
    document.getElementById('e_date').value   = e ? e.date : (date || todayISO());
    document.getElementById('e_time').value   = e ? (e.time || '') : '';
    document.getElementById('e_doctor').value = e ? (e.doctor || '') : '';
    document.getElementById('e_place').value  = e ? (e.place || '') : '';
    document.getElementById('e_status').value = e ? (e.status || 'scheduled') : 'scheduled';
    document.getElementById('e_cycle').value  = e ? (e.cycle || '') : '';
    document.getElementById('e_notes').value  = e ? (e.notes || '') : '';
    document.getElementById('e_remind').value = e && e.remind != null ? String(e.remind) : '1440';
    document.getElementById('e_repeatEvery').value = '';
    document.getElementById('e_repeatCount').value = '';
    pickType(e ? e.type : 'consult');
  
    /* Anything already filed against this event */
    const links = document.getElementById('eventLinks');
    if (e) {
      const att = eventAttachments(e.id);
      const items = [
        ...att.labs.map(l => `<a href="#labs" class="tag" style="text-decoration:none">🧪 ${esc(l.title || 'Lab results')} — ${esc(fmtDate(l.date))}</a>`),
        ...att.records.map(r => `<a href="#records" class="tag" style="text-decoration:none">${(RECORD_CATEGORIES[r.category] || {}).icon || '📄'} ${esc(r.title)}</a>`)
      ];
      links.innerHTML = items.length
        ? `<div class="form-group"><label>${esc(t('cal.filedAgainst'))}</label><div>${items.join('')}</div></div>`
        : `<div class="form-group"><label>${esc(t('cal.filedAgainst'))}</label>
             <div class="hint">${esc(t('cal.nothingFiled'))}</div></div>`;
    } else {
      links.innerHTML = '';
    }
  
    openModal('eventModal');
  }
  
  function saveEvent() {
    const date = document.getElementById('e_date').value;
    if (!date) { toast(t('common.pickDate'), 'error'); return; }
  
    const base = {
      type:   selectedType,
      title:  document.getElementById('e_title').value.trim() || eventLabel(selectedType),
      date:   date,
      time:   document.getElementById('e_time').value,
      doctor: document.getElementById('e_doctor').value.trim(),
      place:  document.getElementById('e_place').value.trim(),
      status: document.getElementById('e_status').value,
      cycle:  document.getElementById('e_cycle').value,
      notes:  document.getElementById('e_notes').value.trim(),
      remind: num(document.getElementById('e_remind').value)
    };
  
    const id = document.getElementById('e_id').value;
    let saved = null;
    if (id) {
      saved = Store.upsert(HK.events, { ...Store.find(HK.events, id), ...base, id });
      toast(t('cal.updated'));
    } else {
      const every = num(document.getElementById('e_repeatEvery').value);
      const count = num(document.getElementById('e_repeatCount').value);
      if (every && count && count > 1) {
        const n = Math.min(count, 60);
        const startCycle = num(base.cycle) || 1;
        for (let i = 0; i < n; i++) {
          Store.upsert(HK.events, {
            ...base,
            date: addDays(date, every * i),
            cycle: String(startCycle + i),
            title: base.title.replace(/\s*—\s*(cycle|κύκλος)\s*\d+$/i, '') + ' — ' + t('cal.cycle', { n: startCycle + i })
          });
        }
        toast(t('cal.seriesCreated', { n, d: every }));
      } else {
        saved = Store.upsert(HK.events, base);
        toast(t('cal.added'));
      }
    }
  
    closeModal('eventModal');
    render();
    return saved;
  }
  
  function deleteEvent() {
    const id = document.getElementById('e_id').value;
    if (!id) return;
    confirmAction(t('cal.deleteQ'), t('cal.deleteBody'), t('common.delete'), () => {
        Store.remove(HK.events, id);
        closeModal('eventModal');
        toast(t('cal.deleted'));
        render();
      });
  }
  
  function render() {
    if (view === 'month') renderMonth(); else renderAgenda();
  }
  
  /* Reminder lead times and the type-filter chips come from the domain tables. */
  function buildReminderSelect() {
    document.getElementById('e_remind').innerHTML =
      REMINDERS.map(r => `<option value="${r.v}">${esc(t(r.key))}</option>`).join('');
  }
  function labelGroups() {
    document.querySelectorAll('[data-group]').forEach(el => {
      el.textContent = L(EVENT_GROUPS[el.getAttribute('data-group')]);
    });
  }
  
  /** Hand the open event to the phone's calendar app, saving it first if needed. */
  function addThisToCalendar() {
    const id = document.getElementById('e_id').value;
    if (id) { exportEventICS(Store.find(HK.events, id)); return; }
    /* Not saved yet — save it first, then hand the stored record to the calendar. */
    const saved = saveEvent();
    if (saved) exportEventICS(saved);
  }

  V_calendar.openEvent = openEvent;
  V_calendar.setView = setView;
  V_calendar.shiftMonth = shiftMonth;
  V_calendar.gotoToday = gotoToday;
  V_calendar.setTypeFilter = setTypeFilter;
  V_calendar.addThisToCalendar = addThisToCalendar;
  V_calendar.deleteEvent = deleteEvent;
  V_calendar.saveEvent = saveEvent;
  V_calendar.pickType = pickType;

  V_calendar.show = function () {
    applyI18n();
    labelGroups();
    buildTypeGrid();
    buildReminderSelect();
    render();
  };
})();

/* ═══ labs.html ═══ */
(function () {
  const V_labs = window.V_labs = {};
  let tab = 'latest';
  let customRows = [];
  
  function setTab(t, btn) {
    tab = t;
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tabLatest').style.display = t === 'latest' ? '' : 'none';
    document.getElementById('tabAll').style.display    = t === 'all' ? '' : 'none';
    render();
  }
  
  /* ── Entry form ────────────────────────────────────────────── */
  function buildPanels(existing) {
    const have = {};
    (existing?.values || []).forEach(v => { have[v.key] = v; });
  
    document.getElementById('panels').innerHTML = LAB_PANELS.map((p, i) => {
      const filled = p.tests.filter(t => have[t.key]).length;
      const rows = p.tests.map(test => {
        const v = have[test.key] || {};
        return `<div class="test-row" data-key="${test.key}">
          <span class="tname">${esc(L(test))}</span>
          <input class="val" type="number" step="any" inputmode="decimal" id="t_${test.key}" value="${v.value ?? ''}" placeholder="—">
          <span class="tunit">${esc(test.unit)}</span>
          <input class="lo" type="number" step="any" id="lo_${test.key}" value="${v.low ?? test.low}" title="${esc(t('lb.colRefLow'))}">
          <input class="hi" type="number" step="any" id="hi_${test.key}" value="${v.high ?? test.high}" title="${esc(t('lb.colRefHigh'))}">
        </div>`;
      }).join('');
      return `<details class="panel" ${i === 0 || filled ? 'open' : ''}>
        <summary><span>${esc(L(p))}</span>${filled ? `<span class="badge badge-teal">${esc(t('lb.filled', { n: filled }))}</span>` : ''}</summary>
        <div class="panel-body">
          ${testHead()}
          ${rows}
        </div>
      </details>`;
    }).join('') + '<div id="customPanel"></div>';
  
    customRows = (existing?.values || []).filter(v => v.custom);
    renderCustomRows();
  }
  
  function renderCustomRows() {
    const box = document.getElementById('customPanel');
    if (!box) return;
    if (!customRows.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<details class="panel" open>
      <summary><span>${esc(t('lb.otherTests'))}</span><span class="badge badge-teal">${customRows.length}</span></summary>
      <div class="panel-body">
        ${testHead()}
        ${customRows.map((c, i) => `<div class="test-row">
          <span class="tname">${esc(c.label)}
            <button class="btn btn-sm" style="background:none;color:var(--critical);padding:0 4px" onclick="V_labs.removeCustom(${i})" title="Remove">×</button></span>
          <input class="val" type="number" step="any" inputmode="decimal" id="tc_${i}" value="${c.value ?? ''}" placeholder="—">
          <span class="tunit">${esc(c.unit || '')}</span>
          <input class="lo" type="number" step="any" id="loc_${i}" value="${c.low ?? ''}">
          <input class="hi" type="number" step="any" id="hic_${i}" value="${c.high ?? ''}">
        </div>`).join('')}
      </div></details>`;
  }
  
  function addCustomTest() {
    const name = document.getElementById('c_name').value.trim();
    if (!name) { toast(t('lb.needName'), 'error'); return; }
    syncCustomFromDom();
    customRows.push({ key: 'x_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_'), label: name,
                      unit: document.getElementById('c_unit').value.trim(), value: '', low: '', high: '', custom: true });
    document.getElementById('c_name').value = '';
    document.getElementById('c_unit').value = '';
    renderCustomRows();
  }
  function removeCustom(i) { syncCustomFromDom(); customRows.splice(i, 1); renderCustomRows(); }
  function syncCustomFromDom() {
    customRows.forEach((c, i) => {
      const v = document.getElementById('tc_' + i);
      if (!v) return;
      c.value = v.value;
      c.low  = document.getElementById('loc_' + i).value;
      c.high = document.getElementById('hic_' + i).value;
    });
  }
  
  function buildEventSelect(selected) {
    const opts = [`<option value="">${esc(t('common.notLinked'))}</option>`].concat(
      getEvents().slice().reverse().slice(0, 120).map(e =>
        `<option value="${e.id}" ${e.id === selected ? 'selected' : ''}>${esc(fmtDate(e.date))} · ${esc(e.title || eventLabel(e.type))}</option>`)
    );
    document.getElementById('l_event').innerHTML = opts.join('');
  }
  
  function openLab(id) {
    const l = id ? Store.find(HK.labs, id) : null;
    document.getElementById('labTitle').textContent = t(l ? 'lb.modalEdit' : 'lb.modalAdd');
    document.getElementById('lDeleteBtn').style.display = l ? '' : 'none';
    document.getElementById('l_id').value     = l ? l.id : '';
    document.getElementById('l_date').value   = l ? l.date : todayISO();
    document.getElementById('l_source').value = l ? (l.source || '') : '';
    document.getElementById('l_title').value  = l ? (l.title || '') : '';
    document.getElementById('l_notes').value  = l ? (l.notes || '') : '';
    buildEventSelect(l ? l.eventId : '');
    buildPanels(l);
    openModal('labModal');
  }
  
  function saveLab() {
    const date = document.getElementById('l_date').value;
    if (!date) { toast(t('lb.dateOfTest'), 'error'); return; }
    syncCustomFromDom();
  
    const values = [];
    LAB_PANELS.forEach(p => p.tests.forEach(test => {
      const raw = document.getElementById('t_' + test.key).value;
      if (num(raw) === null) return;
      values.push({
        key: test.key, label: test.label, unit: test.unit, value: num(raw),
        low:  num(document.getElementById('lo_' + test.key).value),
        high: num(document.getElementById('hi_' + test.key).value)
      });
    }));
    customRows.forEach(c => {
      if (num(c.value) === null) return;
      values.push({ key: c.key, label: c.label, unit: c.unit, value: num(c.value),
                    low: num(c.low), high: num(c.high), custom: true });
    });
  
    if (!values.length) { toast(t('lb.needValue'), 'error'); return; }
  
    const rec = Store.find(HK.labs, document.getElementById('l_id').value) || {};
    rec.date    = date;
    rec.source  = document.getElementById('l_source').value.trim();
    rec.title   = document.getElementById('l_title').value.trim() || t('lb.defaultTitle');
    rec.eventId = document.getElementById('l_event').value;
    rec.notes   = document.getElementById('l_notes').value.trim();
    rec.values  = values;
  
    Store.upsert(HK.labs, rec);
    closeModal('labModal');
    toast(t('lb.savedN', { n: values.length }));
    render();
  }
  
  function deleteLab() {
    const id = document.getElementById('l_id').value;
    if (!id) return;
    confirmAction(t('lb.deleteQ'), t('lb.deleteBody'), t('common.delete'), () => {
      Store.remove(HK.labs, id);
      closeModal('labModal');
      toast(t('common.deleted'));
      render();
    });
  }
  
  /* ── Latest values view ────────────────────────────────────── */
  function renderLatest() {
    const labs = getLabs();                    // newest first
    const box = document.getElementById('latestBox');
    if (!labs.length) {
      box.innerHTML = `<div class="empty"><div class="empty-icon">🧪</div>
        <strong>${esc(t('lb.noneYet'))}</strong>${esc(t('lb.noneYetSub'))}</div>`;
      return;
    }
  
    /* Walk newest→oldest, keeping the first two sightings of each test. */
    const seen = {};
    labs.forEach(l => (l.values || []).forEach(v => {
      if (num(v.value) === null) return;
      (seen[v.key] = seen[v.key] || []).push({ ...v, date: l.date });
    }));
  
    const byPanel = {};
    Object.keys(seen).forEach(k => {
      const def = LAB_TESTS[k];
      const panel = def ? panelLabel(def) : t('lb.otherTests');
      (byPanel[panel] = byPanel[panel] || []).push({ key: k, hist: seen[k] });
    });
  
    const order = LAB_PANELS.map(p => L(p)).concat([t('lb.otherTests')]);
    box.innerHTML = order.filter(p => byPanel[p]).map(panel => {
      const chips = byPanel[panel].map(({ key, hist }) => {
        const cur = hist[0], prev = hist[1];
        const st = rangeStatus(cur.value, cur.low, cur.high);
        const def = LAB_TESTS[key] || {};
        const dec = def.dec ?? 1;
        let arrow = '';
        if (prev) {
          const d = cur.value - prev.value;
          if (Math.abs(d) > 1e-9) {
            arrow = `<span class="trend-arrow" style="color:var(--text-muted)" title="${esc(t('lb.was', { v: fmtNum(prev.value, dec), date: fmtDate(prev.date) }))}">${d > 0 ? '↑' : '↓'}</span>`;
          }
        }
        return `<div class="val-chip ${st && st !== 'good' ? 'out' : ''}">
          <div class="val-name">${esc(def.label ? L(def) : (cur.label || key))}</div>
          <div class="val-num">${fmtNum(cur.value, dec)}<span class="u">${esc(cur.unit || def.unit || '')}</span>${arrow}</div>
          <div class="val-ref">${cur.low != null || cur.high != null ? `${esc(t('lb.ref'))} ${cur.low ?? '–'}–${cur.high ?? '–'}` : ''} · ${esc(fmtDateShort(cur.date))}</div>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:18px">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px">${esc(panel)}</div>
        <div class="val-grid">${chips}</div></div>`;
    }).join('') + `<div class="card-note" style="margin-top:6px">${esc(t('lb.refNote'))}</div>`;
  }
  
  /* ── All results view ──────────────────────────────────────── */

              ${ev ? ` · <a href="#calendar" style="color:var(--teal)">${eventIcon(ev.type)} ${esc(ev.title || eventLabel(ev.type))}</a>` : ''}</div>
          </div>
          <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
            <span class="badge ${out ? 'badge-warning' : 'badge-good'}">${out ? `▲ ${esc(t('lb.outOfRangeN', { n: out }))}` : `✓ ${esc(t('lb.allInRange'))}`}</span>
            <button class="btn btn-outline btn-sm" onclick="V_labs.openLab('${l.id}')">${esc(t('common.edit'))}</button>
          </div>
        </div>
        <div class="val-grid">${chips}</div>

(function () {

  /* ── Filters ───────────────────────────────────────────────── */

  }
  
  function openRecord(id) {

    document.getElementById('recTitle').textContent = t(r ? 'dc.modalEdit' : 'dc.modalAdd');
    document.getElementById('rDeleteBtn').style.display = r ? '' : 'none';

  function renderAtts() {
    document.getElementById('attList').innerHTML = pendingAtts.map((a, i) => `
      <div class="att-row">
        <span>${fileIcon(a.type, a.name)}</span>

        <button class="btn btn-sm" style="background:none;color:var(--critical)" onclick="V_records.dropAtt(${i})" title="Remove">×</button>
      </div>`).join('');
  }
  function previewAtt(i) { Files.open_(pendingAtts[i]); }
  function dropAtt(i) {
    const a = pendingAtts[i];
    confirmAction(t('dc.removeFileQ'), t('dc.removeFileBody', { name: a.name }), t('common.remove'), async () => {
      await Files.del(a.id);

      renderAtts();
      toast(t('dc.fileRemoved'));

  }
  
  function fileIcon(type, name) {
    const t = (type || '') + ' ' + (name || '');
    if (/image|jpe?g|png|heic|webp/i.test(t)) return '🖼';
    if (/pdf/i.test(t))  return '📕';

  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {

  async function takeFiles(files) {

      if (f.size > 25 * 1024 * 1024) { toast(t('dc.tooBig', { name: f.name }), 'error'); continue; }

  function deleteRecord() {

    if (!id) return;
    const rec = Store.find(HK.records, id);
    confirmAction(t('dc.deleteQ'), t('dc.deleteBody', { n: (rec.attachments || []).length }), t('common.delete'), async () => {
        for (const a of (rec.attachments || [])) await Files.del(a.id);
        Store.remove(HK.records, id);
        closeModal('recModal');
        toast(t('common.deleted'));
        render();
      });

  /* ── Render ────────────────────────────────────────────────── */
  async function render() {
    buildCatFilters();
    thumbUrls.forEach(u => URL.revokeObjectURL(u));
    thumbUrls = [];
  
    const q = (document.getElementById('records_searchBox').value || '').toLowerCase().trim();

      (r.title + ' ' + (r.source || '') + ' ' + (r.notes || '') + ' ' + (r.tags || []).join(' ') + ' ' + fmtDate(r.date))
        .toLowerCase().includes(q));
  
    const box = document.getElementById('recBox');
    if (!recs.length) {
      const filtered = q || catFilter !== 'all';
      box.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">🗂</div>
        <strong>${esc(t(filtered ? 'dc.noMatch' : 'dc.emptyCabinet'))}</strong>
        ${esc(t(filtered ? 'dc.noMatchSub' : 'dc.emptyCabinetSub'))}
        ${filtered ? '' : `<div style="margin-top:16px">
          <button class="btn btn-teal" onclick="document.getElementById('folderInput').click()">${esc(t('dc.importFolder'))}</button>
          <div style="font-size:12px;margin-top:8px">${esc(t('dc.importEmptyHint'))}</div>
        </div>`}</div></div>`;
      return;
    }
  
    box.innerHTML = `<div class="rec-grid">${recs.map(r => {
      const cat = RECORD_CATEGORIES[r.category] || RECORD_CATEGORIES.other;
      const ev  = r.eventId ? Store.find(HK.events, r.eventId) : null;
      const n   = (r.attachments || []).length;
      return `<div class="rec" id="${r.id}">
        <div class="rec-thumb" id="th_${r.id}" onclick="V_records.openFirst('${r.id}')">${cat.icon}
          ${n > 1 ? `<span class="rec-count">${esc(t('dc.nFiles', { n }))}</span>` : ''}</div>
        <div class="rec-body">
          <div class="rec-cat">${cat.icon} ${esc(L(cat))}</div>
          <div class="rec-title">${esc(r.title)}</div>
          <div class="rec-meta">
            ${esc(fmtDate(r.date))}${r.source ? ' · ' + esc(r.source) : ''}
            ${ev ? `<br>${eventIcon(ev.type)} ${esc(ev.title || eventLabel(ev.type))}` : ''}
            ${r.notes ? `<br><span style="color:var(--text-2)">${esc(r.notes.slice(0, 80))}${r.notes.length > 80 ? '…' : ''}</span>` : ''}
          </div>
          ${(r.tags || []).length ? `<div style="margin-top:7px">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          <div class="rec-foot">
            <button class="btn btn-outline btn-sm" onclick="V_records.openRecord('${r.id}')">${esc(t('common.edit'))}</button>
            ${r.sourcePath && !n ? `<a class="btn btn-outline btn-sm" href="${esc(r.sourcePath)}" target="_blank">${esc(t('common.open'))}</a>` : ''}
            ${n ? `<button class="btn btn-outline btn-sm" onclick="V_records.openFirst('${r.id}')">${esc(t('common.open'))}</button>
                   <button class="btn btn-outline btn-sm" onclick="V_records.downloadAll('${r.id}')">${esc(t('dc.saveFile'))}</button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  
    /* Thumbnails for image attachments, drawn after the cards exist. */
    for (const r of recs) {
      const img = (r.attachments || []).find(a => /^image\//.test(a.type || ''));
      if (!img) continue;
      const blob = await Files.get(img.id);
      if (!blob) continue;
      const url = URL.createObjectURL(blob);
      thumbUrls.push(url);
      const el = document.getElementById('th_' + r.id);
      if (el) el.innerHTML = `<img src="${url}" alt="${esc(r.title)}">` +
        ((r.attachments || []).length > 1 ? `<span class="rec-count">${esc(t('dc.nFiles', { n: r.attachments.length }))}</span>` : '');
    }
  
    const focus = deepLinkId();
    if (focus) {
      const el = document.getElementById(focus);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  
  function openFirst(id) {
    const r = Store.find(HK.records, id);
    if (!r || !(r.attachments || []).length) { openRecord(id); return; }
    Files.open_(r.attachments[0]);
  }
  async function downloadAll(id) {
    const r = Store.find(HK.records, id);
    for (const a of (r.attachments || [])) await Files.download(a);
  }
  
  /* ══ FOLDER IMPORT ═══════════════════════════════════════════
   * Reads an existing folder of reports and files them in one pass. The browser
   * hands over the file list only after the user picks the folder, and nothing
   * leaves the machine.
   * ═════════════════════════════════════════════════════════ */
  
  let impRows = [];
  
  /* Keywords that identify a document type, in both languages. Order matters:
     the first family that matches the file name wins. */
  const CATEGORY_HINTS = [
    ['pathology',    ['βιοψ', 'ιστολογ', 'παθολογοανατ', 'κυτταρολογ', 'biops', 'histo', 'patholog', 'cytolog']],
    ['imaging',      ['αξονικ', 'μαγνητικ', 'υπερηχ', 'ακτινογραφ', 'μαστογραφ', 'σπινθηρογραφ', 'απεικον',
                      'ct', 'mri', 'pet', 'xray', 'x-ray', 'ultrasound', 'mammog', 'scan', 'scinti']],
    ['lab',          ['αιματολογ', 'βιοχημ', 'γενικη αιματος', 'ουρων', 'εξετασ', 'δεικτ',
                      'lab', 'blood', 'cbc', 'haem', 'hema', 'urine', 'marker']],
    ['discharge',    ['εξιτηρι', 'εξοδο', 'discharge']],
    ['surgery',      ['χειρουργ', 'επεμβασ', 'surg', 'operat']],
    ['oncology',     ['ογκολογ', 'χημειοθεραπ', 'ακτινοθεραπ', 'oncolog', 'chemo', 'radiother']],
    ['prescription', ['συνταγ', 'φαρμακ', 'prescript', 'medicat']],
    ['referral',     ['παραπεμπτ', 'referral']],
    ['consent',      ['συγκαταθ', 'consent']],
    ['insurance',    ['ασφαλ', 'εοπυυ', 'eopyy', 'insur']],
    ['receipt',      ['αποδειξ', 'τιμολογ', 'receipt', 'invoice']]
  ];
  
  /* Strip Greek accents so "ΑΞΟΝΙΚΉ" and "αξονικη" match the same hint. */
  function foldGreek(str) {
    return str.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .normalize('NFC');
  }
  
  function guessCategory(name) {
    const n = foldGreek(name);
    for (const [cat, words] of CATEGORY_HINTS) {
      if (words.some(w => n.includes(w))) return cat;
    }
    return 'other';
  }
  
  /** Pull a date out of the file name; fall back to the file's own timestamp. */
  function guessDate(name, lastModified) {
    const clean = name.replace(/[^0-9]/g, ' ');
    let m = /(20\d{2})\s?(\d{2})\s?(\d{2})/.exec(clean);          // 2026-08-14
    if (m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /(\d{2})\s?(\d{2})\s?(20\d{2})/.exec(clean);              // 14-08-2026
    if (m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) return `${m[3]}-${m[2]}-${m[1]}`;
    return todayISO(new Date(lastModified || Date.now()));
  }
  
  /** A readable title from the file name: drop the extension and separators. */
  function guessTitle(name) {
    return name.replace(/\.[^.]+$/, '')
               .replace(/[_]+/g, ' ')
               .replace(/\s{2,}/g, ' ')
               .trim() || name;
  }
  
  function scanFolder(input) {
    const files = [...input.files];
    input.value = '';
    if (!files.length) return;
  
    /* Anything already filed from the same folder is skipped, so importing the
       same folder twice adds only what is new. */
    /* ?? not || — a genuinely zero-byte file has size 0, which is falsy, and
       `0 || ''` would give it a different key on the way in than on the way out. */
    const known = new Set(getRecords().map(r => (r.sourceFile || '') + '|' + (r.sourceSize ?? '')));
    let skipped = 0;
  
    /* Junk names are skipped; size is deliberately NOT a filter — some browsers
       report 0 for files that are fine, and silently dropping one is unacceptable. */
    impRows = files
      .filter(f => !/^\./.test(f.name) && !/^(thumbs\.db|desktop\.ini|\.ds_store)$/i.test(f.name) && !/\.(lnk|tmp)$/i.test(f.name))
      .filter(f => {
        if (known.has(f.name + '|' + f.size)) { skipped++; return false; }
        return true;
      })
      .map(f => {
        /* webkitRelativePath starts with the folder the user picked; the rest is
           the path to use if Care Log sits inside that same folder. */
        const parts = (f.webkitRelativePath || f.name).split('/');
        const rel = parts.slice(1).join('/') || f.name;
        return {
          file: f, use: true,
          name: f.name, size: f.size, rel,
          folder: parts.length > 2 ? parts.slice(1, -1).join('/') : '',
          date: guessDate(f.webkitRelativePath || f.name, f.lastModified),
          category: guessCategory(f.webkitRelativePath || f.name),
          title: guessTitle(f.name)
        };
      })
      .sort((a, b) => b.date.localeCompare(a.date));
  
    if (!impRows.length) {
      toast(skipped ? t('dc.importSkipped', { n: skipped }) : t('dc.importNothing'), skipped ? 'info' : 'warning');
      return;
    }
  
    document.getElementById('impCount').textContent =
      t('dc.importFound', { n: impRows.length }) + (skipped ? ' ' + t('dc.importSkipped', { n: skipped }) : '');
    renderImpTable();
    openModal('importModal');
  }
  
  function renderImpTable() {
    const cats = Object.entries(RECORD_CATEGORIES);
    document.getElementById('impTable').innerHTML = `
      <thead><tr>
        <th style="width:30px"></th>
        <th>${esc(t('dc.colFile'))}</th>
        <th style="width:140px">${esc(t('common.date'))}</th>
        <th style="width:170px">${esc(t('dc.type'))}</th>
        <th>${esc(t('common.title'))}</th>
      </tr></thead>
      <tbody>${impRows.map((r, i) => `<tr>
        <td><input type="checkbox" ${r.use ? 'checked' : ''} onchange="V_records.impRows[${i}].use=this.checked;V_records.impCountUpdate()"></td>
        <td><div class="fname" title="${esc(r.rel)}">${esc(r.name)}</div>
            <div style="font-size:10px;color:var(--text-muted)">${fmtBytes(r.size)}${r.folder ? ' · ' + esc(r.folder) : ''}</div></td>
        <td><input type="date" value="${esc(r.date)}" onchange="V_records.impRows[${i}].date=this.value"></td>
        <td><select onchange="V_records.impRows[${i}].category=this.value">
          ${cats.map(([k, c]) => `<option value="${k}" ${r.category === k ? 'selected' : ''}>${c.icon} ${esc(L(c))}</option>`).join('')}
        </select></td>
        <td><input type="text" value="${esc(r.title)}" onchange="V_records.impRows[${i}].title=this.value"></td>
      </tr>`).join('')}</tbody>`;
    impCountUpdate();
  }
  
  function impCountUpdate() {
    const n = impRows.filter(r => r.use).length;
    const btn = document.getElementById('impGo');
    btn.textContent = t('dc.importBtn', { n });
    btn.disabled = n === 0;
  }
  
  function impSelectAll(on) {
    impRows.forEach(r => { r.use = on; });
    renderImpTable();
  }
  
  async function runImport() {
    const keep = document.getElementById('impKeepCopy').checked;
    const chosen = impRows.filter(r => r.use);
    if (!chosen.length) return;
  
    document.getElementById('impGo').disabled = true;
    let done = 0;
  
    for (const r of chosen) {
      const rec = {
        date: r.date, category: r.category, title: r.title,
        source: '', eventId: '', notes: '',
        tags: r.folder ? r.folder.split('/').filter(Boolean) : [],
        sourceFile: r.name, sourceSize: r.size, sourcePath: r.rel,
        attachments: []
      };
      /* Files over 25 MB (or reported as empty) are indexed by name only. */
      if (keep && r.size > 0 && r.size <= 25 * 1024 * 1024) {
        try {
          const id = await Files.put(r.file);
          rec.attachments = [{ id, name: r.name, type: r.file.type, size: r.size }];
        } catch (e) {
          toast(t('dc.storeFail', { name: r.name }), 'error');
        }
      }
      Store.upsert(HK.records, rec);
      done++;
    }
  
    closeModal('importModal');
    impRows = [];
    toast(t('dc.imported', { n: done }));
    render();
  }

  V_records.openRecord = openRecord;
  V_records.render = render;
  V_records.scanFolder = scanFolder;
  V_records.deleteRecord = deleteRecord;
  V_records.saveRecord = saveRecord;
  V_records.impSelectAll = impSelectAll;
  V_records.runImport = runImport;
  V_records.setCat = setCat;
  V_records.previewAtt = previewAtt;
  V_records.dropAtt = dropAtt;
  V_records.openFirst = openFirst;
  V_records.downloadAll = downloadAll;
  V_records.impCountUpdate = impCountUpdate;
  Object.defineProperty(V_records, 'impRows', { get: () => impRows, set: _v => { impRows = _v; } });

  V_records.show = function () {
    applyI18n();
    render();
  };
})();

/* ═══ charts.html ═══ */
(function () {
  const V_charts = window.V_charts = {};
  let range = '90';
  
  function setRange(k, btn) {
    range = k;
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }
  
  function markers() {
    if (!document.getElementById('showMarkers').checked) return [];
    return treatmentMarkers(rangeFrom(range), '');
  }
  
  /* ── Weight ────────────────────────────────────────────────── */
  function renderWeight() {
    const from = rangeFrom(range);
    const pts = vitalSeries('weight', from, '');
    const tg = getProfile().targets || {};
    const band = (num(tg.weightLow) !== null || num(tg.weightHigh) !== null)
      ? { low: tg.weightLow, high: tg.weightHigh, label: t('tr.targetRange') } : null;
  
    const first = pts[0], last = pts[pts.length - 1];
    document.getElementById('weightSub').textContent = pts.length > 1
      ? t('tr.kgChange', { n: fmtNum(last.y - first.y, 1), date: fmtDate(first.x) })
      : t('tr.kilograms');
  
    renderLineChart(document.getElementById('charts_chartWeight'), {
      title: L(METRICS.weight), unit: 'kg', dec: 1, height: 250, band, markers: markers(),
      series: [{ key: 'weight', label: L(METRICS.weight), color: '#2a78d6', points: pts }],
      emptyMsg: t('tr.noWeight')
    });
  }
  
  /* ── Blood sugar ───────────────────────────────────────────── */
  function renderGlucose() {
    const from = rangeFrom(range);
    const buckets = glucoseSeriesByContext(from, '');
    const order = ['fasting', 'postmeal', 'premeal', 'bedtime', 'random'];
    const colors = { fasting: '#2a78d6', postmeal: '#eb6834', premeal: '#1baf7a', bedtime: '#eda100', random: '#eda100' };
  
    const series = order.filter(k => buckets[k] && buckets[k].length).map(k => ({
      key: k, label: L(GLUCOSE_CONTEXTS[k]), color: colors[k], points: buckets[k]
    }));
  
    const tg = getProfile().targets || {};
    renderLineChart(document.getElementById('chartGlucose'), {
      title: L(METRICS.glucose), unit: 'mg/dL', dec: 0, height: 250, markers: markers(),
      band: { low: tg.glucoseLow || 70, high: tg.glucoseHigh || 180, label: t('tr.target') },
      series,
      emptyMsg: t('tr.noSugar')
    });
  }
  
  /* ── Blood pressure (one axis: systolic, diastolic and pulse are all
        plotted against the same numeric scale, never a second y-axis) ── */
  function renderBP() {
    const from = rangeFrom(range);
    const series = [
      { key: 'systolic',  label: L(METRICS.systolic),  color: '#2a78d6', points: vitalSeries('systolic', from, '') },
      { key: 'diastolic', label: L(METRICS.diastolic), color: '#eb6834', points: vitalSeries('diastolic', from, '') },
      { key: 'pulse',     label: L(METRICS.pulse),     color: '#1baf7a', points: vitalSeries('pulse', from, '') }
    ].filter(s => s.points.length);
  
    renderLineChart(document.getElementById('chartBP'), {
      title: t('tr.bp'), unit: '', dec: 0, height: 250, markers: markers(), series,
      emptyMsg: t('tr.noBp')
    });
  }
  
  /* ── Symptom scores ────────────────────────────────────────── */
  function renderSymptoms() {
    const from = rangeFrom(range);
    const series = [
      { key: 'pain',     label: L(METRICS.pain),     color: '#2a78d6', points: vitalSeries('pain', from, '') },
      { key: 'nausea',   label: L(METRICS.nausea),   color: '#eb6834', points: vitalSeries('nausea', from, '') },
      { key: 'fatigue',  label: L(METRICS.fatigue),  color: '#1baf7a', points: vitalSeries('fatigue', from, '') },
      { key: 'appetite', label: L(METRICS.appetite), color: '#eda100', points: vitalSeries('appetite', from, '') }
    ].filter(s => s.points.length);
  
    renderLineChart(document.getElementById('chartSymptoms'), {
      title: t('tr.felt'), unit: '/10', dec: 0, height: 250, yMin: 0, yMax: 10, markers: markers(), series,
      emptyMsg: t('tr.noSymptoms')
    });
  }
  
  /* ── Lab trend ─────────────────────────────────────────────── */
  function buildLabSelect() {
    const keys = labTestsWithData(1);
    const sel = document.getElementById('labSelect');
    if (!keys.length) {
      sel.innerHTML = `<option value="">${esc(t('tr.noLabs'))}</option>`;
      return;
    }
    const prev = sel.value;
    sel.innerHTML = keys.map(k => {
      const def = LAB_TESTS[k];
      const n = labSeries(k, '', '').length;
      return `<option value="${k}">${esc(def ? L(def) : k)} (${n})</option>`;
    }).join('');
    if (prev && keys.includes(prev)) sel.value = prev;
  }
  
  function renderLab() {
    const key = document.getElementById('labSelect').value;
    const host = document.getElementById('chartLab');
    if (!key) {
      host.innerHTML = `<div class="empty" style="padding:34px 16px"><div class="empty-icon">🧪</div>
        ${esc(t('tr.labEmpty'))}</div>`;
      document.getElementById('labSub').textContent = t('tr.labPick');
      return;
    }
  
    const def = LAB_TESTS[key] || {};
    const pts = labSeries(key, rangeFrom(range), '');
    const ref = pts.length ? pts[pts.length - 1] : {};
  
    const name = def.label ? L(def) : key;
    document.getElementById('labSub').textContent =
      `${name}${def.unit ? ' — ' + def.unit : ''}` +
      (ref.low != null || ref.high != null
        ? ' · ' + t('tr.reference', { low: ref.low ?? '–', high: ref.high ?? '–' }) : '');
  
    renderLineChart(host, {
      title: name, unit: def.unit || '', dec: def.dec ?? 1, height: 260, markers: markers(),
      band: (ref.low != null || ref.high != null) ? { low: ref.low, high: ref.high, label: t('tr.referenceRange') } : null,
      series: [{ key, label: name, color: '#2a78d6', points: pts }],
      emptyMsg: t('tr.noLabPeriod')
    });
  }
  
  function render() {
    renderWeight();
    renderGlucose();
    renderBP();
    renderSymptoms();
    buildLabSelect();
    renderLab();
  }

  V_charts.setRange = setRange;
  V_charts.render = render;
  V_charts.renderLab = renderLab;

  V_charts.show = function () {
    applyI18n();
    render();
  };
})();

  function cycleSuffix(e) {

    return new RegExp('cycle\\s*' + e.cycle + '\\b', 'i').test(title) ? '' : ` · cycle ${esc(e.cycle)}`;

  /* ── Statistics over one metric ────────────────────────────── */
  function metricStats(metric, from, to) {
    const pts = vitalSeries(metric, from, to);
    if (!pts.length) return null;
    const ys = pts.map(p => p.y);
    return {
      n: pts.length,
      min: Math.min(...ys), max: Math.max(...ys),
      avg: ys.reduce((a, b) => a + b, 0) / ys.length,
      first: pts[0], last: pts[pts.length - 1],
      change: pts[pts.length - 1].y - pts[0].y
    };
  }
  
  function statBlock(metric, from, to) {
