            return `<tr>
              <td>${esc(def.label ? L(def) : (cur.label || k))}</td>
              <td class="num" style="font-weight:600${st && st !== 'good' ? ';color:var(--critical)' : ''}">${fmtNum(cur.value, dec)} ${esc(cur.unit || '')}</td>
              <td class="num" style="color:var(--text-muted)">${prev ? fmtNum(prev.value, dec) : '—'}</td>
              <td class="num" style="color:var(--text-muted)">${change === null ? '—' : (change > 0 ? '+' : '') + fmtNum(change, dec)}</td>
              <td class="num" style="color:var(--text-muted)">${cur.low ?? '–'} – ${cur.high ?? '–'}</td>
              <td>${st ? statusBadge(st, t(st === 'good' ? 'rp.inRange' : cur.value > (cur.high ?? Infinity) ? 'rp.above' : 'rp.below')) : ''}</td>
            </tr>`;
          }).join('')}</tbody></table></div>
      </div>`).join('')}
  
      ${reportFoot()}
    </div>`;
  }
  
  /* ── Dispatch ──────────────────────────────────────────────── */
  function render() {
    const { from, to } = bounds();
    const type = document.getElementById('rptType').value;
    const fn = { visit: reportVisit, timeline: reportTimeline, metrics: reportMetrics, labs: reportLabs }[type];
    document.getElementById('rptBody').innerHTML = fn(from, to);
  }

  V_reports.render = render;
  V_reports.quickRange = quickRange;

  V_reports.show = function () {
    applyI18n();
    if (!document.getElementById('rptTo').value)   document.getElementById('rptTo').value = todayISO();
    if (!document.getElementById('rptFrom').value) document.getElementById('rptFrom').value = addDays(todayISO(), -90);
    render();
  };
})();

/* ═══ settings.html ═══ */
(function () {
  const V_settings = window.V_settings = {};
  const PROFILE_FIELDS = ['name','dob','heightCm','bloodType','phone','allergies',
                          'diagnosis','stage','diagnosedOn','oncologist','hospital','notes'];
  const TARGET_FIELDS  = ['weightLow','weightHigh','glucoseLow','glucoseHigh'];
  
  function loadForm() {
    const p = getProfile();
    PROFILE_FIELDS.forEach(k => { const el = document.getElementById('p_' + k); if (el) el.value = p[k] ?? ''; });
    TARGET_FIELDS.forEach(k => { const el = document.getElementById('t_' + k); if (el) el.value = p.targets[k] ?? ''; });
  }
  
  function saveAll() {
    const p = getProfile();
    PROFILE_FIELDS.forEach(k => { const el = document.getElementById('p_' + k); if (el) p[k] = el.value.trim(); });
    TARGET_FIELDS.forEach(k => { const el = document.getElementById('t_' + k); if (el) p.targets[k] = el.value === '' ? '' : num(el.value); });
  
    const lo = num(p.targets.weightLow), hi = num(p.targets.weightHigh);
    if (lo !== null && hi !== null && lo > hi) { toast(t('st.badWeightTarget'), 'error'); return; }
    const glo = num(p.targets.glucoseLow), ghi = num(p.targets.glucoseHigh);
    if (glo !== null && ghi !== null && glo > ghi) { toast(t('st.badSugarTarget'), 'error'); return; }
  
    saveProfile(p);
    toast(t('common.saved'));
    setTimeout(() => location.reload(), 700);   // refresh the sidebar patient name
  }
  
  /* ── Medication ────────────────────────────────────────────── */
  function renderMeds() {
    const meds = getMeds();
    const box = document.getElementById('medBox');
    if (!meds.length) {
      box.innerHTML = `<div class="empty" style="padding:26px 12px"><div class="empty-icon">💊</div>${esc(t('st.noMeds'))}</div>`;
      return;
    }
    box.innerHTML = meds.map(m => `<div class="med-row ${m.active === false ? 'off' : ''}">
      <span style="font-size:18px">💊</span>
      <span style="flex:1;min-width:0">
        <div class="med-name">${esc(m.name)} ${m.dose ? `<span style="font-weight:400;color:var(--text-muted)">${esc(m.dose)}</span>` : ''}</div>
        <div class="med-meta">${esc([m.schedule, m.startDate ? t('st.since', { date: fmtDate(m.startDate) }) : ''].filter(Boolean).join(' · '))}
          ${m.active === false ? `<span class="badge badge-neutral" style="margin-left:6px">${esc(t('st.stopped'))}</span>` : ''}</div>
      </span>
      <button class="btn btn-outline btn-sm" onclick="V_settings.openMed('${m.id}')">${esc(t('common.edit'))}</button>
    </div>`).join('');
  }
  
  function openMed(id) {
    const m = id ? Store.find(HK.meds, id) : null;
    document.getElementById('medTitle').textContent = t(m ? 'st.medModalEdit' : 'st.medModalAdd');
    document.getElementById('mDeleteBtn').style.display = m ? '' : 'none';
    document.getElementById('m_id').value        = m ? m.id : '';
    document.getElementById('m_name').value      = m ? m.name : '';
    document.getElementById('m_dose').value      = m ? (m.dose || '') : '';
    document.getElementById('m_schedule').value  = m ? (m.schedule || '') : '';
    document.getElementById('m_startDate').value = m ? (m.startDate || '') : '';
    document.getElementById('m_notes').value     = m ? (m.notes || '') : '';
    document.getElementById('m_active').value    = m && m.active === false ? 'no' : 'yes';
    openModal('medModal');
  }
  
  function saveMed() {
    const name = document.getElementById('m_name').value.trim();
    if (!name) { toast(t('st.medNeedName'), 'error'); return; }
    const rec = Store.find(HK.meds, document.getElementById('m_id').value) || {};
    rec.name      = name;
    rec.dose      = document.getElementById('m_dose').value.trim();
    rec.schedule  = document.getElementById('m_schedule').value.trim();
    rec.startDate = document.getElementById('m_startDate').value;
    rec.notes     = document.getElementById('m_notes').value.trim();
    rec.active    = document.getElementById('m_active').value === 'yes';
    Store.upsert(HK.meds, rec);
    closeModal('medModal');
    toast(t('common.saved'));
    renderMeds();
  }
  
  function deleteMed() {
    const id = document.getElementById('m_id').value;
    confirmAction(t('st.medRemoveQ'), t('st.medRemoveBody'), t('common.remove'), () => {
      Store.remove(HK.meds, id);
      closeModal('medModal');
      renderMeds();
      toast(t('common.deleted'));
    });
  }
  
  /* ── Backup ────────────────────────────────────────────────── */
  function renderBackupStatus() {
    const since = daysSinceBackup();
    const el = document.getElementById('backupStatus');
    if (since === null) {
      el.innerHTML = `<span class="badge badge-warning">▲ ${esc(t('st.neverBackedUp'))}</span>`;
    } else if (since > BACKUP_NAG_DAYS) {
      el.innerHTML = `<span class="badge badge-warning">▲ ${esc(t('st.lastBackupDays', { n: since }))}</span>`;
    } else {
      el.innerHTML = `<span class="badge badge-good">✓ ${esc(since === 0 ? t('st.lastBackupToday') : t('st.lastBackupNDays', { n: since }))}</span>`;
    }
  }
  
  async function doBackup(withFiles = true) {
    toast(t('st.preparing'), 'info');
    try {
      const r = await exportBackup(withFiles);
      toast(withFiles
        ? t('st.backupSaved', { records: r.records, files: r.files, size: fmtBytes(r.bytes) })
        : t('st.backupSavedNoFiles', { records: r.records, size: fmtBytes(r.bytes) }));
      renderBackupStatus();
      renderStorage();
    } catch (e) {
      toast(t('st.backupFailed', { msg: e.message }), 'error');
    }
  }
  
  function doRestore(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';
    confirmAction(t('st.restoreQ'), t('st.restoreBody'), t('st.mergeIn'), async () => {
        try {
          const r = await importBackup(file, 'merge');
          toast(t('st.restored', { records: r.records, files: r.files }));
          setTimeout(() => location.reload(), 1000);
        } catch (e) {
          toast(e.message, 'error');
        }
      }, false);
  }
  
  /* ── Storage readout ───────────────────────────────────────── */
  async function renderStorage() {
    let lsBytes = 0;
    Object.values(HK).forEach(k => { lsBytes += (localStorage.getItem(k) || '').length * 2; });
    const fileBytes = await Files.totalBytes().catch(() => 0);
  
    let quotaTxt = '';
    let pct = null;
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const est = await navigator.storage.estimate();
        if (est.quota) {
          pct = Math.min(((est.usage || 0) / est.quota) * 100, 100);
          quotaTxt = t('st.quotaLine', { used: fmtBytes(est.usage || 0), quota: fmtBytes(est.quota) });
        }
      } catch {}
    }
  
    document.getElementById('storageBox').innerHTML = `
      <div class="stats" style="margin-bottom:14px">
        <div class="stat blue"><div class="stat-val">${getVitals().length}</div><div class="stat-lbl">${esc(t('st.dailyReadings'))}</div></div>
        <div class="stat aqua"><div class="stat-val">${getEvents().length}</div><div class="stat-lbl">${esc(t('st.calendarEvents'))}</div></div>
        <div class="stat orange"><div class="stat-val">${getLabs().length}</div><div class="stat-lbl">${esc(t('st.labSets'))}</div></div>
        <div class="stat"><div class="stat-val">${getRecords().length}</div><div class="stat-lbl">${esc(t('st.documents'))}</div></div>
      </div>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.7">
        ${esc(t('st.recordsText'))} <strong>${fmtBytes(lsBytes)}</strong><br>
        ${esc(t('st.scannedDocs'))} <strong>${fmtBytes(fileBytes)}</strong>
      </div>
      ${pct !== null ? `<div class="store-bar"><div class="store-fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div style="font-size:11px;color:var(--text-muted)">${esc(quotaTxt)}</div>` : ''}`;
  }
  
  /* ── Wipe ──────────────────────────────────────────────────── */
  function wipeAll() {
    confirmAction(t('st.eraseQ'), t('st.eraseQBody'), t('st.eraseConfirm'), () => {
        confirmAction(t('st.eraseQ2'), t('st.eraseQ2Body'), t('st.eraseYes'), async () => {
            for (const r of getRecords()) for (const a of (r.attachments || [])) await Files.del(a.id).catch(() => {});
            Object.values(HK).forEach(k => localStorage.removeItem(k));
            toast(t('st.erased'));
            setTimeout(() => location.reload(), 900);
          });
      });
  }

  V_settings.doBackup = doBackup;
  V_settings.saveAll = saveAll;
  V_settings.openMed = openMed;
  V_settings.doRestore = doRestore;
  V_settings.wipeAll = wipeAll;
  V_settings.deleteMed = deleteMed;
  V_settings.saveMed = saveMed;

  V_settings.show = function () {
    applyI18n();
    document.getElementById('lang' + (getLang() === 'el' ? 'El' : 'En')).classList.add('on');
    loadForm();
    renderMeds();
    renderBackupStatus();
    renderStorage();
  };
})();
</script>
<script>
/* ═══ shell: sidebar and hash router ═══ */
(function () {
  'use strict';

  var VIEWS = ["overview","vitals","calendar","labs","records","charts","reports","settings"];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function buildShell() {
    var profile = getProfile();
    var lang = getLang();

    var patient = profile.name
      ? '<div class="h-patient">' + escapeHtml(profile.name) +
        (profile.diagnosis ? '<small>' + escapeHtml(profile.diagnosis) + '</small>' : '') + '</div>'
      : '<div class="h-patient"><a href="#settings" style="color:var(--gold-light);text-decoration:none">' +
        escapeHtml(t('app.setupPatient')) + '</a></div>';

    var since = daysSinceBackup();
    var stale = since === null || since > 14;
    var backupTxt = since === null ? t('backup.never')
                  : since === 0    ? t('backup.today')
                                   : t('backup.daysAgo', { n: since });

    var html = '<aside id="h-sidebar">' +
        '<div class="h-brand">' +
          '<div class="h-brand-name">Care<span>·</span>Log</div>' +
          '<div class="h-brand-sub">' + escapeHtml(t('app.tagline')) + '</div>' +
        '</div>' +
        patient +
        '<div class="h-section">' + escapeHtml(t('nav.daily')) + '</div>' + '<a href="#overview" class="h-link" data-view="overview"><i class="h-link-icon">⬡</i>' + escapeHtml(t('nav.overview')) + '</a>' +
        '<a href="#vitals" class="h-link" data-view="vitals"><i class="h-link-icon">◔</i>' + escapeHtml(t('nav.dailyLog')) + '</a>' +
        '<a href="#calendar" class="h-link" data-view="calendar"><i class="h-link-icon">📅</i>' + escapeHtml(t('nav.calendar')) + '</a>' +
        '<div class="h-section">' + escapeHtml(t('nav.records')) + '</div>' + '<a href="#labs" class="h-link" data-view="labs"><i class="h-link-icon">🧪</i>' + escapeHtml(t('nav.labs')) + '</a>' +
        '<a href="#records" class="h-link" data-view="records"><i class="h-link-icon">🗂</i>' + escapeHtml(t('nav.documents')) + '</a>' +
        '<div class="h-section">' + escapeHtml(t('nav.review')) + '</div>' + '<a href="#charts" class="h-link" data-view="charts"><i class="h-link-icon">📊</i>' + escapeHtml(t('nav.trends')) + '</a>' +
        '<a href="#reports" class="h-link" data-view="reports"><i class="h-link-icon">📄</i>' + escapeHtml(t('nav.reports')) + '</a>' +
        '<a href="#settings" class="h-link" data-view="settings"><i class="h-link-icon">⚙</i>' + escapeHtml(t('nav.settings')) + '</a>' +
        '<div class="h-foot">' +
          '<div class="h-lang">' +
            '<button class="h-lang-btn' + (lang === 'en' ? ' on' : '') + '" onclick="setLang(\'en\')">EN</button>' +
            '<button class="h-lang-btn' + (lang === 'el' ? ' on' : '') + '" onclick="setLang(\'el\')">ΕΛ</button>' +
          '</div>' +
          '<div class="h-store"><span class="h-store-dot' + (stale ? ' warn' : '') + '"></span>' +
          '<a href="#settings" style="color:inherit;text-decoration:none">' + escapeHtml(backupTxt) + '</a></div>' +
        '</div>' +
      '</aside>' +
      '<div id="h-overlay"></div>' +
      '<button id="h-burger" aria-label="Menu">&#9776;</button>';

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    while (wrap.firstChild) document.body.insertBefore(wrap.firstChild, document.body.firstChild);

    var side = document.getElementById('h-sidebar');
    var over = document.getElementById('h-overlay');
    document.getElementById('h-burger').addEventListener('click', function () {
      side.classList.toggle('open'); over.classList.toggle('open');
    });
    over.addEventListener('click', function () {
      side.classList.remove('open'); over.classList.remove('open');
    });
  }

  function currentView() {
    var h = (location.hash || '').replace(/^#/, '');
    return VIEWS.indexOf(h) >= 0 ? h : VIEWS[0];
  }

  function route() {
    var view = currentView();
    VIEWS.forEach(function (v) {
      var el = document.getElementById('view-' + v);
      if (el) el.hidden = v !== view;
    });
    document.querySelectorAll('.h-link').forEach(function (a) {
      a.classList.toggle('active', a.dataset.view === view);
    });
    /* Render on show, never before: a chart measured while hidden has no width. */
    var ns = window['V_' + view];
    if (ns && ns.show) ns.show();
    document.title = 'Care Log — ' + t(({
      overview: 'nav.overview', vitals: 'nav.dailyLog', calendar: 'nav.calendar',
      labs: 'nav.labs', records: 'nav.documents', charts: 'nav.trends',
      reports: 'nav.reports', settings: 'nav.settings'
    })[view]);
    document.getElementById('h-sidebar').classList.remove('open');
    document.getElementById('h-overlay').classList.remove('open');
    window.scrollTo(0, 0);
  }

  function start() {
    buildShell();
    window.addEventListener('hashchange', route);
    route();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
